<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEEP FALL — 落ち続ける爆弾アクション</title>
<style>
:root{
  --bg:#0a0710;
  --bg2:#160f22;
  --line:#2c1f45;
  --ink:#f4ecff;
  --dim:#9a86c4;
  --hot:#ff6a3d;
  --hot2:#ffd23d;
  --cool:#3de1ff;
  --p1:#5ad2ff;
  --p2:#ff7ac8;
}

*{box-sizing:border-box}
html{height:100%}
/* body は min-height。中身が画面より高くなったら body ごと伸びるので、
   はみ出した上端も残らずスクロールで届く。 */
body{min-height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 50% -10%, #2a1a45 0%, transparent 60%),
    radial-gradient(900px 600px at 90% 110%, #3a1030 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  display:flex;
  /* center ではなく flex-start ＋ margin:auto。
     中身が画面より縦に長くなった時、center だと上にはみ出した分が
     スクロールしても出てこない（HUD のラベル行が切れる）。 */
  align-items:flex-start;
  justify-content:center;
  padding:12px;
  overflow-x:hidden;
}

#app{
  /* 横 640px と、画面の高さから HUD・凡例の分を引いた幅の小さい方。
     0.9375 は canvas の 600/640（幅÷高さ）。これで縦にも必ず収まる。 */
  /* 下限 520px は HUD が1行に収まる幅（セル 438 ＋ 隙間 40 ＋ 内外の余白 34、
     シールドは上限突破の5枚ぶんを確保した幅）。
     ここを削って HUD を2行に折り返させても、増える高さは同じくらいなので
     得が無い。画面が低い時は縦にスクロールさせる。 */
  width:min(640px, 100%, max(520px, calc((100dvh - 150px) * 0.9375)));
  min-width:0;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* ---------- HUD ---------- */
#hud{
  display:flex;
  /* どうしても1行に入らない幅の時は、重ねるのではなく折り返す */
  flex-wrap:wrap;
  gap:10px;
  background:linear-gradient(180deg,#1d1430,#130d20);
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 10px;
  box-shadow:0 6px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
}
.hud-cell{display:flex;flex-direction:column;gap:2px;min-width:58px;white-space:nowrap;flex-shrink:0}
.hud-depth{min-width:86px}
/* 早送りでスコアが7桁まで伸びるので、その幅を確保しておく */
.hud-score-cell{min-width:100px}
.hud-depth .hud-value{font-size:24px;color:#ffd23d}
.hud-depth small{font-size:12px;opacity:.7;margin-left:1px}
.hud-grow{flex:1;align-items:flex-end;min-width:0}
.hud-label{font-size:9px;letter-spacing:.14em;color:var(--dim)}
.hud-value{
  font-size:18px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(255,210,61,.35);
}
.hud-small{font-size:14px;white-space:nowrap}
/* 桁が増えた時の縮小。枠を広げる代わりに字を小さくする */
.hud-value.long{font-size:15px}
.hud-value.longer{font-size:13px}
.hud-value.warn{color:var(--hot);animation:pulse .6s infinite}
.hud-value.bump{animation:bump .25s ease-out}
@keyframes pulse{50%{opacity:.35}}
@keyframes bump{0%{transform:scale(1.5);color:var(--hot2)}100%{transform:scale(1)}}

/* ---------- 爆弾の残数 ---------- */
/* 最大9個のピップと数値が隣のセルへはみ出さない幅を確保しておく */
.hud-ammo{align-items:flex-end;min-width:128px}
.ammo-row{display:flex;align-items:center;gap:8px}
.pips{display:flex;gap:2px}
.pip{
  width:7px;height:7px;border-radius:50%;
  border:1px solid #4a3a6b;
  background:#1a1230;
  transition:background .12s ease, box-shadow .12s ease;
}
.pip.on{
  background:radial-gradient(circle at 35% 30%,#ffe9a8,#ff9a3c 60%,#c2521a);
  border-color:#ffb35c;
  box-shadow:0 0 7px rgba(255,150,60,.8);
}
.ammo-count{
  font-size:19px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;
  color:#ffd9a8;
  min-width:38px;text-align:right;
}
.ammo-count i{font-style:normal;font-size:11px;opacity:.5;font-weight:600}
.hud-ammo.empty .ammo-count{color:var(--hot);animation:pulse .5s infinite}
.hud-ammo.bump .ammo-count{animation:bump .25s ease-out}
#touch-ammo{
  position:absolute;right:6px;bottom:4px;
  font-size:13px;font-weight:800;color:#ffd9a8;
}
.tbtn.big{position:relative}

/* シールド。持っているかどうかが常に見えていないと存在を忘れる。
   幅は上限突破の5枚ぶん（11px×5 ＋ 隙間2px×4）を最初から確保しておく */
.hud-shield{min-width:66px}
.hud-shield .pips{padding-top:4px}
.pip.sh{width:11px;height:11px;border-radius:3px;transform:rotate(45deg)}
.pip.sh.on{
  background:radial-gradient(circle at 35% 30%,#e8fbff,#8ce8ff 55%,#2f8fb8);
  border-color:#bff0ff;
  box-shadow:0 0 9px rgba(140,232,255,.9);
}
.hud-shield.none{opacity:.4}
/* 上限突破ぶん。場所は常に取っておき、持っている時だけ見せる。
   持った瞬間に幅が変わると、隣の数値まで動いて読めなくなる。 */
.pip.sh.extra{visibility:hidden}
.hud-shield.over .pip.sh.extra{visibility:visible}
.hud-shield.over .pip.sh.extra.on{
  background:radial-gradient(circle at 35% 30%,#fff0fb,#ff7ac8 55%,#a8318a);
  border-color:#ffc4ec;
  box-shadow:0 0 11px rgba(255,122,200,.95);
}
.hud-shield.fire .pips{animation:shFire .5s ease-out}
@keyframes shFire{
  0%{transform:scale(1.6);filter:brightness(2.2)}
  100%{transform:scale(1);filter:none}
}

/* ---------- stage ---------- */
#stage-wrap{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 18px 50px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.03);
  background:#08060e;
  line-height:0;
}
canvas#game{
  display:block;
  width:100%;
  height:auto;
  image-rendering:auto;
  touch-action:none;
}

/* ---------- overlay ---------- */
.overlay{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(8,5,15,.78);
  backdrop-filter:blur(3px);
  line-height:1.5;
  transition:opacity .18s ease;
}
.overlay.hidden{opacity:0;pointer-events:none}
.panel{
  text-align:center;
  padding:22px 26px;
  max-width:88%;
}
.panel h1{
  margin:0 0 4px;
  font-size:clamp(30px,7vw,48px);
  letter-spacing:.06em;
  background:linear-gradient(180deg,#fff3c4,var(--hot2) 45%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,106,61,.5));
}
.panel h2{margin:0 0 10px;font-size:clamp(20px,5vw,30px);letter-spacing:.05em}
.panel .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.panel .rows{display:flex;flex-direction:column;gap:8px;align-items:center;margin:14px 0}
.panel .stat{font-size:14px;color:var(--dim)}
.panel .stat b{color:var(--ink);font-size:17px}
.blink{animation:pulse 1s infinite;font-weight:700;color:var(--hot2);font-size:14px}

.menu{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.menu button{
  font:inherit;font-weight:700;font-size:15px;
  color:var(--ink);
  background:linear-gradient(180deg,#2a1c45,#1a1130);
  border:1px solid #402f66;
  border-radius:10px;
  padding:11px 18px;
  cursor:pointer;
  transition:transform .08s ease, box-shadow .15s ease, border-color .15s;
}
.menu button:hover,.menu button:focus-visible{
  border-color:var(--hot2);
  box-shadow:0 0 0 1px rgba(255,210,61,.4),0 8px 22px rgba(255,106,61,.25);
  outline:none;
}
.menu button:active{transform:translateY(2px)}
.menu button small{display:block;font-weight:500;font-size:11px;color:var(--dim);margin-top:3px}

.tips{font-size:11.5px;color:var(--dim);margin-top:12px;line-height:1.7}
.tips code{
  background:#241a3b;border:1px solid #392a5c;border-radius:4px;
  padding:1px 5px;font-size:11px;color:#ffe9a8;
}

/* ---------- 広告枠 ----------
   何が広告なのかを隠さないこと。ラベルと枠線でゲーム画面と明確に分ける。 */
.ad-wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.ad-head{
  display:flex;align-items:center;gap:8px;
  width:min(300px,80vw);
}
.ad-label{
  font-size:9px;font-weight:800;letter-spacing:.18em;
  color:#0d0a16;background:#9a86c4;
  border-radius:3px;padding:2px 6px;
}
.ad-note{font-size:10px;color:var(--dim)}
.ad-slot{
  width:min(300px,80vw);
  aspect-ratio:300/250;
  border:1px solid #4a3a6b;
  border-radius:10px;
  overflow:hidden;
  background:#150e26;
  display:flex;
}
.ad-creative{
  flex:1;display:flex;flex-direction:column;gap:8px;
  padding:16px 18px;text-align:left;cursor:pointer;
  background:
    radial-gradient(120% 80% at 100% 0%, color-mix(in srgb, var(--ad) 22%, transparent) 0%, transparent 60%),
    linear-gradient(180deg,#1d1533,#120c20);
  transition:filter .15s ease;
}
.ad-creative:hover{filter:brightness(1.15)}
.ad-tag{
  align-self:flex-start;
  font-size:9px;font-weight:700;letter-spacing:.14em;
  color:var(--ad);border:1px solid var(--ad);
  border-radius:3px;padding:1px 5px;opacity:.85;
}
.ad-title{font-size:16px;font-weight:800;line-height:1.35;color:var(--ink);text-wrap:balance}
.ad-body{font-size:11.5px;line-height:1.75;color:var(--dim);flex:1}
.ad-cta{
  font-size:12px;font-weight:800;color:var(--ad);
  align-self:flex-start;
  border-bottom:1px solid color-mix(in srgb, var(--ad) 50%, transparent);
  padding-bottom:2px;
}
.ad-skip{
  font:inherit;font-weight:700;font-size:13px;
  color:var(--ink);
  background:linear-gradient(180deg,#2a1c45,#1a1130);
  border:1px solid #402f66;border-radius:8px;
  padding:8px 20px;cursor:pointer;
  min-width:120px;
}
.ad-skip:disabled{opacity:.45;cursor:default}
.ad-skip:not(:disabled):hover{border-color:var(--hot2)}

/* ---------- combo banner ---------- */
#combo-banner{
  position:absolute;left:50%;top:22%;
  transform:translate(-50%,-50%) scale(.6);
  font-size:clamp(22px,6vw,40px);
  font-weight:900;font-style:italic;letter-spacing:.04em;
  color:#fff;
  text-shadow:0 0 18px var(--hot),0 0 40px var(--hot),0 3px 0 #7a1f00;
  opacity:0;pointer-events:none;white-space:nowrap;
  line-height:1;
}
#combo-banner.show{animation:comboPop .85s cubic-bezier(.16,1.1,.3,1) forwards}
@keyframes comboPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(2deg)}
  40%{transform:translate(-50%,-50%) scale(1) rotate(0)}
  75%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}
}

/* ---------- ご褒美の間（200m ごと） ----------
   何をもらったのかが文字で残らないと、ただ光っただけで終わってしまう。 */
#reward-toast{
  /* 上のほうに置く。中央だとプレイヤー自身と、22% にある
     コンボ/地層バナーの両方に重なって読めない */
  position:absolute;left:50%;top:12%;
  transform:translate(-50%,-50%);
  min-width:236px;max-width:82%;
  padding:13px 20px 14px;
  border-radius:12px;
  border:1px solid var(--rw,#ffe066);
  background:linear-gradient(180deg,rgba(24,17,40,.94),rgba(12,8,22,.94));
  box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 26px -6px var(--rw,#ffe066);
  text-align:center;
  /* #stage-wrap が line-height:0（canvas の余白を消すため）なので、
     指定しないと行が全部重なって読めない */
  line-height:1.35;
  opacity:0;pointer-events:none;
}
#reward-toast .rw-name{
  font-size:20px;font-weight:900;line-height:1.25;letter-spacing:.04em;color:var(--rw,#ffe066);
  text-shadow:0 0 16px var(--rw,#ffe066);
}
#reward-toast .rw-depth{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--dim);margin-bottom:2px}
#reward-toast .rw-got{
  display:flex;flex-wrap:wrap;gap:4px 6px;justify-content:center;margin-top:8px;
}
#reward-toast .rw-got span{
  font-size:12px;font-weight:700;color:#f4ecff;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.06);
  border-radius:999px;padding:2px 9px;
}
#reward-toast .rw-bonus{font-size:13px;font-weight:800;color:#ffd23d;margin-top:7px}
#reward-toast.show{animation:rwPop 2.6s cubic-bezier(.16,1.1,.3,1) forwards}
@keyframes rwPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  10%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
  18%{transform:translate(-50%,-50%) scale(1)}
  80%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-72%) scale(.96)}
}

/* ---------- touch ---------- */
/* 落ちるゲームなので上入力が無い。横・急降下・爆弾の3つだけを大きく置く */
#touch{display:none;justify-content:center;align-items:center;gap:10px;padding:4px 2px}
.tbtn.wide{width:88px}
.tbtn{
  width:56px;height:56px;border-radius:14px;
  font-size:19px;font-weight:800;
  color:var(--ink);
  background:linear-gradient(180deg,#2a1c45,#160f28);
  border:1px solid #402f66;
  user-select:none;-webkit-user-select:none;touch-action:none;
}
.tbtn.big{width:76px;height:76px;font-size:30px;border-color:var(--hot)}
.tbtn:active{background:#3d2a63;transform:scale(.94)}
@media (hover:none) and (pointer:coarse){ #touch{display:flex} #legend{display:none} }

/* ---------- legend ---------- */
#legend{
  display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;
  font-size:11px;color:var(--dim);
}
#legend b{color:#ffe9a8;font-weight:700}

/* ---------- 演出を抑える設定 ----------
   クラスは JS（BM.a11y）が付ける。OS の prefers-reduced-motion を既定にしつつ、
   OS 設定を変えられない人が手動でも切り替えられるようにするため、
   メディアクエリではなくクラスで一元管理している。

   ここで止めるのは「動き」と「点滅」。色や配置は変えない。
   レイアウトまで変えると、抑えた人だけ別の画面を見ることになる。 */
.reduce-motion #combo-banner.show,
.reduce-motion #reward-toast.show{
  animation:none;
  opacity:1;
}
/* 動かさない代わりに、出て消えるだけにする */
.reduce-motion #combo-banner.show{ animation:rmFade 1.2s linear forwards; transform:translate(-50%,-50%) }
.reduce-motion #reward-toast.show{ animation:rmFade 2.6s linear forwards; transform:translate(-50%,-50%) }
@keyframes rmFade{ 0%{opacity:0} 6%{opacity:1} 88%{opacity:1} 100%{opacity:0} }

/* 点滅をやめる。低残弾や記録更新は色だけで示す */
.reduce-motion .hud-value.warn,
.reduce-motion .hud-ammo.empty .ammo-count,
.reduce-motion .blink{ animation:none; opacity:1 }
/* 拡大縮小をやめる */
.reduce-motion .hud-value.bump,
.reduce-motion .hud-ammo.bump .ammo-count,
.reduce-motion .hud-shield.fire .pips{ animation:none; transform:none; filter:none }
.reduce-motion .menu button:active{ transform:none }
.reduce-motion .ad-creative{ transition:none }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💣</text></svg>">
</head>
<body>
<div id="app">

  <header id="hud">
    <div class="hud-cell hud-depth">
      <span class="hud-label">DEPTH</span>
      <span id="hud-depth" class="hud-value">0<small>m</small></span>
    </div>
    <div class="hud-cell hud-score-cell">
      <span class="hud-label">SCORE</span>
      <span id="hud-score" class="hud-value">0</span>
    </div>
    <div class="hud-cell">
      <span class="hud-label">BEST</span>
      <span id="hud-best" class="hud-value hud-small">0m</span>
    </div>
    <div class="hud-cell hud-shield" id="hud-shield">
      <span class="hud-label">SHIELD</span>
      <span id="shield-pips" class="pips"></span>
    </div>
    <div class="hud-cell hud-grow hud-ammo">
      <span class="hud-label">BOMBS</span>
      <span class="ammo-row">
        <span id="ammo-pips" class="pips"></span>
        <span id="ammo-count" class="ammo-count">3<i>/9</i></span>
      </span>
    </div>
  </header>

  <div id="stage-wrap">
    <canvas id="game" width="600" height="640"></canvas>

    <div id="overlay" class="overlay">
      <div class="panel" id="panel"></div>
    </div>

    <div id="combo-banner"></div>
    <div id="reward-toast"></div>
  </div>

  <div id="touch" aria-hidden="true">
    <button class="tbtn wide" data-key="ArrowLeft">◀</button>
    <button class="tbtn big" data-key=" ">💣<b id="touch-ammo">3</b></button>
    <button class="tbtn" data-key="ArrowDown">▼</button>
    <button class="tbtn wide" data-key="ArrowRight">▶</button>
  </div>

  <footer id="legend">
    <span><b>← →</b> 横移動</span>
    <span><b>↓</b> 急降下</span>
    <span><b>Space</b> 爆弾を落とす</span>
    <span><b>P</b> ポーズ / <b>M</b> 音楽 / <b>N</b> 効果音 / <b>R</b> 演出を抑える</span>
  </footer>

</div>

<script>
/* =========================================================
   DEEP FALL — 定数・共通ユーティリティ

   落ち続けることだけが生きている条件。
   地面に触れた瞬間に終わり。隙間は自分でこじ開ける。
   ========================================================= */
var BM = window.BM || {};

BM.TILE = 40;
BM.COLS = 15;                 // 両端の 0 と 14 は縦坑の壁
BM.PLAY_L = 1;                // 実際に通れる左端の列
BM.PLAY_R = 13;               // 同・右端
BM.VIEW_W = BM.COLS * BM.TILE;   // 600
BM.VIEW_H = 640;                 // 16 行ぶん。先を読むために縦長にしてある
BM.VIEW_ROWS = BM.VIEW_H / BM.TILE;

/* タイル */
BM.T_EMPTY = 0;
BM.T_ROCK  = 1;   // 触れたら終わり。爆風で砕ける
BM.T_CRACK = 2;   // もろい岩。ぶつかると砕けて通り抜けられる（減速する）
BM.T_BOMB  = 3;   // 岩に埋まった爆弾。爆風で誘爆して大穴が開く

BM.isSolid = function (t) { return t === BM.T_ROCK || t === BM.T_BOMB; };
BM.blocks  = function (t) { return t !== BM.T_EMPTY; };

/* ゲーム状態 */
BM.S_TITLE = 'title';
BM.S_PLAY  = 'play';
BM.S_OVER  = 'over';
BM.S_PAUSE = 'pause';

/* ---------- 落下 ---------- */
BM.GRAVITY      = 1600;   // px/s^2
BM.V_TERM_BASE  = 330;    // 終端速度の初期値
BM.V_TERM_MAX   = 620;    // 深度で上がっていく上限
BM.DIVE_MUL     = 1.75;   // 急降下中の終端速度倍率
BM.MOVE_SPEED   = 320;    // 横移動の最高速度（浅いところ）
BM.MOVE_SPEED_MAX = 540;  // 同・深部。
   // 落下だけ速くすると、横断に画面1枚ぶん以上落ちるようになり、
   // 「見えた時にはもう間に合わない」配置が避けられなくなる。
   // 落下と横移動の比を保つため、横移動も深度で上げる。
BM.MOVE_ACCEL   = 3000;
BM.MOVE_FRICTION = 2400;
BM.CRACK_COST   = 0.55;   // もろい岩を砕けた直後の落下速度の残り
BM.PLAYER_R     = 12;

/* ---------- 爆弾 ---------- */

    if (step % 2 === 0) this._musicNoise(at, 0.035, 0.05, 7000, 4500);
    // スネア
    if (step % 16 === 8) this._musicNoise(at, 0.11, 0.13, 1900, 700);
  };

  BM.Sound = Sound;
  BM.sound = new Sound();
})(BM);
</script>
<script>
/* =========================================================
   DEEP FALL — 演出（パーティクル / 画面揺れ / 衝撃波 / 数字）
   「爽快感」はここで作る。
   ========================================================= */
(function (BM) {
  'use strict';

  function FX() {
    this.particles = [];
    this.shocks = [];
    this.texts = [];
    this.shake = 0;
    this.shakeDir = { x: 0, y: 0 };
    this.flash = 0;
    this.flashColor = '255,255,255';
    this.aberration = 0;
    this.vignette = 0;
    this._sx = 0; this._sy = 0;
  }

  FX.prototype.clear = function () {
    this.particles.length = 0;
    this.shocks.length = 0;
    this.texts.length = 0;
    this.shake = 0; this.flash = 0; this.aberration = 0; this.vignette = 0;
  };

  /* ---------- 入力系 ---------- */

  FX.prototype.addShake = function (amount, dx, dy) {
    // 演出を抑える設定では画面を揺らさない。ここで止めれば呼び出し側は触らずに済む
    if (BM.a11y.reduced) { this.shake = 0; return; }
    this.shake = Math.min(26, this.shake + amount);
    if (dx || dy) {
      var l = Math.hypot(dx, dy) || 1;
      this.shakeDir.x = dx / l; this.shakeDir.y = dy / l;
    } else {
      this.shakeDir.x = 0; this.shakeDir.y = 0;
    }
  };

  FX.prototype.addFlash = function (a, color) {
    // 全画面フラッシュは光感受性で一番きついので、消すのではなく強さを落とす。
    // 完全に消すと「何が起きたか」の手がかりも消えてしまう。
    if (BM.a11y.reduced) a *= 0.22;
    this.flash = Math.min(BM.a11y.reduced ? 0.22 : 1, this.flash + a);
    if (color) this.flashColor = color;
  };

  FX.prototype.addAberration = function (a) {
    // RGB ずれは文字と岩の輪郭を二重に見せるので、抑える設定では出さない
    if (BM.a11y.reduced) { this.aberration = 0; return; }
    // 強すぎると画面が読めなくなるので、上限は小さく・戻りは速く
    this.aberration = Math.min(5, this.aberration + a);
  };

  FX.prototype.shock = function (x, y, maxR, life, color, width) {
    this.shocks.push({
      x: x, y: y, r: 6, maxR: maxR, t: 0, life: life || 0.36,
      color: color || '255,190,90', w: width || 5
    });
  };

  FX.prototype.text = function (x, y, str, color, size, vy) {
    // 連鎖中は同じ場所に何枚も出るので、少しずらして重なりを散らす
    this.texts.push({
      x: x + BM.rand(-9, 9), y: y + BM.rand(-5, 5), s: str, t: 0, life: 0.9,
      color: color || '#ffe14d', size: size || 15, vy: vy == null ? -46 : vy
    });
  };

  FX.prototype.spawn = function (n, opt) {
    // 破片の量も落とす。画面全体でチラつく点が減ると、それだけで楽になる
    if (BM.a11y.reduced) n = Math.max(1, Math.round(n * 0.35));
    for (var i = 0; i < n; i++) {
      var ang = opt.angle != null
        ? opt.angle + BM.rand(-opt.spread, opt.spread)
        : BM.rand(0, Math.PI * 2);
      var sp = BM.rand(opt.speedMin, opt.speedMax);
      this.particles.push({
        x: opt.x + BM.rand(-(opt.jitter || 0), opt.jitter || 0),
        y: opt.y + BM.rand(-(opt.jitter || 0), opt.jitter || 0),
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        g: opt.gravity == null ? 0 : opt.gravity,
        drag: opt.drag == null ? 1.8 : opt.drag,
        r: BM.rand(opt.rMin || 1.5, opt.rMax || 4),
        t: 0,
        life: BM.rand(opt.lifeMin || 0.3, opt.lifeMax || 0.8),
        colors: opt.colors,
        color: BM.pick(opt.colors),
        shape: opt.shape || 'circle',
        rot: BM.rand(0, Math.PI * 2),
        vr: BM.rand(-9, 9),
        glow: opt.glow !== false,
        fade: opt.fade == null ? 1 : opt.fade
      });
    }
  };

  /* ---------- プリセット ---------- */

  FX.prototype.explosionBurst = function (x, y, power) {
    var p = BM.clamp(power, 1, 8);
    this.spawn(16 + p * 3, {
      x: x, y: y, jitter: 6,
      speedMin: 60, speedMax: 240 + p * 22,
      rMin: 2, rMax: 5.5, lifeMin: 0.22, lifeMax: 0.62,
      colors: ['#fff6c8', '#ffd23d', '#ff8a2b', '#ff4d2b'],
      drag: 2.6, gravity: 120
    });
    this.spawn(8, {
      x: x, y: y, jitter: 4,
      speedMin: 20, speedMax: 90,
      rMin: 6, rMax: 13, lifeMin: 0.4, lifeMax: 0.9,
      colors: ['rgba(120,110,130,.55)', 'rgba(80,70,95,.5)', 'rgba(160,150,170,.4)'],
      drag: 3.2, gravity: -40, glow: false
    });
    this.shock(x, y, 44 + p * 12, 0.34, '255,200,110', 5);
  };

  FX.prototype.blockShatter = function (x, y, base) {
    this.spawn(14, {
      x: x, y: y, jitter: 13,
      speedMin: 40, speedMax: 190,
      rMin: 2.5, rMax: 6.5, lifeMin: 0.35, lifeMax: 0.85,
      colors: base || ['#7a5ba8', '#5c4183', '#9a7cc4', '#3d2b5c'],
      drag: 2.2, gravity: 620, shape: 'rect', glow: false
    });
  };

  FX.prototype.enemyPop = function (x, y, color) {
    this.spawn(22, {
      x: x, y: y, jitter: 5,
      speedMin: 50, speedMax: 210,
      rMin: 2, rMax: 5, lifeMin: 0.3, lifeMax: 0.75,
      colors: [color, '#ffffff', '#ffd23d'],
      drag: 2.4, gravity: 260
    });
    this.shock(x, y, 40, 0.3, '255,255,255', 3);
  };

  FX.prototype.sparkle = function (x, y, color) {
    this.spawn(10, {
      x: x, y: y, jitter: 10,
      speedMin: 15, speedMax: 70,
      rMin: 1.2, rMax: 3, lifeMin: 0.4, lifeMax: 0.9,
      colors: [color, '#ffffff'],
      drag: 1.4, gravity: -60
    });
  };

  FX.prototype.dust = function (x, y) {
    this.spawn(3, {
      x: x, y: y, jitter: 4,
      speedMin: 8, speedMax: 40,
      rMin: 1.5, rMax: 3.5, lifeMin: 0.2, lifeMax: 0.45,
      colors: ['rgba(190,175,220,.5)', 'rgba(140,125,175,.4)'],
      drag: 3, gravity: -30, glow: false
    });
  };

  /* ---------- 更新 ---------- */

  FX.prototype.update = function (dt) {
    var i, p;
    for (i = this.particles.length - 1; i >= 0; i--) {
      p = this.particles[i];
      p.t += dt;
      if (p.t >= p.life) { this.particles.splice(i, 1); continue; }
      var d = Math.exp(-p.drag * dt);
      p.vx *= d; p.vy *= d;
      p.vy += p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    for (i = this.shocks.length - 1; i >= 0; i--) {
      var s = this.shocks[i];
      s.t += dt;
      if (s.t >= s.life) { this.shocks.splice(i, 1); continue; }
      var k = s.t / s.life;
      s.r = 6 + (s.maxR - 6) * (1 - Math.pow(1 - k, 2.6));
    }
    for (i = this.texts.length - 1; i >= 0; i--) {
      var t = this.texts[i];
      t.t += dt;
      if (t.t >= t.life) { this.texts.splice(i, 1); continue; }
      t.y += t.vy * dt;
      t.vy *= Math.exp(-2.4 * dt);
    }

    this.shake = Math.max(0, this.shake - dt * (this.shake * 6 + 12));
    this.flash = Math.max(0, this.flash - dt * 4.2);
    this.aberration = Math.max(0, this.aberration - dt * 42);
    this.vignette = Math.max(0, this.vignette - dt * 1.6);

    if (this.shake > 0.05) {
      var mag = this.shake;
      if (this.shakeDir.x || this.shakeDir.y) {
        this._sx = this.shakeDir.x * mag * BM.rand(0.4, 1) + BM.rand(-mag, mag) * 0.35;
        this._sy = this.shakeDir.y * mag * BM.rand(0.4, 1) + BM.rand(-mag, mag) * 0.35;
      } else {
        this._sx = BM.rand(-mag, mag);
        this._sy = BM.rand(-mag, mag);
      }
    } else { this._sx = 0; this._sy = 0; }
  };

  FX.prototype.offsetX = function () { return this._sx; };
  FX.prototype.offsetY = function () { return this._sy; };

  /* ---------- 描画 ---------- */

  FX.prototype.drawBelow = function (ctx) {
    // 衝撃波リング（加算合成）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < this.shocks.length; i++) {
      var s = this.shocks[i];
      var k = s.t / s.life;
      var a = (1 - k) * (1 - k);
      ctx.strokeStyle = 'rgba(' + s.color + ',' + (a * 0.85).toFixed(3) + ')';
      ctx.lineWidth = s.w * (1 - k * 0.65) + 0.4;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  };

  FX.prototype.drawAbove = function (ctx) {
    var i, p, k, a;
    ctx.save();
    // 発光しないパーティクル（瓦礫・煙）
    for (i = 0; i < this.particles.length; i++) {
      p = this.particles[i];
      if (p.glow) continue;
      k = p.t / p.life;
      a = 1 - k * k;
      ctx.globalAlpha = a * p.fade;
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k * 0.35), 0, Math.PI * 2); ctx.fill();
      }
    }
    // 発光パーティクル
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < this.particles.length; i++) {
      p = this.particles[i];
      if (!p.glow) continue;
      k = p.t / p.life;
      a = 1 - k * k;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      var r = p.r * (1 - k * 0.5);
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = a * 0.28;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // 浮かぶ数字・テキスト
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (i = 0; i < this.texts.length; i++) {
      var t = this.texts[i];
      k = t.t / t.life;
      var sc = k < 0.15 ? BM.lerp(1.6, 1, k / 0.15) : 1;
      ctx.globalAlpha = k > 0.6 ? (1 - (k - 0.6) / 0.4) : 1;
      ctx.font = '900 ' + (t.size * sc).toFixed(1) + 'px system-ui, sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.strokeText(t.s, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.s, t.x, t.y);
    }
    ctx.restore();
  };

  BM.FX = FX;
})(BM);
</script>
<script>
/* =========================================================
   DEEP FALL — 縦坑の生成

   無限に下へ続く。一定間隔で「地層」を挟み、そこに隙間を作る。
   隙間の作り方が このゲームの語彙そのものなので、種類を増やしてある。

   生成時に必ず守ること：
     ・直前の隙間から横移動が間に合う位置にしか次の隙間を置かない
       （落下は止められないので、届かない隙間は理不尽death になる）
     ・動く地層は完全には閉じない（到着タイミングで詰むのを防ぐ）
     ・ボタン式の全面岩は、ボタンを直前の隙間に近い側の壁に置く
   ========================================================= */
(function (BM) {
  'use strict';

  var COLS = BM.COLS, L = BM.PLAY_L, R = BM.PLAY_R, TILE = BM.TILE;

  /* 落下中に横へ何マス動けるか */
  function reachTiles(dropRows, vTerm, moveSpeed) {
    return ((moveSpeed || BM.MOVE_SPEED) * (dropRows * TILE / vTerm) * BM.REACH_MARGIN) / TILE;
  }

  function newCells(fill) {
    var c = new Uint8Array(COLS);
    for (var i = 0; i < COLS; i++) c[i] = (i < L || i > R) ? BM.T_ROCK : fill;
    return c;
  }

  /* 動く穴の角速度の上限。
     穴がプレイヤーの横移動より速く逃げると、追いつけず理不尽になる。
     振幅 span/2 タイルの往復なので、最大速度 = span/2 * 角速度 [タイル/秒]。 */
  function maxAngular(spanTiles, moveSpeed) {
    var maxPx = (moveSpeed || BM.MOVE_SPEED) * 0.55;
    return maxPx / (TILE * Math.max(1, spanTiles / 2));
  }

  function carve(cells, x, w) {
    var half = (w - 1) / 2;
    for (var i = Math.round(x - half); i <= Math.round(x + half); i++) {
      if (i >= L && i <= R) cells[i] = BM.T_EMPTY;
    }
  }

  /* =========================================================
     地層の種類
     各ビルダーは layer を組み立てて、通り抜けられる代表列を gapX に入れる
     ========================================================= */
  var BUILDERS = {

    /* 素直な穴 */
    gap: function (layer, cfg) {
      layer.cells = newCells(BM.T_ROCK);
      carve(layer.cells, layer.gapX, cfg.gapW);
      layer.hint = '';
      var h = (cfg.gapW - 1) / 2;
      layer.exit = [layer.gapX - h, layer.gapX + h];
    },

    /* 穴が2つ。広いほうが安全、狭いほうが近道。
       どちらを抜けても次の層に届くよう、2つの間隔は広げすぎない。 */
    twin: function (layer, cfg) {
      layer.cells = newCells(BM.T_ROCK);
      carve(layer.cells, layer.gapX, cfg.gapW);
      // 2つ目も「直前の出口から届く窓」の中に置く。
      // ここを外すと、そちらを選んだ瞬間に届かなくなる。
      var lo = Math.max(L, cfg.allowedLo), hi = Math.min(R, cfg.allowedHi);
      var spread = BM.randInt(3, 5) * (Math.random() < 0.5 ? -1 : 1);
      var other = BM.clamp(layer.gapX + spread, lo, hi);
      if (Math.abs(other - layer.gapX) < 3) other = BM.clamp(layer.gapX - spread, lo, hi);
      if (Math.abs(other - layer.gapX) < 2) other = layer.gapX;
      carve(layer.cells, other, 1);
      layer.altGapX = other;
      layer.exit = [Math.min(layer.gapX, other), Math.max(layer.gapX, other)];
    },

    /* 一面もろい岩。ぶつかれば砕けるが、そのぶん落下が鈍る。
       どこでも抜けられる＝出口が自由なので exit は全幅 */
    crack: function (layer) {
      layer.cells = newCells(BM.T_CRACK);
      layer.hint = 'もろい';
      layer.exit = [L, R]; layer.exitFree = true;
    },

    /* 岩ともろい岩の混在。どこを抜けるか選ぶ */
    crackmix: function (layer, cfg) {
      layer.cells = newCells(BM.T_ROCK);
      for (var i = -2; i <= 2; i++) {
        var c = Math.round(layer.gapX) + i;
        if (c >= L && c <= R) layer.cells[c] = BM.T_CRACK;
      }
      if (cfg.gapW > 1) carve(layer.cells, layer.gapX, 1);
      layer.exit = [layer.gapX - 2, layer.gapX + 2];
    },

    /* 全面岩。壁のボタンを蹴ると爆弾が落ちてきて穴が開く。
       ボタンは層より上にあるので、そこへ届く時間で側を決める必要がある。
       間に合わない配置になるくらいなら、この層だけ落差を伸ばす。 */
    button: function (layer, cfg) {
      layer.cells = newCells(BM.T_ROCK);
      // 左右どちらの壁にも置く。片側だけだと、反対の壁側から来たときに
      // 横移動が間に合わず理不尽になる（どちら側にいても最大6マスで届く）。
      var y = layer.row - cfg.buttonOffset;
      layer.buttons = [
        { col: L, row: y, side: -1, hit: false, t: 0 },
        { col: R, row: y, side: 1, hit: false, t: 0 }
      ];
      // 穴はボタンの真下ではなく、縦坑の中央に固定して開ける。
      // 壁側に開けると出口が「左端か右端」の二択になり、次の層はその両方から
      // 届く位置に置く必要が出て、落差が画面1枚を超えてしまう。
      // また中央以外に置くと、反対の壁のボタンからの横断距離が最大10マスになり、
      // 確保した落差では届かない。1点に固定すればどちらを押しても出口は同じ。
      layer.holeCol = Math.round((L + R) / 2);
      layer.hint = 'ボタン';
      layer.exit = [layer.holeCol - 1, layer.holeCol + 1];
    },

    /* 穴が横にスライドし続ける */
    shutter: function (layer, cfg) {
      layer.dynamic = true;
      layer.gapW = cfg.gapW + 1;
      // 全幅を往復させると、直前の出口から届かない位置に穴が来ることがある。
      // 到達可能な gapX を中心に、振幅を絞って往復させる。
      var amp = 3;   // 落差の間に横断し切れる幅に抑える
      layer.range = [
        Math.max(L, Math.round(layer.gapX) - amp),
        Math.min(R, Math.round(layer.gapX) + amp)
      ];
      if (layer.range[1] - layer.range[0] < 3) {
        layer.range = [Math.max(L, Math.min(R - 3, layer.range[0])), 0];
        layer.range[1] = layer.range[0] + 3;
      }
      var cap = maxAngular(layer.range[1] - layer.range[0], cfg.moveSpeed);
      layer.speed = BM.rand(cap * 0.5, cap) * (Math.random() < 0.5 ? -1 : 1);
      layer.refresh = function (t) {
        var span = this.range[1] - this.range[0];
        var u = (Math.sin(t * this.speed) + 1) / 2;
        var x = this.range[0] + u * span;
        this.cells = newCells(BM.T_ROCK);
        carve(this.cells, x, this.gapW);
        this.gapX = x;
      };
      layer.hint = '横に動く';
      // 抜ける位置は穴の位置＝到着タイミングで決まるので、自分では選べない。
      // exitFree にすると「好きな場所に構えられる」前提で次の穴が置かれ、
      // 届かない配置が生まれる。往復範囲の端から端まで届く位置に限る。
      layer.exit = [layer.range[0], layer.range[1]];
    },

    /* 穴が広がったり狭まったりする。閉じ切りはしない（詰み防止） */
    gate: function (layer, cfg) {
      layer.dynamic = true;
      layer.speed = BM.rand(0.9, 1.4);
      layer.wide = Math.max(4, cfg.gapW + 2);
      layer.refresh = function (t) {
        var u = (Math.sin(t * this.speed) + 1) / 2;
        // 最小でも2マス残す。1マスまで閉じると、到着タイミング次第で
        // どうやっても避けられない瞬間ができてしまう
        var w = 2 + Math.round(u * (this.wide - 2));
        this.cells = newCells(BM.T_ROCK);
        carve(this.cells, this.gapX, w);
        this.curW = w;
      };
      layer.hint = '開閉';
      layer.exit = [layer.gapX, layer.gapX];   // 位置は固定。狭まる瞬間があるので厳しく見る
    },

    /* 一定の間隔を保った2つの穴が、揃って左右にスライドする。
       以前は左右から寄っては離れる形にしていたが、すれ違う瞬間に
       「今は開いているが直後に岩になる中央」ができ、そこを狙うと必ず死ぬ罠になっていた。
       間隔を固定すれば、どちらの穴を選んでも最後まで穴のまま。 */
    spinner: function (layer, cfg) {
      layer.dynamic = true;
      layer.mid = BM.clamp(Math.round(layer.gapX), L + 2, R - 2);
      layer.sep = 2.5;
      layer.amp = 1.5;
      // 何度測っても、詰まりが残るのはこの型だけだった。
      // 2つの穴を追いながら次の層も読むのは負荷が高いので、動きは遅くする。
      layer.speed = maxAngular(layer.amp * 2, cfg.moveSpeed) * BM.rand(0.18, 0.4);
      layer.gapW = cfg.gapW;
      layer.refresh = function (t) {
        var s = Math.sin(t * this.speed) * this.amp;
        var a = this.mid - this.sep + s;
        var b = this.mid + this.sep + s;
        this.cells = newCells(BM.T_ROCK);
        carve(this.cells, a, this.gapW);
        carve(this.cells, b, this.gapW);
        this.gapX = a;
      };
      layer.hint = '二重';
      layer.exit = [layer.mid - layer.sep - layer.amp, layer.mid + layer.sep + layer.amp];
    },

    /* 岩に爆弾が埋まっている。穴は狭いが、撃ち抜けば大穴とボーナス */
    bombrock: function (layer, cfg) {
      layer.cells = newCells(BM.T_ROCK);
      // 以前はここが 1 固定で、深度に関わらず最難関の幅になっていた
      var bw = Math.max(2, cfg.gapW - 1);
      carve(layer.cells, layer.gapX, bw);
      var spots = BM.shuffle([L + 1, L + 3, L + 5, R - 5, R - 3, R - 1])
        .filter(function (c) { return Math.abs(c - layer.gapX) > 1; })
        .slice(0, BM.randInt(2, 3));
      for (var i = 0; i < spots.length; i++) layer.cells[spots[i]] = BM.T_BOMB;
      layer.hint = '誘爆';
      var bh = (bw - 1) / 2;
      layer.exit = [layer.gapX - bh, layer.gapX + bh];
    }
  };

  /* 深度ごとの出現テーブル */
  function typeTable(rows) {
    var t = [['gap', 40], ['twin', 18], ['crack', 14]];
    if (rows > 18) t.push(['crackmix', 14]);
    if (rows > 28) t.push(['shutter', 16]);
    if (rows > 45) t.push(['button', 13]);
    if (rows > 70) t.push(['gate', 14]);
    if (rows > 95) t.push(['bombrock', 12]);
    if (rows > 125) t.push(['spinner', 13]);
    return t;
  }

  function pickType(rows, lastType) {
    var t = typeTable(rows).filter(function (e) { return e[0] !== lastType; });
    var sum = 0, i;
    for (i = 0; i < t.length; i++) sum += t[i][1];
    var r = Math.random() * sum;
    for (i = 0; i < t.length; i++) { r -= t[i][1]; if (r <= 0) return t[i][0]; }
    return 'gap';
  }

  /* =========================================================
     World
     ========================================================= */
  function World() {
    this.reset();
  }

  World.prototype.reset = function () {
    this.layers = [];
    this.byRow = {};
    this.nextRow = 12;      // 最初の数行は何も無い（落ち始める助走）
    this.exit = { lo: 7, hi: 7 };   // 直前の層を抜けたあと居られる列の範囲
    this.exitFree = false;          // その範囲を自分で選べたか（もろい岩・動く穴）
    this.lastRow = 0;               // 直前の層の行。落差はここから測る
    this.lastType = '';
    this.t = 0;
    this.deepest = 0;
    // ご褒美の間。mileDone は「何個目の節目まで置いたか」
    this.mileDone = 0;
    this.rewardLeft = 0;
    this.rewardKind = null;
    this.rewardHead = false;
    this.rewardPlan = [];
  };

  /* 節目の中身。深さ（=節目の番号）だけで決まるようにしておく。
     乱数で選ぶと、同じ深度を検査しても毎回違う結果になって確かめられない。 */
  World.prototype.rewardAt = function (mile) {
    if (mile % BM.EPIC_EVERY === 0) return BM.REWARD_EPIC;
    if (mile % BM.BIG_EVERY === 0) return BM.REWARD_BIG;
    // 大空洞が挟まると番号がずれて、特定の種類だけ出にくくなる。
    // 大空洞のぶんを引いてから巡回させると4種が均等に回る。
    // 別格は大空洞の位置（BIG_EVERY の倍数）に重なるので、追加の補正は要らない。
    var i = mile - Math.floor(mile / BM.BIG_EVERY);
    return BM.REWARDS[(i - 1) % BM.REWARDS.length];
  };

  /* その節目で開けたままにする層の数 */
  World.prototype.rewardSpan = function (mile) {
    if (mile % BM.EPIC_EVERY === 0) return BM.EPIC_SPAN;
    if (mile % BM.BIG_EVERY === 0) return BM.BIG_SPAN;
    return BM.REWARD_SPAN;
  };

  /* 到達ボーナス。普通の節目は早めに上限で止めて点が壊れるのを防ぐが、
     別格だけは伸ばす。ここが深く潜り続けたことへの見返りになる。 */
  World.prototype.rewardBonus = function (mile) {
    var cap = (mile % BM.EPIC_EVERY === 0) ? BM.EPIC_BONUS_CAP : BM.MILESTONE_BONUS_CAP;
    return BM.MILESTONE_BONUS * Math.min(mile, cap);
  };

  /* ご褒美の間に浮かべるものを、空間全体に配置してから配る。
     結晶は落ちながら回収するものなので、蛇行する線に並べる。
     取り逃しても損は無い（＝任意の寄り道）ようにしてある。 */
  World.prototype.planReward = function (kind, row0, spanRows, cfg) {
    var plan = [], mid = Math.round((L + R) / 2), i;
    var list = kind.items || [];
    for (i = 0; i < list.length; i++) {
      // 入口の直後に置くと、そこへ横移動する時間が無くて取れない。
      // 確定で渡すつもりの物なので、間を空けて中央寄りに置く。
      plan.push({
        type: list[i],
        col: BM.clamp(mid + Math.round((i - (list.length - 1) / 2) * 2), L + 1, R - 1),
        row: row0 + 6 + i * 4
      });
    }
    var n = kind.coins || 0;
    if (n > 0) {
      var top = row0 + 8 + list.length * 4;
      var step = Math.max(2, Math.floor((spanRows - (top - row0) - 2) / n));
      // 蛇行の幅は「次の結晶までに横へ動ける距離」で決める。
      // 固定値にすると、深いところでは結晶の列が自分より速く逃げて、
      // 1個も取れない飾りになる。
      // 角度から計算するだけでは列を整数に丸めた時にはみ出すので、
      // 並べたあとに隣との差を実際に詰めて必ず追えるようにする。
      var amp = 4;
      var perStep = cfg.moveSpeed * (step * TILE / cfg.vTerm) / TILE;
      var maxStep = Math.max(1, Math.floor(perStep * 0.75));
      var dphase = Math.min(0.62, (perStep * 0.7) / amp);
      var prev = null;
      for (i = 0; i < n; i++) {
        var col = mid + Math.round(Math.sin(i * dphase) * amp);
        if (prev !== null) col = BM.clamp(col, prev - maxStep, prev + maxStep);
        col = BM.clamp(col, L + 1, R - 1);
        prev = col;
        plan.push({ type: 'COIN', col: col, row: top + i * step });
      }
    }
    return plan;
  };

  /* ご褒美の間の1枚。全マス空なので、ここでは絶対に死なない。 */
  World.prototype.pushReward = function (rows, cfg) {
    var spacing = cfg.spacing;
    var layer = {
      row: rows, type: 'reward', t: 0, phase: 0,
      cells: newCells(BM.T_EMPTY),
      gapX: Math.round((L + R) / 2),
      button: null, dynamic: false, hint: '',
      items: [], passed: false,
      // 全マス空なので出口は縦坑の全幅。どこに居るかは決まらないので exitFree は立てない
      exit: [L, R], exitFree: false,
      kind: this.rewardKind, reward: null
    };
    if (this.rewardHead) {
      this.rewardHead = false;
      layer.reward = {
        kind: this.rewardKind,
        mile: this.mileDone,
        depth: this.mileDone * BM.MILESTONE_ROWS,
        bonus: this.rewardBonus(this.mileDone)
      };
    }
    // 自分の担当区間にあるものだけ持つ。全部を先頭の層に持たせると、
    // 画面外へ流れて層が捨てられた時に、まだ下にある結晶まで消える。
    var keep = [], i;
    for (i = 0; i < this.rewardPlan.length; i++) {
      var e = this.rewardPlan[i];
      if (e.row >= rows && (this.rewardLeft > 1 ? e.row < rows + spacing : true)) {
        layer.items.push({ col: e.col, row: e.row, type: e.type, t: 0, alive: true });
      } else keep.push(e);
    }
    this.rewardPlan = keep;
    this.rewardLeft--;

    this.layers.push(layer);
    this.byRow[rows] = layer;
    // どの列に居るかは決まらないので、次の穴は「両端から届く位置」に限る
    this.exit = { lo: L, hi: R };
    this.exitFree = false;
    this.lastType = 'reward';
    this.lastRow = rows;
    this.nextRow = rows + spacing;
    this.deepest = rows;
  };

  /* 横移動の速さも深度で上げる。落下だけ速くすると比率が壊れる。 */
  World.prototype.moveSpeed = function (rows) {
    return BM.lerp(BM.MOVE_SPEED, BM.MOVE_SPEED_MAX, BM.clamp(rows / 400, 0, 1));
  };

  World.prototype.vTerm = function (rows) {
    return BM.lerp(BM.V_TERM_BASE, BM.V_TERM_MAX, BM.clamp(rows / 400, 0, 1));
  };

  /* 難易度は「行数」ではなく「時間」で定義する。
     落下速度は深度で上がるので、行数を一定に詰めていくと層と層の間の
     時間が一気に潰れる（以前は 1.09秒 → 0.32秒 まで縮み、その間に横へ
     動けるのが 1.86 マスしかなかった。穴の幅は 1 マスなのに）。
     時間で決めれば、速くなるぶん行間は自然に広がる。 */
  World.prototype.difficulty = function (rows) {
    var k = BM.clamp(rows / 300, 0, 1);
    var vt = this.vTerm(rows);
    var gapTime = BM.lerp(BM.LAYER_TIME_START, BM.LAYER_TIME_MIN, k);
    return {
      gapTime: gapTime,
      moveSpeed: this.moveSpeed(rows),
      spacing: Math.max(5, Math.round(gapTime * vt / TILE)),
      // 当たり判定が 24px なので、1マス(40px)の穴は許容 ±8px しかない。
      // 落下を止められない以上これは詰みなので、2マスを下限にする。
      gapW: Math.max(2, Math.round(BM.lerp(3.4, 2.0, k)))
    };
  };

  /* untilRow まで地層を用意する */
  World.prototype.ensure = function (untilRow) {
    var guard = 0;
    while (this.nextRow <= untilRow && guard++ < 400) {
      var rows = this.nextRow;
      // 到達可能性は「その深度の標準間隔」ではなく、直前の層からの
      // 実際の落差で測る。ここがズレると、届かない位置に穴が置かれる。
      var prevRow = this.lastRow;
      var cfg = this.difficulty(rows);
      cfg.vTerm = this.vTerm(rows);
      cfg.moveSpeed = this.moveSpeed(rows);
      /* ---- 200m ごとのご褒美の間（底なし＝深さに終わりが無いので巡回する） ----
         やっているのは「岩を置かないこと」だけ。層自体は普通に置くので、
         到達可能性も可視性も自動的に満たされる。ここを特別扱いして
         層を飛ばすと、その区間だけ不変条件の外に出てしまう。 */
      var mile = Math.floor(rows / BM.MILESTONE_ROWS);
      if (this.rewardLeft <= 0 && mile > this.mileDone && !this.debugType) {
        this.mileDone = mile;
        this.rewardKind = this.rewardAt(mile);
        this.rewardLeft = this.rewardSpan(mile);
        this.rewardHead = true;
        this.rewardPlan = this.planReward(this.rewardKind, rows, this.rewardLeft * cfg.spacing, cfg);
      }
      if (this.rewardLeft > 0) {
        this.pushReward(rows, cfg);
        continue;
      }

      // debugType はテスト専用。1種類の地層だけを並べて通れるか確かめるのに使う
      var type = this.debugType || pickType(rows, this.lastType);

      // ボタン層だけは、ボタンへ横移動が間に合う落差を「置く前に」確保する。
      // 層の後ろで間隔を足しても、そのボタンには届かない。
      if (type === 'button') {
        // 出口の範囲のどこから来ても、近いほうの壁へ届く落差を確保する
        var bneed = 0;
        for (var bx = Math.floor(this.exit.lo); bx <= Math.ceil(this.exit.hi); bx++) {
          bneed = Math.max(bneed, Math.min(Math.abs(bx - L), Math.abs(bx - R)));
        }
        // ボタン（壁）から穴（中央寄り）まで横断する時間が要る。
        // ここを固定値にすると、押せたのに穴へ届かないという詰みになる。
        var holeDist = (R - L) / 2 + 1;
        cfg.buttonOffset = Math.ceil(holeDist * cfg.vTerm / (cfg.moveSpeed * BM.REACH_MARGIN)) + 1;
        var needRows = Math.ceil(bneed * cfg.vTerm / (cfg.moveSpeed * BM.REACH_MARGIN)) + cfg.buttonOffset + 2;
        if (needRows > rows - prevRow) {
          rows = prevRow + needRows;
          this.nextRow = rows;
        }
      }

      var layer = {
        row: rows,
        type: type,
        t: 0,
        phase: BM.rand(0, 6.28),
        cells: null,
        gapX: 7,
        button: null,
        dynamic: false,
        hint: '',
        items: [],
        passed: false
      };

      // 直前の層の出口から横移動が間に合う範囲にだけ次の穴を置く。
      //   出口が固定の層（穴・ボタンなど）→ 出口の端から端まで全部届く範囲（厳しい側）
      //   出口が自由な層（もろい岩・動く穴）→ 好きな場所で抜けられるので緩い側
      // 出口の性質で自動的に切り替わるように、狭いほうが空なら広いほうを使う。
      var reach = reachTiles(rows - prevRow, cfg.vTerm, cfg.moveSpeed);

      // 出口の幅が広い層（動く穴・二又など）のあとは、その端から端まで
      // 届くだけの落差が要る。足りなければ、次の層を置く前に落差を伸ばす。
      // これをやらないと「どちらの出口を選んだかで詰む」配置が生まれる。
      if (!this.exitFree) {
        var minReach = (this.exit.hi - this.exit.lo) / 2 + 0.5;
        if (reach < minReach) {
          var needRows2 = Math.ceil(minReach * cfg.vTerm / (cfg.moveSpeed * BM.REACH_MARGIN));
          rows = prevRow + Math.max(rows - prevRow, needRows2);
          this.nextRow = rows;
          layer.row = rows;
          reach = reachTiles(rows - prevRow, cfg.vTerm, cfg.moveSpeed);
        }
      }

      var lo, hi;
      if (this.exitFree) {
        // 直前の層はどこでも抜けられた＝好きな位置に構えられる
        lo = Math.ceil(this.exit.lo - reach);
        hi = Math.floor(this.exit.hi + reach);
      } else {
        // 出口が決まっていた＝その範囲のどこから出ても届く位置に限る
        lo = Math.ceil(this.exit.hi - reach);
        hi = Math.floor(this.exit.lo + reach);
      }
      lo = Math.max(L + 1, lo);
      hi = Math.min(R - 1, hi);
      if (lo > hi) lo = hi = BM.clamp(Math.round((this.exit.lo + this.exit.hi) / 2), L + 1, R - 1);
      layer.gapX = BM.randInt(lo, hi);
      layer.exit = [layer.gapX, layer.gapX];
      cfg.allowedLo = lo; cfg.allowedHi = hi;

      BUILDERS[type](layer, cfg, { lo: this.exit.lo, hi: this.exit.hi });

      // 動く層の作り直しの後で、開けた穴を必ず塗り直す
      if (layer.dynamic && layer.refresh) {
        layer.refresh = (function (fn) {
          return function (t) {
            fn.call(this, t);
            if (this.punched) {
              for (var k = 0; k < this.punched.length; k++) this.cells[this.punched[k]] = BM.T_EMPTY;
            }
          };
        })(layer.refresh);
      }

      // ときどきアイテムを浮かべる
      if (Math.random() < 0.3) {
        var pool = ['BOMB', 'BOMB', 'POWER', 'SHIELD', 'SLOW'];
        layer.items.push({
          col: BM.clamp(layer.gapX + BM.randInt(-1, 1), L, R),
          row: layer.row - BM.randInt(2, 4),
          type: BM.pick(pool),
          t: 0,
          alive: true
        });
      }

      this.layers.push(layer);
      this.byRow[layer.row] = layer;

      this.exit = {
        lo: BM.clamp(layer.exit[0], L, R),
        hi: BM.clamp(layer.exit[1], L, R)
      };
      this.exitFree = !!layer.exitFree;
      this.lastType = type;
      // 落差の延長（ボタン層・出口が広い層）は、その層自身を下へずらすためのもの。
      // そのまま次の間隔にも使うと、後ろの層まで画面外へ押し出してしまう。
      this.lastRow = layer.row;
      this.nextRow = layer.row + this.difficulty(layer.row).spacing;
      this.deepest = layer.row;
    }
  };

  World.prototype.update = function (dt) {
    this.t += dt;
    for (var i = 0; i < this.layers.length; i++) {
      var l = this.layers[i];
      l.t += dt;
      if (l.dynamic && l.refresh) l.refresh(l.t + l.phase);
    }
  };

  World.prototype.layerAt = function (row) {
    return this.byRow[row] || null;
  };

  World.prototype.tileAt = function (col, row) {
    if (col < L || col > R) return BM.T_ROCK;         // 縦坑の壁
    var l = this.byRow[row];
    if (!l || l.row !== row || !l.cells) return BM.T_EMPTY;
    return l.cells[col];
  };

  World.prototype.setTile = function (col, row, v) {
    if (col < L || col > R) return;
    var l = this.byRow[row];
    if (!l || l.row !== row || !l.cells) return;
    l.cells[col] = v;
    // 動く層は毎フレーム cells を作り直すので、そのままだと開けた穴が
    // 次のフレームで塞がる。爆風で開けた穴は動いても残るのが正しい。
    if (l.dynamic && v === BM.T_EMPTY) {
      if (!l.punched) l.punched = [];
      if (l.punched.indexOf(col) < 0) l.punched.push(col);
    }
  };

  /* 画面より十分上に流れた地層を捨てる */
  World.prototype.prune = function (aboveRow) {
    if (this.layers.length < 40) return;
    var kept = [];
    for (var i = 0; i < this.layers.length; i++) {
      var l = this.layers[i];
      if (l.row < aboveRow - 6) {
        delete this.byRow[l.row];
      } else kept.push(l);
    }
    this.layers = kept;
  };

  BM.World = World;
  BM.reachTiles = reachTiles;
})(BM);
</script>
<script>
/* =========================================================
   DEEP FALL — プレイヤー / 爆弾 / 爆風
   ========================================================= */
(function (BM) {
  'use strict';

  var TILE = BM.TILE, L = BM.PLAY_L, R = BM.PLAY_R;
  var nextId = 1;

  /* =========================================================
     Player — 落ち続けることしかできない
     ========================================================= */
  function Player() {
    this.id = nextId++;
    this.x = BM.centerX(7);
    this.y = -TILE * 3;
    this.vx = 0;
    this.vy = 60;
    this.r = BM.PLAYER_R;

    this.bombs = BM.START_BOMBS;
    this.power = BM.BOMB_POWER;
    this.shield = 0;
    this.iframe = 0;       // シールド発動直後の無敵
    this.shieldFlash = 0;  // 発動演出
    this.slow = 0;
    this.slowMax = 0;   // 残り時間を割合で出すために、もらった長さを覚えておく

    this.alive = true;
    this.dir = 0;          // -1 / 0 / 1
    this.lean = 0;
    this.spin = 0;
    this.throwT = 0;       // ポケットから爆弾を取り出す動作の進行
    this.flail = 0;        // 手足のばたつき
    this.diving = false;
    this.emptyT = 0;       // 空のポケットを探った直後
    this.trail = [];
    this.crackHit = 0;
    this.deepest = 0;
  }

  Player.prototype.termV = function (world) {
    var v = world.vTerm(this.deepest);
    if (this.diving) v *= BM.DIVE_MUL;
    if (this.slow > 0) v *= 0.55;
    return v;
  };

  Player.prototype.update = function (dt, game) {
    if (!this.alive) return;
    var K = BM.input.keys;
    var world = game.world;

    if (this.slow > 0) this.slow -= dt;
    if (this.iframe > 0) this.iframe -= dt;
    if (this.shieldFlash > 0) this.shieldFlash -= dt;
    if (this.throwT > 0) this.throwT = Math.max(0, this.throwT - dt * 2.6);
    if (this.emptyT > 0) this.emptyT -= dt;
    this.flail += dt * (3 + this.vy / 120);

    // ---- 横 ----
    var ix = (K['ArrowRight'] || K['d'] ? 1 : 0) - (K['ArrowLeft'] || K['a'] ? 1 : 0);
    this.dir = ix;
    var msBase = world.moveSpeed(this.deepest);
    this.moveMax = msBase;
    if (ix !== 0) {
      this.vx += ix * BM.MOVE_ACCEL * (msBase / BM.MOVE_SPEED) * dt;
      var max = msBase * (this.slow > 0 ? 0.85 : 1);
      this.vx = BM.clamp(this.vx, -max, max);
    } else {
      var f = BM.MOVE_FRICTION * dt;
      this.vx = Math.abs(this.vx) <= f ? 0 : this.vx - Math.sign(this.vx) * f;
    }
    this.lean = BM.damp(this.lean, this.vx / BM.MOVE_SPEED, 9, dt);

    // ---- 縦 ----
    this.diving = !!(K['ArrowDown'] || K['s']);
    var vt = this.termV(world);
    if (this.vy < vt) this.vy = Math.min(vt, this.vy + BM.GRAVITY * dt * (this.diving ? 1.6 : 1));
    else this.vy = Math.max(vt, this.vy - BM.GRAVITY * 0.8 * dt);

    // 速いときに一気に動かすとタイルを飛び越えてしまうので、小刻みに進める
    var remainX = this.vx * dt, remainY = this.vy * dt;
    var steps = Math.max(1, Math.ceil(Math.max(Math.abs(remainX), Math.abs(remainY)) / 8));
    for (var s = 0; s < steps && this.alive; s++) {
      this.x = BM.clamp(this.x + remainX / steps,
                        (L) * TILE + this.r, (R + 1) * TILE - this.r);
      this.y += remainY / steps;
      this.resolve(game);
    }

    this.spin += dt * (2 + Math.abs(this.vx) / 90);
    this.deepest = Math.max(this.deepest, Math.floor(this.y / TILE));

    this.trail.push({ x: this.x, y: this.y, t: 0 });
    if (this.trail.length > 14) this.trail.shift();
    for (var i = this.trail.length - 1; i >= 0; i--) {
      this.trail[i].t += dt;
      if (this.trail[i].t > 0.28) this.trail.splice(i, 1);
    }

    if (BM.input.pressed(' ') || BM.input.pressed('Enter')) game.dropBomb(this);
  };

  /* 今いる位置がタイルと重なっているかを見る。
     もろい岩なら砕いて通す。岩なら終わり。 */
  Player.prototype.resolve = function (game) {
    var world = game.world;
    var c0 = BM.colOf(this.x - this.r + 1), c1 = BM.colOf(this.x + this.r - 1);
    var r0 = BM.rowOf(this.y - this.r + 1), r1 = BM.rowOf(this.y + this.r - 1);

    for (var row = r0; row <= r1; row++) {
      for (var col = c0; col <= c1; col++) {
        var t = world.tileAt(col, row);
        if (t === BM.T_EMPTY) continue;

        if (t === BM.T_CRACK) {
          game.smash(col, row);
          this.vy = Math.max(120, this.vy * BM.CRACK_COST);
          this.crackHit = 0.25;
          continue;
        }
        // 岩に触れた
        if (this.iframe > 0) {
          // 発動直後は、同じ層の残りをシールドを減らさずに突き破る
          game.smash(col, row);
          continue;
        }
        if (this.shield > 0) {
          this.shield--;
          this.iframe = BM.SHIELD_IFRAME;
          this.shieldFlash = 0.6;
          game.shieldBreak(this, col, row);
          this.vy = Math.max(180, this.vy * 0.6);
          continue;
        }
        game.crash(this, col, row);
        return;
      }
    }
  };

  /* =========================================================
     Bomb — 落として、地層に当たったところで爆ぜる
     ========================================================= */
  function Bomb(x, y, power, fromButton) {
    this.id = nextId++;
    this.x = x;
    this.y = y;
    // 見た目だけポーチの位置から出す。掘る列がずれると理不尽になるので、
    // 判定用の x は常に真下のまま。描画時にこのオフセットを足して戻していく。
    this.vdx = 0;
    this.vy = BM.BOMB_FALL_V;
    this.power = power;
    this.t = 0;
    this.dead = false;
    this.fromButton = fromButton || false;
    this.chain = false;
  }

  Bomb.prototype.update = function (dt, game) {
    this.t += dt;
    if (this.vdx !== 0) this.vdx = BM.damp(this.vdx, 0, 14, dt);
    var steps = Math.max(1, Math.ceil(this.vy * dt / 10));
    for (var s = 0; s < steps; s++) {
      this.y += this.vy * dt / steps;
      var col = BM.colOf(this.x), row = BM.rowOf(this.y + 10);
      var t = game.world.tileAt(col, row);
      if (t !== BM.T_EMPTY) { game.explode(this, col, row); this.dead = true; return; }
    }
    if (this.y > game.player.y + BM.VIEW_H * 1.6) this.dead = true;
  };

  BM.Player = Player;
  BM.Bomb = Bomb;
})(BM);
</script>
<script>
/* =========================================================
   DEEP FALL — 自動操縦

   テスト（npm test / npm run audit）が縦坑を実際に潜るために使う。
   プレイヤー向けの機能ではないので、ゲーム側からは有効にならない。

   テストはこのページを丸ごと読み込んで走るので、index.html に載せておく必要がある。
   テスト側に複製を置くと、検査に通ったものと出荷されるものが別物になってしまう。

   考え方：
     ・2層先まで見る（人間が画面で見えている範囲と同じ）
     ・動く穴は「自分が着く時刻」の位置を予測して先回りする
     ・横は位置ではなく速度を制御する（そうしないと狭い穴で行き過ぎる）
     ・抜け道が無ければ爆弾を落として掘る
   ========================================================= */
(function (BM) {
  'use strict';

  var L = BM.PLAY_L, R = BM.PLAY_R, TILE = BM.TILE;

  function passable(l, c) {
    if (!l || !l.cells) return true;
    var t = l.cells[c];
    return t !== BM.T_ROCK && t !== BM.T_BOMB;
  }

  /* 通り抜けられる帯の中心を列挙する。端ではなく中心を狙わないと、
     閉じてくる穴で削られて死ぬ。 */
  function runs(l) {
    var out = [], run = [];
    for (var c = L; c <= R + 1; c++) {
      if (c <= R && passable(l, c)) run.push(c);
      else if (run.length) { out.push(BM.centerX((run[0] + run[run.length - 1]) / 2)); run = []; }
    }
    return out;
  }

  function options(game, l, lead) {
    if (l.buttons) {
      var hit = l.buttons.filter(function (b) { return b.hit; });
      if (hit.length) {
        // 押した後は、もう片方のボタンではなく開きつつある穴へ向かう
        var open = runs(l);
        if (open.length) return open;
        return [BM.centerX(l.holeCol)];
      }
      return l.buttons.map(function (b) { return game.buttonPos(b).x; });
    }
    if (l.dynamic && l.refresh && lead > 0) {
      // 到着時刻の盤面を一時的に作って評価し、必ず元に戻す
      var sc = l.cells, sg = l.gapX;
      l.refresh(l.t + l.phase + lead);
      var o = runs(l);
      l.cells = sc; l.gapX = sg;
      return o;
    }
    return runs(l);
  }

  var autopilot = {
    enabled: false,

    step: function (game) {
      var p = game.player, I = BM.input;
      I.keys['ArrowLeft'] = I.keys['ArrowRight'] = false;
      if (!p.alive || game.state !== BM.S_PLAY) return;

      // 通過し切るまでは今の層を狙い続ける。
      // 中心が隣のマスへ移った時点で次の層に切り替えると、
      // まだ体が今の層に残っているのに自分から穴を外れてしまう。
      var ahead = game.world.layers.filter(function (l) {
        return (l.row + 1) * TILE > p.y - p.r;
      }).sort(function (a, b) { return a.row - b.row; });

      var cur = ahead[0], nxt = ahead[1];
      if (!cur) return;

      var vy = Math.max(60, p.vy);
      var leadCur = Math.max(0, (cur.row * TILE - p.y) / vy);
      var opts = options(game, cur, leadCur);
      if (!opts.length) { I.just[' '] = true; return; }   // 抜け道が無ければ掘る

      var nextOpts = nxt ? options(game, nxt, Math.max(0, (nxt.row * TILE - p.y) / vy)) : null;
      var best = opts[0], bestCost = Infinity;
      for (var i = 0; i < opts.length; i++) {
        var x = opts[i];
        var cost = Math.abs(x - p.x);
        if (nextOpts && nextOpts.length) {
          var nd = Infinity;
          for (var j = 0; j < nextOpts.length; j++) nd = Math.min(nd, Math.abs(nextOpts[j] - x));
          cost += nd * 0.7;
        }
        if (cost < bestCost) { bestCost = cost; best = x; }
      }

      // 位置ではなく速度を狙う。残り距離に比例した速度に寄せると行き過ぎない
      var dx = best - p.x;
      var vmax = p.moveMax || BM.MOVE_SPEED;
      var want = BM.clamp(dx * 7, -vmax, vmax);
      if (p.vx < want - 10) I.keys['ArrowRight'] = true;
      else if (p.vx > want + 10) I.keys['ArrowLeft'] = true;
    }
  };

  BM.autopilot = autopilot;
})(BM);
</script>
<script>
/* =========================================================
   DEEP FALL — 広告枠（ゲームオーバー時のインタースティシャル）

   ■ 実際の広告配信について
   AdSense / AdMob などの実配信には、審査を通したアカウントと
   配信元ドメインからの外部スクリプト読み込みが必要。
   このゲームは外部通信をしない前提で作ってあり、Artifact として公開した
   場合はセキュリティポリシーが外部スクリプトを全部ブロックする。
   なので「配信そのもの」はここでは行えない。

   代わりにこのモジュールは、広告の【枠と出し方】だけを実装している。
     ・標準的な 300×250（レクタングル大）の枠
     ・「広告」ラベル（何が広告なのかを隠さない）
     ・カウントダウンと、一定秒後に押せるスキップ
     ・出しすぎない頻度制御（毎回は出さない）
   中身の既定値は自社広告（このゲーム自身の告知）。

   ■ 実際の配信に差し替える方法
     BM.ads.provider = {
       // container に配信タグを差し込み、表示が終わったら done() を呼ぶ
       fill: function (container, done) { ... }
     };
   provider を入れれば自社広告の代わりにそれが使われる。
   枠・ラベル・スキップ・頻度制御はそのまま流用できる。
   ========================================================= */
(function (BM) {
  'use strict';

  /* 既定の中身は自社広告。
     実在しない企業や商品を騙るものは作らない（それは偽の広告になる）ので、
     このゲーム自身のことだけを書いている。 */
  var HOUSE = [
    {
      accent: '#ffd23d',
      tag: '自社広告',
      title: 'まだ 500m は見ていない',
      body: '地層は 100m ごとに姿を変える。表土・玄武岩・結晶層・熱層・氷結層、' +
            'そして 500m から先はずっと「深淵」。',
      cta: 'もう一度落ちる'
    },
    {
      accent: '#8ce8ff',
      tag: '自社広告',
      title: 'シールドは読み違えを1回だけ許す',
      body: '🛡 を拾うと、岩に触れても死なずに突き破る。持っている間は' +
            '落下予測線が青くなるので、今が安全かは常に見えている。',
      cta: 'シールドを探しに行く'
    },
    {
      accent: '#ff8a5c',
      tag: '自社広告',
      title: '爆弾は腰のポーチに3個だけ',
      body: '全面岩の層は壁のボタンで抜ける。爆弾は本当に詰まった時の切り札。' +
            'どこで使うかを決めてから落とす。',
      cta: '使いどころを試す'
    },
    {
      accent: '#c9a6ff',
      tag: '自社広告',
      title: '埋まった爆弾を撃ち抜くと大穴になる',
      body: 'オレンジに光る岩に自分の爆弾を当てると誘爆する。' +
            '連鎖するほど得点が伸びる、唯一の稼ぎ所。',
      cta: '誘爆を狙う'
    }
  ];

  var ads = {
    enabled: true,
    provider: null,     // 実配信に差し替えるための口
    everyN: 2,          // 何回のゲームオーバーごとに出すか（毎回は出さない）
    minGapMs: 45000,    // 前回の表示から最低これだけ空ける
    skipAfter: 5,       // 何秒後にスキップを押せるようにするか
    _count: 0,
    _lastAt: 0,
    _timer: null,
    _pick: 0,

    /* 今回は出すか。出しすぎると、ただ邪魔なだけになる。 */
    shouldShow: function () {
      if (!this.enabled) return false;
      this._count++;
      if (this._count % this.everyN !== 0) return false;
      var now = Date.now();
      if (now - this._lastAt < this.minGapMs) return false;
      return true;
    },

    /* 出す必要が無ければ done() をそのまま呼ぶので、
       呼び出し側は毎回これを通せばよい。 */
    maybeShow: function (panel, done) {
      if (!this.shouldShow()) { done(); return; }
      this._lastAt = Date.now();
      this.show(panel, done);
    },

    /* 表示中に画面が切り替わった時の後始末 */
    cancel: function () {
      if (this._timer) { clearInterval(this._timer); this._timer = null; }
    },

    show: function (panel, done) {
      var self = this;
      var creative = HOUSE[this._pick % HOUSE.length];
      this._pick++;

      panel.innerHTML =
        '<div class="ad-wrap">' +
        '  <div class="ad-head"><span class="ad-label">広告</span>' +
        '    <span class="ad-note" id="ad-note">' + this.skipAfter + ' 秒後にスキップできます</span></div>' +
        '  <div class="ad-slot" id="ad-slot"></div>' +
        '  <button class="ad-skip" id="ad-skip" disabled>スキップ <span id="ad-count">' +
             this.skipAfter + '</span></button>' +
        '</div>';

      var slot = panel.querySelector('#ad-slot');
      var skip = panel.querySelector('#ad-skip');
      var count = panel.querySelector('#ad-count');
      var note = panel.querySelector('#ad-note');

      var finished = false;
      function finish() {
        if (finished) return;
        finished = true;
        if (self._timer) { clearInterval(self._timer); self._timer = null; }
        done();
      }

      if (this.provider && typeof this.provider.fill === 'function') {
        // 実配信。表示が終わったら provider 側から done を呼ばせる
        this.provider.fill(slot, finish);
      } else {
        slot.innerHTML =
          '<div class="ad-creative" style="--ad:' + creative.accent + '">' +
          '  <div class="ad-tag">' + creative.tag + '</div>' +
          '  <div class="ad-title">' + creative.title + '</div>' +
          '  <div class="ad-body">' + creative.body + '</div>' +
          '  <div class="ad-cta">' + creative.cta + ' ▶</div>' +
          '</div>';
        // 自社広告なので、クリックしたらそのまま結果画面へ進める
        slot.addEventListener('click', finish);
      }

      var left = this.skipAfter;
      skip.addEventListener('click', function () { if (!skip.disabled) finish(); });
      this._timer = setInterval(function () {
        left--;
        if (left > 0) { count.textContent = left; return; }
        clearInterval(self._timer); self._timer = null;
        skip.disabled = false;
        count.textContent = '';
        skip.textContent = 'スキップ ▶';
        note.textContent = 'スキップして結果を見る';
      }, 1000);
    }
  };

  BM.ads = ads;
})(BM);
</script>
<script>
/* =========================================================
   DEEP FALL — 本体（ロジック + 描画）
   ========================================================= */
(function (BM) {
  'use strict';

  var TILE = BM.TILE, COLS = BM.COLS, L = BM.PLAY_L, R = BM.PLAY_R;
  var W = BM.VIEW_W, H = BM.VIEW_H;

  function Game(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.buf = document.createElement('canvas');
    this.buf.width = W; this.buf.height = H;
    this.bctx = this.buf.getContext('2d');
    this.tmp = document.createElement('canvas');
    this.tmp.width = W; this.tmp.height = H;
    this.tctx = this.tmp.getContext('2d');

    this.fx = BM.fx = new BM.FX();
    this.world = new BM.World();
    this.player = new BM.Player();

    this.state = BM.S_TITLE;
    this.bombs = [];
    this.flames = [];
    this.pending = [];
    this.camY = 0;
    this.score = 0;
    this.chain = 0;
    this.chainT = 0;
    this.hitStop = 0;
    this.stateT = 0;
    this.zoneIndex = 0;
    this.bestDepth = Number(BM.store.get('deepfall.best', 0)) || 0;
    this.bestScore = Number(BM.store.get('deepfall.bestScore', 0)) || 0;
    // 構造確認モード。死なずに最後まで通し、
    // 「本来なら死んでいた地点」を全部記録する。
    // 1回目の死で止まると、その先の構造が永久に検査されない。
    this.noDeath = false;
    this.deathLog = [];
    this.passedCount = 0;
    this.speedMul = 1;
    this.coinRun = 0; this.coinRunT = 0;
    this.reward = null;
    this.bgDust = [];
    for (var i = 0; i < 46; i++) {
      this.bgDust.push({ x: Math.random() * W, y: Math.random() * H, r: BM.rand(0.6, 2.2), s: BM.rand(0.15, 0.7) });
    }
    this.world.ensure(60);
  }

  /* =========================================================
     進行
     ========================================================= */

  Game.prototype.newRun = function () {
    this.world.reset();
    this.player = new BM.Player();
    this.bombs.length = 0;
    this.flames.length = 0;
    this.pending.length = 0;
    this.fx.clear();
    this.score = 0;
    this.chain = 0; this.chainT = 0;
    this.hitStop = 0;
    this.zoneIndex = 0;
    this.deathLog = [];
    this.passedCount = 0;
    this.coinRun = 0; this.coinRunT = 0;
    this.reward = null;
    this.camY = this.player.y - H * 0.34;
    this.world.ensure(BM.rowOf(this.camY) + BM.VIEW_ROWS + 24);
    this.state = BM.S_PLAY;
    this.stateT = 0;
  };

  Game.prototype.update = function (dt) {
    if (this.state !== BM.S_PLAY) {
      this.stateT += dt;
      this.fx.update(dt);
      return;
    }
    if (this.hitStop > 0) { this.hitStop -= dt; dt *= 0.2; }
    this.stateT += dt;
    if (this.chainT > 0) { this.chainT -= dt; if (this.chainT <= 0) this.chain = 0; }
    // 結晶を続けて取ると倍率が上がる。少し離れると切れる
    if (this.coinRunT > 0) { this.coinRunT -= dt; if (this.coinRunT <= 0) this.coinRun = 0; }
    if (this.reward) { this.reward.t += dt; if (this.reward.t > 2.6) this.reward = null; }

    if (BM.autopilot.enabled) BM.autopilot.step(this);

    var p = this.player;
    this.world.ensure(BM.rowOf(p.y) + BM.VIEW_ROWS + 20);
    this.world.update(dt);

    p.update(dt, this);
    if (p.crackHit > 0) p.crackHit -= dt;

    // ---- 爆弾 ----
    var i;
    for (i = this.bombs.length - 1; i >= 0; i--) {
      this.bombs[i].update(dt, this);
      if (this.bombs[i].dead) this.bombs.splice(i, 1);
    }
    for (i = this.pending.length - 1; i >= 0; i--) {
      this.pending[i].t -= dt;
      if (this.pending[i].t <= 0) {
        var q = this.pending.splice(i, 1)[0];
        this.blast(q.col, q.row, q.power, true);
      }
    }
    for (i = this.flames.length - 1; i >= 0; i--) {
      this.flames[i].t += dt;
      if (this.flames[i].t >= this.flames[i].life) this.flames.splice(i, 1);
    }

    if (p.alive) {
      this.checkButtons();
      this.checkItems();
      this.checkPassed();
    }

    // ---- カメラ：常に下へ。戻ることはない ----
    // 速く落ちるほど下を広く見せる。層の間隔は「時間」で決めているので、
    // 速度が上がると行間が広がる。先読みを増やさないと次の層が画面外になる。
    var target = p.y - H * 0.30 + BM.clamp(p.vy * 0.14, 0, 120);
    this.camY = Math.max(this.camY, BM.damp(this.camY, target, 9, dt));
    this.world.prune(BM.rowOf(this.camY));

    // ---- 地層帯の切り替わり ----
    var zi = Math.min(BM.ZONES.length - 1, Math.floor(p.deepest / BM.ZONE_ROWS));
    if (zi !== this.zoneIndex) {
      this.zoneIndex = zi;
      BM.ui.banner(BM.ZONES[zi].name + ' ' + (zi * BM.ZONE_ROWS) + 'm');
      this.fx.addFlash(0.2, '255,255,255');
      BM.sound.zone();
    }

    this.score = Math.max(this.score, p.deepest * 10);
    this.fx.update(dt);
    BM.ui.syncHud(this);
  };

  /* =========================================================
     爆弾と破壊
     ========================================================= */

  Game.prototype.dropBomb = function (p) {
    if (p.bombs <= 0) {
      // 空でも「ポケットを探る」動作はさせる。反応が無いと壊れて見える。
      // ただし連打で文字が積み上がらないよう、前の表示が消えるまでは出さない。
      var fresh = p.emptyT <= 0;
      p.throwT = 1;
      p.emptyT = 0.5;
      if (fresh) {
        BM.sound.empty();
        this.fx.text(p.x, p.y - 26, 'ポケットが空', '#ff8a8a', 14);
      }
      return false;
    }
    p.bombs--;
    p.throwT = 1;
    // 腰のポーチから出したように見せるが、掘る列は必ず真下
    var hx = p.x + 9, hy = p.y + 8;
    var b = new BM.Bomb(p.x, hy, p.power, false);
    b.vdx = 9;
    this.bombs.push(b);
    BM.sound.drop();
    this.fx.sparkle(hx, hy, '#ffd23d');
    this.fx.spawn(5, {
      x: hx, y: hy, jitter: 3, speedMin: 20, speedMax: 70,
      rMin: 1, rMax: 2.4, lifeMin: 0.15, lifeMax: 0.35,
      drag: 3, gravity: -120, colors: ['#d8c49a', '#8f7a52'], glow: false
    });
    return true;
  };

  Game.prototype.explode = function (bomb, col, row) {
    this.blast(BM.colOf(bomb.x), row, bomb.power, bomb.fromButton);
  };

  /* 十字に掘る。壁は壊れない。埋まった爆弾は誘爆する。 */
  Game.prototype.blast = function (col, row, power, quiet) {
    var dug = 0, chained = 0;
    var self = this;

    function hit(c, r) {
      if (c < L || c > R) return 'wall';
      var t = self.world.tileAt(c, r);
      self.flames.push({ col: c, row: r, t: 0, life: BM.FLAME_LIFE });
      if (t === BM.T_BOMB) {
        self.world.setTile(c, r, BM.T_EMPTY);
        self.pending.push({ col: c, row: r, power: power + 1, t: BM.CHAIN_DELAY });
        chained++;
        return 'bomb';
      }
      if (t !== BM.T_EMPTY) {
        self.world.setTile(c, r, BM.T_EMPTY);
        self.rubble(c, r);
        dug++;
      }
      return 'ok';
    }

    hit(col, row);
    for (var d = 0; d < 4; d++) {
      for (var i = 1; i <= power; i++) {
        var c = col + BM.DIRS[d].x * i, r = row + BM.DIRS[d].y * i;
        if (hit(c, r) === 'wall') break;
      }
    }

    var px = BM.centerX(col), py = BM.centerY(row);
    this.fx.explosionBurst(px, py, power);
    this.fx.addShake(5 + power);
    this.fx.addFlash(0.12, '255,190,120');
    this.fx.addAberration(1.6);
    this.hitStop = Math.max(this.hitStop, 0.04);
    BM.sound.explosion(power);

    if (chained) {
      this.chain++;
      this.chainT = 1.0;
      var bonus = 300 * this.chain * chained;
      this.score += bonus;
      this.fx.text(px, py - 18, '誘爆 +' + bonus, '#ffd23d', 17);
      if (this.chain >= 2) BM.ui.banner(this.chain + ' 連鎖!!');
      BM.sound.chain(this.chain);
    } else if (dug && !quiet) {
      this.score += dug * 15;
    }
    return dug;
  };

  Game.prototype.rubble = function (col, row) {
    var z = BM.ZONES[this.zoneIndex];
    this.fx.blockShatter(BM.centerX(col), BM.centerY(row), [z.rock, z.rockDeep, z.accent, '#ffffff']);
  };

  Game.prototype.smash = function (col, row) {
    this.world.setTile(col, row, BM.T_EMPTY);
    this.rubble(col, row);
    this.fx.addShake(4);
    this.fx.addFlash(0.06, '255,255,255');
    this.hitStop = Math.max(this.hitStop, 0.03);
    this.score += 30;
    BM.sound.crack();
  };

  /* シールド発動。ただ助かるだけだと何が起きたか分からないので、
     時間を止めて、青い衝撃波で「岩を割った」ことをはっきり見せる。 */
  Game.prototype.shieldBreak = function (p, col, row) {
    this.blast(col, row, BM.SHIELD_POWER, true);
    this.fx.shock(p.x, p.y, 120, 0.6, '140,232,255', 7);
    this.fx.shock(p.x, p.y, 70, 0.4, '255,255,255', 4);
    this.fx.text(p.x, p.y - 30, 'シールド消費', '#8ce8ff', 16);
    this.fx.addShake(14);
    this.fx.addFlash(0.3, '140,232,255');
    this.fx.spawn(24, {
      x: p.x, y: p.y, jitter: 6, speedMin: 80, speedMax: 300,
      rMin: 1.6, rMax: 4, lifeMin: 0.25, lifeMax: 0.6, drag: 2.6, gravity: 0,
      colors: ['#8ce8ff', '#ffffff', '#3d9fd0']
    });
    this.hitStop = 0.26;
    BM.ui.banner('シールド発動！ 残り ' + p.shield);
    BM.sound.shield();
  };

  Game.prototype.crash = function (p, col, row) {
    if (this.noDeath) {
      // 死なずに記録して突き抜ける
      var l = this.world.layerAt(row);
      this.deathLog.push({
        depth: p.deepest, row: row, col: col,
        type: l ? l.type : '?',
        gapW: l ? (l.gapW || null) : null,
        px: Math.round(p.x), vy: Math.round(p.vy),
        cells: l && l.cells ? Array.prototype.join.call(l.cells, '') : ''
      });
      this.world.setTile(col, row, BM.T_EMPTY);
      this.rubble(col, row);
      p.vy = Math.max(180, p.vy * 0.7);
      this.fx.addShake(9);
      this.fx.addFlash(0.12, '255,80,80');
      this.fx.text(p.x, p.y - 26, '×', '#ff5050', 22);
      BM.sound.crack();
      return;
    }
    p.alive = false;
    this.crashCell = { col: col, row: row };
    this.fx.addShake(22);
    this.fx.addFlash(0.55, '255,70,50');
    this.fx.addAberration(5);
    this.fx.vignette = 1;
    this.fx.explosionBurst(p.x, p.y, 4);
    this.fx.spawn(26, {
      x: p.x, y: p.y, jitter: 6, speedMin: 60, speedMax: 260,
      rMin: 2, rMax: 5, lifeMin: 0.3, lifeMax: 0.8, drag: 2.4, gravity: 420,
      colors: ['#e8ecf6', '#b9c2d6', '#ff7a3c'], glow: false
    });
    this.hitStop = 0.3;
    BM.sound.crash();
    this.gameOver();
  };

  Game.prototype.gameOver = function () {
    this.state = BM.S_OVER;
    this.stateT = 0;
    var d = this.player.deepest;
    this.score += this.player.bombs * 100;
    this.newBestDepth = d > this.bestDepth;
    this.newBestScore = this.score > this.bestScore;
    if (this.newBestDepth) { this.bestDepth = d; BM.store.set('deepfall.best', String(d)); }
    if (this.newBestScore) { this.bestScore = this.score; BM.store.set('deepfall.bestScore', String(this.score)); }
    BM.sound.stopMusic();
    BM.ui.showGameOver(this);
  };

  /* =========================================================
     ボタン / アイテム / 通過判定
     ========================================================= */

  Game.prototype.buttonPos = function (b) {
    // 壁の内側の面に貼り付いている
    var x = b.side < 0 ? L * TILE + 8 : (R + 1) * TILE - 8;
    return { x: x, y: BM.centerY(b.row) };
  };

  Game.prototype.checkButtons = function () {
    var p = this.player;
    for (var i = 0; i < this.world.layers.length; i++) {
      var layer = this.world.layers[i];
      var list = layer.buttons;
      if (!list) continue;
      for (var j = 0; j < list.length; j++) {
        var b = list[j];
        if (b.hit) continue;
        var pos = this.buttonPos(b);
        if (Math.abs(p.x - pos.x) < p.r + 14 && Math.abs(p.y - pos.y) < p.r + 16) {
          b.hit = true;
          b.t = 0;
          // 押した瞬間に爆弾が落ちる。プレイヤーより速いので必ず先に穴が開く
          // 穴は決まった位置に開く。導線がそこを指しているので迷わない
          this.bombs.push(new BM.Bomb(BM.centerX(layer.holeCol), pos.y + 12, p.power + 1, true));
          this.fx.shock(pos.x, pos.y, 70, 0.4, '120,255,180', 4);
          this.fx.text(pos.x, pos.y - 24, 'ON', '#8affd0', 18);
          this.fx.addShake(5);
          this.score += 150;
          BM.sound.button();
        }
      }
    }
  };

  Game.prototype.checkItems = function () {
    var p = this.player;
    for (var i = 0; i < this.world.layers.length; i++) {
      var list = this.world.layers[i].items;
      if (!list) continue;
      for (var k = 0; k < list.length; k++) {
        var it = list[k];
        if (!it.alive) continue;
        var ix = BM.centerX(it.col), iy = BM.centerY(it.row);
        if (Math.abs(p.x - ix) >= p.r + 14 || Math.abs(p.y - iy) >= p.r + 14) continue;
        it.alive = false;
        var def = BM.ITEMS[it.type];
        switch (it.type) {
          case 'BOMB':   p.bombs = Math.min(BM.MAX_BOMBS, p.bombs + 1); break;
          case 'POWER':  p.power = Math.min(BM.MAX_POWER, p.power + 1); break;
          // 上限突破ぶんを持っている時に min() で丸めると、拾ったのに減る。
          // 拾いで増えるのは通常の上限までだが、それを下回らせてはいけない。
          case 'SHIELD': if (p.shield < BM.SHIELD_MAX) p.shield += 1; break;
          case 'SLOW':   p.slow = p.slowMax = 3.5; break;
          // 結晶は取るほど連なって点が伸びる。落ちながらの寄り道の見返り
          case 'COIN':
            this.coinRun = (this.coinRun || 0) + 1;
            this.coinRunT = 1.2;
            break;
        }
        if (it.type === 'COIN') {
          var v = BM.COIN_SCORE * Math.min(5, this.coinRun);
          this.score += v;
          this.fx.text(ix, iy - 14, '+' + v + (this.coinRun > 1 ? ' ×' + Math.min(5, this.coinRun) : ''),
                       def.color, 15);
          BM.sound.coin(this.coinRun);
        } else {
          this.score += 100;
          var msg = def.label;
          if (it.type === 'POWER') msg = '爆風 ' + p.power + '/' + BM.MAX_POWER;
          else if (it.type === 'SHIELD') msg = 'シールド ' + p.shield + '枚';
          else if (it.type === 'BOMB') msg = '爆弾 ' + p.bombs + '/' + BM.MAX_BOMBS;
          this.fx.text(ix, iy - 14, msg, def.color, 15);
          BM.sound.pickup();
        }
        this.fx.sparkle(ix, iy, def.color);
      }
    }
  };

  /* ご褒美の間に入った時。ここで確実に何かが増える。
     深く潜っても景色しか変わらないと、深度そのものが目的にならない。 */
  Game.prototype.grantReward = function (r) {
    var p = this.player, k = r.kind, got = [];
    if (k.bombsFull && p.bombs < BM.MAX_BOMBS) { p.bombs = BM.MAX_BOMBS; got.push('爆弾 満タン'); }
    if (k.bombs) { p.bombs = Math.min(BM.MAX_BOMBS, p.bombs + k.bombs); got.push('爆弾 +' + k.bombs); }
    if (k.shield && p.shield < BM.SHIELD_MAX) {
      p.shield = Math.min(BM.SHIELD_MAX, p.shield + k.shield);
      got.push('シールド +' + k.shield);
    }
    // 別格だけは通常の上限を超えて持てる。アイテム拾いでは絶対に到達できない枚数
    if (k.shieldFull && p.shield < BM.SHIELD_CAP) {
      p.shield = BM.SHIELD_CAP;
      got.push('シールド ' + BM.SHIELD_CAP + '枚（上限突破）');
    }
    if (k.powerFull && p.power < BM.MAX_POWER) { p.power = BM.MAX_POWER; got.push('爆風 最大'); }
    if (k.slow) { p.slow = p.slowMax = k.slow; got.push('スロー ' + k.slow + '秒'); }
    this.score += r.bonus;
    this.reward = { kind: k, t: 0, depth: r.depth, bonus: r.bonus };
    this.fx.addFlash(0.3, '255,224,120');
    this.fx.addShake(4);
    // バナーは出さない。ご褒美の内容はトーストが全部書くので、
    // 同じ文字が2枚重なって両方読めなくなる（100m ごとの地層バナーとも被る）
    BM.ui.reward(r.depth, k, r.bonus, got);
    BM.sound.reward();
  };

  Game.prototype.checkPassed = function () {
    var p = this.player;
    for (var i = 0; i < this.world.layers.length; i++) {
      var l = this.world.layers[i];
      if (l.passed) continue;
      if (p.y > (l.row + 1) * TILE) {
        l.passed = true;
        this.passedCount++;
        if (l.reward) { this.grantReward(l.reward); continue; }
        this.score += 50;
        // ぎりぎりを抜けたら褒める
        var col = BM.colOf(p.x);
        var narrow = this.gapWidthAround(l, col);
        if (narrow === 1) {
          this.score += 200;
          this.fx.text(p.x, p.y - 30, 'ナイス!', '#8affd0', 17);
          BM.sound.nice();
        }
      }
    }
  };

  Game.prototype.gapWidthAround = function (layer, col) {
    if (!layer.cells) return 9;
    var n = 1, c;
    for (c = col - 1; c >= L && layer.cells[c] === BM.T_EMPTY; c--) n++;
    for (c = col + 1; c <= R && layer.cells[c] === BM.T_EMPTY; c++) n++;
    return n;
  };

  /* =========================================================
     描画
     ========================================================= */

  Game.prototype.render = function () {
    var g = this.bctx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    var z = BM.ZONES[this.zoneIndex];

    this.drawBackground(g, z);
    g.save();
    g.translate(0, -this.camY);
    this.fx.drawBelow(g);
    this.drawWalls(g, z);
    this.drawLayers(g, z);
    this.drawRewardBands(g);
    this.drawItems(g);
    this.drawButtons(g);
    this.drawBombs(g);
    this.drawPlayer(g);
    this.drawFlames(g);
    this.fx.drawAbove(g);
    g.restore();
    this.drawDepthRail(g, z);
    this.drawVignette(g);
    this.drawStatus(g);
    if (this.noDeath) this.drawInspectBadge(g);

    var ctx = this.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#05040a';
    ctx.fillRect(0, 0, W, H);
    var ox = this.fx.offsetX(), oy = this.fx.offsetY();
    var ab = this.fx.aberration;
    if (ab > 0.4) {
      ctx.globalCompositeOperation = 'lighter';
      this.drawChannel(ctx, '#ff0000', ox - ab, oy);
      this.drawChannel(ctx, '#00ffff', ox + ab, oy);
      ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.drawImage(this.buf, ox, oy);
    }
    if (this.fx.flash > 0.002) {
      ctx.fillStyle = 'rgba(' + this.fx.flashColor + ',' + (this.fx.flash * 0.75).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  };

  Game.prototype.drawChannel = function (ctx, color, x, y) {
    var t = this.tctx;
    t.setTransform(1, 0, 0, 1, 0, 0);
    t.globalCompositeOperation = 'source-over';
    t.clearRect(0, 0, W, H);
    t.drawImage(this.buf, 0, 0);
    t.globalCompositeOperation = 'multiply';
    t.fillStyle = color;
    t.fillRect(0, 0, W, H);
    t.globalCompositeOperation = 'source-over';
    ctx.drawImage(this.tmp, x, y);
  };

  Game.prototype.drawBackground = function (g, z) {
    var gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, z.bg1);
    gr.addColorStop(1, z.bg2);
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);

    // 奥の地層（視差）
    g.save();
    g.globalAlpha = 0.5;
    var par = this.camY * 0.35;
    for (var i = -1; i < 14; i++) {
      var y = ((i * 78 - par) % (H + 160) + H + 160) % (H + 160) - 80;
      g.fillStyle = 'rgba(255,255,255,.022)';
      g.fillRect(0, y, W, 34);
      g.fillStyle = 'rgba(0,0,0,.10)';
      g.fillRect(0, y + 34, W, 8);
    }
    g.restore();

    // 上へ流れる塵。落ちている感じはこれが一番効く
    var spd = BM.clamp(this.player.vy, 0, 900);
    for (var d = 0; d < this.bgDust.length; d++) {
      var p = this.bgDust[d];
      p.y -= (30 + spd * p.s) * 0.016;
      if (p.y < -6) { p.y = H + 6; p.x = Math.random() * W; }
      g.fillStyle = 'rgba(255,255,255,' + (0.05 + p.s * 0.08).toFixed(3) + ')';
      g.fillRect(p.x, p.y, p.r, p.r * (1 + spd * 0.012));
    }
  };

  Game.prototype.drawWalls = function (g, z) {
    var top = Math.floor(this.camY / TILE) - 1;
    var bot = top + BM.VIEW_ROWS + 3;
    for (var row = top; row <= bot; row++) {
      this.drawRock(g, L - 1, row, z, true);
      this.drawRock(g, R + 1, row, z, true);
    }
    // 内壁のふち
    g.fillStyle = 'rgba(0,0,0,.4)';
    g.fillRect(L * TILE - 4, top * TILE, 4, (bot - top + 3) * TILE);
    g.fillRect((R + 1) * TILE, top * TILE, 4, (bot - top + 3) * TILE);
  };

  Game.prototype.drawRock = function (g, col, row, z, isWall) {
    var px = col * TILE, py = row * TILE;
    var d = ((col * 31 + row * 57) % 100) / 100;
    g.fillStyle = z.rockDeep;
    g.fillRect(px, py, TILE, TILE);
    var gr = g.createLinearGradient(px, py, px, py + TILE);
    gr.addColorStop(0, z.rock);
    gr.addColorStop(1, z.rockDeep);
    g.fillStyle = gr;
    g.fillRect(px, py, TILE, TILE - 3);
    g.fillStyle = 'rgba(255,255,255,.10)';
    g.fillRect(px, py, TILE, 2.5);
    g.fillStyle = 'rgba(0,0,0,.32)';
    g.fillRect(px, py + TILE - 4, TILE, 4);
    g.fillStyle = 'rgba(255,255,255,' + (0.04 + d * 0.06).toFixed(3) + ')';
    g.beginPath(); g.arc(px + 9 + d * 18, py + 12 + d * 14, 2 + d * 1.6, 0, 6.3); g.fill();
    if (!isWall) {
      g.strokeStyle = 'rgba(0,0,0,.35)';
      g.lineWidth = 1;
      g.strokeRect(px + .5, py + .5, TILE - 1, TILE - 1);
    }
  };

  Game.prototype.drawLayers = function (g, z) {
    var top = Math.floor(this.camY / TILE) - 2;
    var bot = top + BM.VIEW_ROWS + 4;
    for (var i = 0; i < this.world.layers.length; i++) {
      var l = this.world.layers[i];
      if (l.row < top || l.row > bot || !l.cells) continue;
      for (var c = L; c <= R; c++) {
        var t = l.cells[c];
        if (t === BM.T_EMPTY) continue;
        if (t === BM.T_ROCK) this.drawRock(g, c, l.row, z, false);
