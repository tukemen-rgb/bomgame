<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEEP FALL — 落ち続ける爆弾アクション</title>
<style>
:root{
  --bg:#0a0710;
  --bg2:#160f22;
  --line:#2c1f45;
  --ink:#f4ecff;
  --dim:#9a86c4;
  --hot:#ff6a3d;
  --hot2:#ffd23d;
  --cool:#3de1ff;
  --p1:#5ad2ff;
  --p2:#ff7ac8;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 50% -10%, #2a1a45 0%, transparent 60%),
    radial-gradient(900px 600px at 90% 110%, #3a1030 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  overflow-x:hidden;
}

#app{
  width:min(640px,100%);
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* ---------- HUD ---------- */
#hud{
  display:flex;
  gap:12px;
  background:linear-gradient(180deg,#1d1430,#130d20);
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 10px;
  box-shadow:0 6px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
}
.hud-cell{display:flex;flex-direction:column;gap:2px;min-width:66px;white-space:nowrap}
.hud-depth{min-width:88px}
.hud-depth .hud-value{font-size:24px;color:#ffd23d}
.hud-depth small{font-size:12px;opacity:.7;margin-left:1px}
.hud-grow{flex:1;align-items:flex-end;min-width:0}
.hud-label{font-size:9px;letter-spacing:.14em;color:var(--dim)}
.hud-value{
  font-size:18px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(255,210,61,.35);
}
.hud-small{font-size:14px;white-space:nowrap}
.hud-value.warn{color:var(--hot);animation:pulse .6s infinite}
.hud-value.bump{animation:bump .25s ease-out}
@keyframes pulse{50%{opacity:.35}}
@keyframes bump{0%{transform:scale(1.5);color:var(--hot2)}100%{transform:scale(1)}}

/* ---------- stage ---------- */
#stage-wrap{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 18px 50px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.03);
  background:#08060e;
  line-height:0;
}
canvas#game{
  display:block;
  width:100%;
  height:auto;
  image-rendering:auto;
  touch-action:none;
}

/* ---------- overlay ---------- */
.overlay{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(8,5,15,.78);
  backdrop-filter:blur(3px);
  line-height:1.5;
  transition:opacity .18s ease;
}
.overlay.hidden{opacity:0;pointer-events:none}
.panel{
  text-align:center;
  padding:22px 26px;
  max-width:88%;
}
.panel h1{
  margin:0 0 4px;
  font-size:clamp(30px,7vw,48px);
  letter-spacing:.06em;
  background:linear-gradient(180deg,#fff3c4,var(--hot2) 45%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,106,61,.5));
}
.panel h2{margin:0 0 10px;font-size:clamp(20px,5vw,30px);letter-spacing:.05em}
.panel .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.panel .rows{display:flex;flex-direction:column;gap:8px;align-items:center;margin:14px 0}
.panel .stat{font-size:14px;color:var(--dim)}
.panel .stat b{color:var(--ink);font-size:17px}
.blink{animation:pulse 1s infinite;font-weight:700;color:var(--hot2);font-size:14px}

.menu{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.menu button{
  font:inherit;font-weight:700;font-size:15px;
  color:var(--ink);
  background:linear-gradient(180deg,#2a1c45,#1a1130);
  border:1px solid #402f66;
  border-radius:10px;
  padding:11px 18px;
  cursor:pointer;
  transition:transform .08s ease, box-shadow .15s ease, border-color .15s;
}
.menu button:hover,.menu button:focus-visible{
  border-color:var(--hot2);
  box-shadow:0 0 0 1px rgba(255,210,61,.4),0 8px 22px rgba(255,106,61,.25);
  outline:none;
}
.menu button:active{transform:translateY(2px)}
.menu button small{display:block;font-weight:500;font-size:11px;color:var(--dim);margin-top:3px}

.tips{font-size:11.5px;color:var(--dim);margin-top:12px;line-height:1.7}
.tips code{
  background:#241a3b;border:1px solid #392a5c;border-radius:4px;
  padding:1px 5px;font-size:11px;color:#ffe9a8;
}

/* ---------- combo banner ---------- */
#combo-banner{
  position:absolute;left:50%;top:22%;
  transform:translate(-50%,-50%) scale(.6);
  font-size:clamp(22px,6vw,40px);
  font-weight:900;font-style:italic;letter-spacing:.04em;
  color:#fff;
  text-shadow:0 0 18px var(--hot),0 0 40px var(--hot),0 3px 0 #7a1f00;
  opacity:0;pointer-events:none;white-space:nowrap;
  line-height:1;
}
#combo-banner.show{animation:comboPop .85s cubic-bezier(.16,1.1,.3,1) forwards}
@keyframes comboPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(2deg)}
  40%{transform:translate(-50%,-50%) scale(1) rotate(0)}
  75%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}
}

/* ---------- touch ---------- */
/* 落ちるゲームなので上入力が無い。横・急降下・爆弾の3つだけを大きく置く */
#touch{display:none;justify-content:center;align-items:center;gap:10px;padding:4px 2px}
.tbtn.wide{width:88px}
.tbtn{
  width:56px;height:56px;border-radius:14px;
  font-size:19px;font-weight:800;
  color:var(--ink);
  background:linear-gradient(180deg,#2a1c45,#160f28);
  border:1px solid #402f66;
  user-select:none;-webkit-user-select:none;touch-action:none;
}
.tbtn.big{width:76px;height:76px;font-size:30px;border-color:var(--hot)}
.tbtn:active{background:#3d2a63;transform:scale(.94)}
@media (hover:none) and (pointer:coarse){ #touch{display:flex} #legend{display:none} }

/* ---------- legend ---------- */
#legend{
  display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;
  font-size:11px;color:var(--dim);
}
#legend b{color:#ffe9a8;font-weight:700}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💣</text></svg>">
</head>
<body>
<div id="app">

  <header id="hud">
    <div class="hud-cell hud-depth">
      <span class="hud-label">DEPTH</span>
      <span id="hud-depth" class="hud-value">0<small>m</small></span>
    </div>
    <div class="hud-cell">
      <span class="hud-label">SCORE</span>
      <span id="hud-score" class="hud-value">0</span>
    </div>
    <div class="hud-cell">
      <span class="hud-label">BEST</span>
      <span id="hud-best" class="hud-value hud-small">0m</span>
    </div>
    <div class="hud-cell hud-grow">
      <span class="hud-label">BOMBS</span>
      <span id="hud-bombs" class="hud-value hud-small">💣💣💣</span>
    </div>
  </header>

  <div id="stage-wrap">
    <canvas id="game" width="600" height="640"></canvas>

    <div id="overlay" class="overlay">
      <div class="panel" id="panel"></div>
    </div>

    <div id="combo-banner"></div>
  </div>

  <div id="touch" aria-hidden="true">
    <button class="tbtn wide" data-key="ArrowLeft">◀</button>
    <button class="tbtn big" data-key=" ">💣</button>
    <button class="tbtn" data-key="ArrowDown">▼</button>
    <button class="tbtn wide" data-key="ArrowRight">▶</button>
  </div>

  <footer id="legend">
    <span><b>← →</b> 横移動</span>
    <span><b>↓</b> 急降下</span>
    <span><b>Space</b> 爆弾を落とす</span>
    <span><b>P</b> ポーズ / <b>M</b> 音楽 / <b>N</b> 効果音</span>
  </footer>

</div>

<script>
/* =========================================================
   DEEP FALL — 定数・共通ユーティリティ

   落ち続けることだけが生きている条件。
   地面に触れた瞬間に終わり。隙間は自分でこじ開ける。
   ========================================================= */
var BM = window.BM || {};

BM.TILE = 40;
BM.COLS = 15;                 // 両端の 0 と 14 は縦坑の壁
BM.PLAY_L = 1;                // 実際に通れる左端の列
BM.PLAY_R = 13;               // 同・右端
BM.VIEW_W = BM.COLS * BM.TILE;   // 600
BM.VIEW_H = 640;                 // 16 行ぶん。先を読むために縦長にしてある
BM.VIEW_ROWS = BM.VIEW_H / BM.TILE;

/* タイル */
BM.T_EMPTY = 0;
BM.T_ROCK  = 1;   // 触れたら終わり。爆風で砕ける
BM.T_CRACK = 2;   // もろい岩。ぶつかると砕けて通り抜けられる（減速する）
BM.T_BOMB  = 3;   // 岩に埋まった爆弾。爆風で誘爆して大穴が開く

BM.isSolid = function (t) { return t === BM.T_ROCK || t === BM.T_BOMB; };
BM.blocks  = function (t) { return t !== BM.T_EMPTY; };

/* ゲーム状態 */
BM.S_TITLE = 'title';
BM.S_PLAY  = 'play';
BM.S_OVER  = 'over';
BM.S_PAUSE = 'pause';

/* ---------- 落下 ---------- */
BM.GRAVITY      = 1600;   // px/s^2
BM.V_TERM_BASE  = 330;    // 終端速度の初期値
BM.V_TERM_MAX   = 620;    // 深度で上がっていく上限
BM.DIVE_MUL     = 1.75;   // 急降下中の終端速度倍率
BM.MOVE_SPEED   = 320;    // 横移動の最高速度
BM.MOVE_ACCEL   = 3000;
BM.MOVE_FRICTION = 2400;
BM.CRACK_COST   = 0.55;   // もろい岩を砕けた直後の落下速度の残り
BM.PLAYER_R     = 12;

/* ---------- 爆弾 ---------- */
BM.BOMB_FALL_V   = 900;   // 爆弾はプレイヤーよりずっと速く落ちる
BM.BOMB_POWER    = 2;     // 爆風の長さ（マス）
BM.MAX_POWER     = 6;
BM.START_BOMBS   = 3;
BM.MAX_BOMBS     = 9;
BM.FLAME_LIFE    = 0.42;
BM.CHAIN_DELAY   = 0.055;

/* ---------- 地層 ---------- */
BM.LAYER_GAP_START = 9;   // 層と層の間隔（行）。深くなるほど詰まる
BM.LAYER_GAP_MIN   = 5;
BM.REACH_MARGIN    = 0.72; // 横移動が間に合う距離の安全率

/* 深度で変わる地層の色。100m ごとに景色が変わる */
BM.ZONES = [
  { name: '表土',   rock: '#5b4a7a', rockDeep: '#33264d', bg1: '#1a1230', bg2: '#120c22', accent: '#9a7cc4' },
  { name: '玄武岩', rock: '#3f5a72', rockDeep: '#22384a', bg1: '#0e1c2a', bg2: '#0a1420', accent: '#6fb0d8' },
  { name: '結晶層', rock: '#6a4a7e', rockDeep: '#3b2450', bg1: '#1d1030', bg2: '#140a24', accent: '#cf8bf0' },
  { name: '熱層',   rock: '#7a4438', rockDeep: '#4a2018', bg1: '#2a1210', bg2: '#1c0c0a', accent: '#ff8a5c' },
  { name: '氷結層', rock: '#3f6e78', rockDeep: '#1f4048', bg1: '#0c2028', bg2: '#08161c', accent: '#7fe6e0' },
  { name: '深淵',   rock: '#3a3550', rockDeep: '#1c1930', bg1: '#0d0a18', bg2: '#070510', accent: '#b0a8ff' }
];
BM.ZONE_ROWS = 100;
BM.zoneAt = function (rows) {
  return BM.ZONES[Math.min(BM.ZONES.length - 1, Math.floor(rows / BM.ZONE_ROWS))];
};

/* ---------- アイテム ---------- */
BM.ITEMS = {
  BOMB:   { key: 'BOMB',   label: '爆弾 +1',   glyph: '💣', color: '#ffd9a8' },
  POWER:  { key: 'POWER',  label: '爆風アップ', glyph: '🔥', color: '#ff8a4c' },
  SHIELD: { key: 'SHIELD', label: 'シールド',   glyph: '🛡', color: '#8ce8ff' },
  SLOW:   { key: 'SLOW',   label: 'スロー',     glyph: '🌀', color: '#c9a6ff' }
};

/* ---------- 保存 ---------- */
BM.store = {
  get: function (k, fallback) {
    try {
      var v = window.localStorage.getItem(k);
      return v == null ? fallback : v;
    } catch (e) { return fallback; }
  },
  set: function (k, v) {
    try { window.localStorage.setItem(k, v); } catch (e) { /* 保存できなくても遊べる */ }
  }
};

/* ---------- 汎用ヘルパ ---------- */
BM.clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
BM.lerp  = function (a, b, t) { return a + (b - a) * t; };
BM.rand  = function (a, b) { return a + Math.random() * (b - a); };
BM.randInt = function (a, b) { return Math.floor(a + Math.random() * (b - a + 1)); };
BM.pick  = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
BM.shuffle = function (arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
};
BM.damp = function (a, b, lambda, dt) { return BM.lerp(a, b, 1 - Math.exp(-lambda * dt)); };

BM.colOf  = function (px) { return Math.floor(px / BM.TILE); };
BM.rowOf  = function (py) { return Math.floor(py / BM.TILE); };
BM.centerX = function (col) { return col * BM.TILE + BM.TILE / 2; };
BM.centerY = function (row) { return row * BM.TILE + BM.TILE / 2; };

BM.DIRS = [
  { x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }
];
</script>
<script>
/* =========================================================
   DEEP FALL — WebAudio による効果音 / BGM 合成
   外部アセット無し。すべてその場で波形を作る。
   ========================================================= */
(function (BM) {
  'use strict';

  function Sound() {
    this.ctx = null;
    this.master = null;
    this.sfxGain = null;
    this.musicGain = null;
    this.noise = null;
    this.sfxOn = true;
    this.musicOn = true;
    this._musicTimer = null;
    this._step = 0;
    this._nextNoteTime = 0;
    this._tempo = 138;
    this._patternIndex = 0;
  }

  Sound.prototype.init = function () {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();

    this.master = this.ctx.createGain();
    this.master.gain.value = 0.55;

    // 全体を軽くコンプレッションして、連鎖爆発でも歪まないように
    var comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 22;
    comp.ratio.value = 8;
    comp.attack.value = 0.003;
    comp.release.value = 0.22;

    this.master.connect(comp);
    comp.connect(this.ctx.destination);

    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.9;
    this.sfxGain.connect(this.master);

    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.28;
    this.musicGain.connect(this.master);

    // ホワイトノイズのバッファを一度だけ作る
    var len = this.ctx.sampleRate * 2;
    var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
  };

  Sound.prototype._now = function () { return this.ctx.currentTime; };

  /* ---------- 低レベルの部品 ---------- */

  Sound.prototype._tone = function (opt) {
    if (!this.ctx || !this.sfxOn) return;
    var t = opt.at || this._now();
    var osc = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    osc.type = opt.type || 'square';
    osc.frequency.setValueAtTime(opt.f0, t);
    if (opt.f1 != null) {
      if (opt.exp) osc.frequency.exponentialRampToValueAtTime(Math.max(1, opt.f1), t + opt.dur);
      else osc.frequency.linearRampToValueAtTime(opt.f1, t + opt.dur);
    }
    var vol = opt.vol == null ? 0.3 : opt.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (opt.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t + opt.dur);
    osc.connect(g);
    g.connect(opt.dest || this.sfxGain);
    osc.start(t);
    osc.stop(t + opt.dur + 0.05);
  };

  Sound.prototype._noiseBurst = function (opt) {
    if (!this.ctx || !this.sfxOn) return;
    var t = opt.at || this._now();
    var src = this.ctx.createBufferSource();
    src.buffer = this.noise;
    src.playbackRate.value = opt.rate || 1;

    var filt = this.ctx.createBiquadFilter();
    filt.type = opt.filter || 'lowpass';
    filt.frequency.setValueAtTime(opt.fStart, t);
    filt.frequency.exponentialRampToValueAtTime(Math.max(60, opt.fEnd), t + opt.dur);
    filt.Q.value = opt.q || 1;

    var g = this.ctx.createGain();
    var vol = opt.vol == null ? 0.4 : opt.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (opt.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + opt.dur);

    src.connect(filt); filt.connect(g); g.connect(this.sfxGain);
    src.start(t, Math.random());
    src.stop(t + opt.dur + 0.05);
  };

  /* ---------- 効果音 ---------- */

  /* 爆弾を落とす */
  Sound.prototype.drop = function () {
    if (!this.ctx) return;
    var t = this._now();
    this._tone({ at: t, type: 'square', f0: 720, f1: 220, dur: 0.16, vol: 0.16, exp: true });
    this._noiseBurst({ at: t, fStart: 2600, fEnd: 500, dur: 0.1, vol: 0.1 });
  };

  /* 爆弾切れ */
  Sound.prototype.empty = function () {
    if (!this.ctx) return;
    this._tone({ type: 'square', f0: 200, f1: 150, dur: 0.1, vol: 0.1, exp: true });
  };

  /* もろい岩を砕く */
  Sound.prototype.crack = function () {
    if (!this.ctx) return;
    var t = this._now();
    this._noiseBurst({ at: t, fStart: 4200, fEnd: 400, dur: 0.2, vol: 0.24, q: 1.5 });
    this._tone({ at: t, type: 'triangle', f0: 300, f1: 120, dur: 0.16, vol: 0.16, exp: true });
  };

  /* 壁のボタン */
  Sound.prototype.button = function () {
    if (!this.ctx) return;
    var t = this._now();
    this._tone({ at: t, type: 'square', f0: 880, dur: 0.07, vol: 0.16 });
    this._tone({ at: t + 0.06, type: 'square', f0: 1318, dur: 0.14, vol: 0.16 });
  };

  /* 狭い穴を抜けた */
  Sound.prototype.nice = function () {
    if (!this.ctx) return;
    var t = this._now();
    [1046, 1318, 1568].forEach(function (f, i) {
      this._tone({ at: t + i * 0.04, type: 'triangle', f0: f, dur: 0.12, vol: 0.13 });
    }, this);
  };

  /* シールドで岩を突き破る */
  Sound.prototype.shield = function () {
    if (!this.ctx) return;
    var t = this._now();
    this._tone({ at: t, type: 'sine', f0: 900, f1: 300, dur: 0.3, vol: 0.24, exp: true });
    this._noiseBurst({ at: t, filter: 'highpass', fStart: 800, fEnd: 4000, dur: 0.28, vol: 0.14 });
  };

  /* 地層帯の切り替わり */
  Sound.prototype.zone = function () {
    if (!this.ctx) return;
    var t = this._now();
    [523, 659, 880].forEach(function (f, i) {
      this._tone({ at: t + i * 0.09, type: 'triangle', f0: f, dur: 0.5, vol: 0.14 });
    }, this);
  };

  /* 墜落 */
  Sound.prototype.crash = function () {
    if (!this.ctx) return;
    var t = this._now();
    this._tone({ at: t, type: 'sawtooth', f0: 320, f1: 40, dur: 0.9, vol: 0.4, exp: true });
    this._noiseBurst({ at: t, fStart: 3000, fEnd: 90, dur: 0.8, vol: 0.32 });
    [392, 349, 294, 233].forEach(function (f, i) {
      this._tone({ at: t + 0.3 + i * 0.19, type: 'square', f0: f, dur: 0.3, vol: 0.16 });
    }, this);
  };

  Sound.prototype.explosion = function (power) {
    if (!this.ctx) return;
    var t = this._now();
    var p = BM.clamp(power || 1, 1, 6);
    var dur = 0.42 + p * 0.05;
    // ドン（低域のサブ）
    this._tone({ at: t, type: 'sine', f0: 150 + p * 8, f1: 28, dur: dur, vol: 0.5, exp: true, attack: 0.004 });
    // バシャッ（ノイズ）
    this._noiseBurst({ at: t, fStart: 5200, fEnd: 180, dur: dur * 0.9, vol: 0.42, rate: 1.0 });
    // 破片の高域
    this._noiseBurst({ at: t + 0.02, filter: 'highpass', fStart: 900, fEnd: 4200, dur: 0.22, vol: 0.1 });
  };

  Sound.prototype.chain = function (n) {
    if (!this.ctx) return;
    var t = this._now();
    var f = 380 + Math.min(n, 10) * 85;
    this._tone({ at: t, type: 'triangle', f0: f, f1: f * 2, dur: 0.14, vol: 0.22, exp: true });
  };


  Sound.prototype.pickup = function () {
    if (!this.ctx) return;
    var t = this._now();
    var seq = [523.25, 659.25, 783.99, 1046.5];
    for (var i = 0; i < seq.length; i++) {
      this._tone({ at: t + i * 0.045, type: 'square', f0: seq[i], dur: 0.11, vol: 0.14 });
    }
  };







  Sound.prototype.blip = function (hi) {
    if (!this.ctx) return;
    this._tone({ type: 'square', f0: hi ? 880 : 520, dur: 0.06, vol: 0.12 });
  };


  /* ---------- BGM ----------
     16分音符のシーケンサ。ベース + アルペジオ + ドラム。 */

  var SCALE = [0, 3, 5, 7, 10]; // マイナーペンタトニック
  var BASS_PAT = [0, 0, 7, 0, 5, 5, 3, 3];

  Sound.prototype.startMusic = function () {
    if (!this.ctx || !this.musicOn || this._musicTimer) return;
    var self = this;
    this._nextNoteTime = this._now() + 0.08;
    this._step = 0;
    this._musicTimer = setInterval(function () { self._scheduler(); }, 25);
  };

  Sound.prototype.stopMusic = function () {
    if (this._musicTimer) { clearInterval(this._musicTimer); this._musicTimer = null; }
  };

  Sound.prototype.setTempo = function (bpm) { this._tempo = bpm; };

  Sound.prototype._scheduler = function () {
    if (!this.ctx) return;
    var spb = 60 / this._tempo / 4; // 16分音符の長さ
    while (this._nextNoteTime < this._now() + 0.12) {
      this._playStep(this._step, this._nextNoteTime);
      this._nextNoteTime += spb;
      this._step = (this._step + 1) % 32;
    }
  };

  Sound.prototype._midi = function (n) { return 440 * Math.pow(2, (n - 69) / 12); };

  Sound.prototype._musicTone = function (type, freq, at, dur, vol) {
    var osc = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(g); g.connect(this.musicGain);
    osc.start(at); osc.stop(at + dur + 0.03);
  };

  Sound.prototype._musicNoise = function (at, dur, vol, fStart, fEnd) {
    var src = this.ctx.createBufferSource();
    src.buffer = this.noise;
    var f = this.ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.setValueAtTime(fStart, at);
    f.frequency.exponentialRampToValueAtTime(fEnd, at + dur);
    f.Q.value = 1.2;
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    src.connect(f); f.connect(g); g.connect(this.musicGain);
    src.start(at, Math.random()); src.stop(at + dur + 0.02);
  };

  Sound.prototype._playStep = function (step, at) {
    var root = 45; // A2
    // ベース（8分）
    if (step % 2 === 0) {
      var b = BASS_PAT[(step / 2) % 8];
      this._musicTone('triangle', this._midi(root + b), at, 0.16, 0.3);
    }
    // アルペジオ（16分・裏拍で軽く）
    if (step % 2 === 1) {
      var idx = (step * 3) % SCALE.length;
      var oct = (step % 8 < 4) ? 24 : 12;
      this._musicTone('square', this._midi(root + SCALE[idx] + oct), at, 0.09, 0.075);
    }
    // キック
    if (step % 8 === 0 || step % 16 === 11) {
      this._musicTone('sine', 110, at, 0.11, 0.34);
    }
    // ハイハット
    if (step % 2 === 0) this._musicNoise(at, 0.035, 0.05, 7000, 4500);
    // スネア
    if (step % 16 === 8) this._musicNoise(at, 0.11, 0.13, 1900, 700);
  };

  BM.Sound = Sound;
  BM.sound = new Sound();
})(BM);
</script>
<script>
/* =========================================================
   DEEP FALL — 演出（パーティクル / 画面揺れ / 衝撃波 / 数字）
   「爽快感」はここで作る。
   ========================================================= */
(function (BM) {
  'use strict';

  function FX() {
    this.particles = [];
    this.shocks = [];
    this.texts = [];
    this.shake = 0;
    this.shakeDir = { x: 0, y: 0 };
    this.flash = 0;
    this.flashColor = '255,255,255';
    this.aberration = 0;
    this.vignette = 0;
    this._sx = 0; this._sy = 0;
  }

  FX.prototype.clear = function () {
    this.particles.length = 0;
    this.shocks.length = 0;
    this.texts.length = 0;
    this.shake = 0; this.flash = 0; this.aberration = 0; this.vignette = 0;
  };

  /* ---------- 入力系 ---------- */

  FX.prototype.addShake = function (amount, dx, dy) {
    this.shake = Math.min(26, this.shake + amount);
    if (dx || dy) {
      var l = Math.hypot(dx, dy) || 1;
      this.shakeDir.x = dx / l; this.shakeDir.y = dy / l;
    } else {
      this.shakeDir.x = 0; this.shakeDir.y = 0;
    }
  };

  FX.prototype.addFlash = function (a, color) {
    this.flash = Math.min(1, this.flash + a);
    if (color) this.flashColor = color;
  };

  FX.prototype.addAberration = function (a) {
    // 強すぎると画面が読めなくなるので、上限は小さく・戻りは速く
    this.aberration = Math.min(5, this.aberration + a);
  };

  FX.prototype.shock = function (x, y, maxR, life, color, width) {
    this.shocks.push({
      x: x, y: y, r: 6, maxR: maxR, t: 0, life: life || 0.36,
      color: color || '255,190,90', w: width || 5
    });
  };

  FX.prototype.text = function (x, y, str, color, size, vy) {
    // 連鎖中は同じ場所に何枚も出るので、少しずらして重なりを散らす
    this.texts.push({
      x: x + BM.rand(-9, 9), y: y + BM.rand(-5, 5), s: str, t: 0, life: 0.9,
      color: color || '#ffe14d', size: size || 15, vy: vy == null ? -46 : vy
    });
  };

  FX.prototype.spawn = function (n, opt) {
    for (var i = 0; i < n; i++) {
      var ang = opt.angle != null
        ? opt.angle + BM.rand(-opt.spread, opt.spread)
        : BM.rand(0, Math.PI * 2);
      var sp = BM.rand(opt.speedMin, opt.speedMax);
      this.particles.push({
        x: opt.x + BM.rand(-(opt.jitter || 0), opt.jitter || 0),
        y: opt.y + BM.rand(-(opt.jitter || 0), opt.jitter || 0),
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        g: opt.gravity == null ? 0 : opt.gravity,
        drag: opt.drag == null ? 1.8 : opt.drag,
        r: BM.rand(opt.rMin || 1.5, opt.rMax || 4),
        t: 0,
        life: BM.rand(opt.lifeMin || 0.3, opt.lifeMax || 0.8),
        colors: opt.colors,
        color: BM.pick(opt.colors),
        shape: opt.shape || 'circle',
        rot: BM.rand(0, Math.PI * 2),
        vr: BM.rand(-9, 9),
        glow: opt.glow !== false,
        fade: opt.fade == null ? 1 : opt.fade
      });
    }
  };

  /* ---------- プリセット ---------- */

  FX.prototype.explosionBurst = function (x, y, power) {
    var p = BM.clamp(power, 1, 8);
    this.spawn(16 + p * 3, {
      x: x, y: y, jitter: 6,
      speedMin: 60, speedMax: 240 + p * 22,
      rMin: 2, rMax: 5.5, lifeMin: 0.22, lifeMax: 0.62,
      colors: ['#fff6c8', '#ffd23d', '#ff8a2b', '#ff4d2b'],
      drag: 2.6, gravity: 120
    });
    this.spawn(8, {
      x: x, y: y, jitter: 4,
      speedMin: 20, speedMax: 90,
      rMin: 6, rMax: 13, lifeMin: 0.4, lifeMax: 0.9,
      colors: ['rgba(120,110,130,.55)', 'rgba(80,70,95,.5)', 'rgba(160,150,170,.4)'],
      drag: 3.2, gravity: -40, glow: false
    });
    this.shock(x, y, 44 + p * 12, 0.34, '255,200,110', 5);
  };

  FX.prototype.blockShatter = function (x, y, base) {
    this.spawn(14, {
      x: x, y: y, jitter: 13,
      speedMin: 40, speedMax: 190,
      rMin: 2.5, rMax: 6.5, lifeMin: 0.35, lifeMax: 0.85,
      colors: base || ['#7a5ba8', '#5c4183', '#9a7cc4', '#3d2b5c'],
      drag: 2.2, gravity: 620, shape: 'rect', glow: false
    });
  };

  FX.prototype.enemyPop = function (x, y, color) {
    this.spawn(22, {
      x: x, y: y, jitter: 5,
      speedMin: 50, speedMax: 210,
      rMin: 2, rMax: 5, lifeMin: 0.3, lifeMax: 0.75,
      colors: [color, '#ffffff', '#ffd23d'],
      drag: 2.4, gravity: 260
    });
    this.shock(x, y, 40, 0.3, '255,255,255', 3);
  };

  FX.prototype.sparkle = function (x, y, color) {
    this.spawn(10, {
      x: x, y: y, jitter: 10,
      speedMin: 15, speedMax: 70,
      rMin: 1.2, rMax: 3, lifeMin: 0.4, lifeMax: 0.9,
      colors: [color, '#ffffff'],
      drag: 1.4, gravity: -60
    });
  };

  FX.prototype.dust = function (x, y) {
    this.spawn(3, {
      x: x, y: y, jitter: 4,
      speedMin: 8, speedMax: 40,
      rMin: 1.5, rMax: 3.5, lifeMin: 0.2, lifeMax: 0.45,
      colors: ['rgba(190,175,220,.5)', 'rgba(140,125,175,.4)'],
      drag: 3, gravity: -30, glow: false
    });
  };

  /* ---------- 更新 ---------- */

  FX.prototype.update = function (dt) {
    var i, p;
    for (i = this.particles.length - 1; i >= 0; i--) {
      p = this.particles[i];
      p.t += dt;
      if (p.t >= p.life) { this.particles.splice(i, 1); continue; }
      var d = Math.exp(-p.drag * dt);
      p.vx *= d; p.vy *= d;
      p.vy += p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    for (i = this.shocks.length - 1; i >= 0; i--) {
      var s = this.shocks[i];
      s.t += dt;
      if (s.t >= s.life) { this.shocks.splice(i, 1); continue; }
      var k = s.t / s.life;
      s.r = 6 + (s.maxR - 6) * (1 - Math.pow(1 - k, 2.6));
    }
    for (i = this.texts.length - 1; i >= 0; i--) {
      var t = this.texts[i];
      t.t += dt;
      if (t.t >= t.life) { this.texts.splice(i, 1); continue; }
      t.y += t.vy * dt;
      t.vy *= Math.exp(-2.4 * dt);
    }

    this.shake = Math.max(0, this.shake - dt * (this.shake * 6 + 12));
    this.flash = Math.max(0, this.flash - dt * 4.2);
    this.aberration = Math.max(0, this.aberration - dt * 42);
    this.vignette = Math.max(0, this.vignette - dt * 1.6);

    if (this.shake > 0.05) {
      var mag = this.shake;
      if (this.shakeDir.x || this.shakeDir.y) {
        this._sx = this.shakeDir.x * mag * BM.rand(0.4, 1) + BM.rand(-mag, mag) * 0.35;
        this._sy = this.shakeDir.y * mag * BM.rand(0.4, 1) + BM.rand(-mag, mag) * 0.35;
      } else {
        this._sx = BM.rand(-mag, mag);
        this._sy = BM.rand(-mag, mag);
      }
    } else { this._sx = 0; this._sy = 0; }
  };

  FX.prototype.offsetX = function () { return this._sx; };
  FX.prototype.offsetY = function () { return this._sy; };

  /* ---------- 描画 ---------- */

  FX.prototype.drawBelow = function (ctx) {
    // 衝撃波リング（加算合成）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < this.shocks.length; i++) {
      var s = this.shocks[i];
      var k = s.t / s.life;
      var a = (1 - k) * (1 - k);
      ctx.strokeStyle = 'rgba(' + s.color + ',' + (a * 0.85).toFixed(3) + ')';
      ctx.lineWidth = s.w * (1 - k * 0.65) + 0.4;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  };

  FX.prototype.drawAbove = function (ctx) {
    var i, p, k, a;
    ctx.save();
    // 発光しないパーティクル（瓦礫・煙）
    for (i = 0; i < this.particles.length; i++) {
      p = this.particles[i];
      if (p.glow) continue;
      k = p.t / p.life;
      a = 1 - k * k;
      ctx.globalAlpha = a * p.fade;
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k * 0.35), 0, Math.PI * 2); ctx.fill();
      }
    }
    // 発光パーティクル
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < this.particles.length; i++) {
      p = this.particles[i];
      if (!p.glow) continue;
      k = p.t / p.life;
      a = 1 - k * k;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      var r = p.r * (1 - k * 0.5);
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = a * 0.28;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // 浮かぶ数字・テキスト
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (i = 0; i < this.texts.length; i++) {
      var t = this.texts[i];
      k = t.t / t.life;
      var sc = k < 0.15 ? BM.lerp(1.6, 1, k / 0.15) : 1;
      ctx.globalAlpha = k > 0.6 ? (1 - (k - 0.6) / 0.4) : 1;
      ctx.font = '900 ' + (t.size * sc).toFixed(1) + 'px system-ui, sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.strokeText(t.s, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.s, t.x, t.y);
    }
    ctx.restore();
  };

  BM.FX = FX;
})(BM);
</script>
<script>
/* =========================================================
   DEEP FALL — 縦坑の生成

   無限に下へ続く。一定間隔で「地層」を挟み、そこに隙間を作る。
   隙間の作り方が このゲームの語彙そのものなので、種類を増やしてある。

   生成時に必ず守ること：
     ・直前の隙間から横移動が間に合う位置にしか次の隙間を置かない
       （落下は止められないので、届かない隙間は理不尽death になる）
     ・動く地層は完全には閉じない（到着タイミングで詰むのを防ぐ）
     ・ボタン式の全面岩は、ボタンを直前の隙間に近い側の壁に置く
   ========================================================= */
(function (BM) {
  'use strict';

  var COLS = BM.COLS, L = BM.PLAY_L, R = BM.PLAY_R, TILE = BM.TILE;

  /* 落下中に横へ何マス動けるか */
  function reachTiles(dropRows, vTerm) {
    return (BM.MOVE_SPEED * (dropRows * TILE / vTerm) * BM.REACH_MARGIN) / TILE;
  }

  function newCells(fill) {
    var c = new Uint8Array(COLS);
    for (var i = 0; i < COLS; i++) c[i] = (i < L || i > R) ? BM.T_ROCK : fill;
    return c;
  }

  /* 動く穴の角速度の上限。
     穴がプレイヤーの横移動より速く逃げると、追いつけず理不尽になる。
     振幅 span/2 タイルの往復なので、最大速度 = span/2 * 角速度 [タイル/秒]。 */
  function maxAngular(spanTiles) {
    var maxPx = BM.MOVE_SPEED * 0.55;
    return maxPx / (TILE * Math.max(1, spanTiles / 2));
  }

  function carve(cells, x, w) {
    var half = (w - 1) / 2;
    for (var i = Math.round(x - half); i <= Math.round(x + half); i++) {
      if (i >= L && i <= R) cells[i] = BM.T_EMPTY;
    }
  }

  /* =========================================================
     地層の種類
     各ビルダーは layer を組み立てて、通り抜けられる代表列を gapX に入れる
     ========================================================= */
  var BUILDERS = {

    /* 素直な穴 */
    gap: function (layer, cfg) {
      layer.cells = newCells(BM.T_ROCK);
      carve(layer.cells, layer.gapX, cfg.gapW);
      layer.hint = '';
      var h = (cfg.gapW - 1) / 2;
      layer.exit = [layer.gapX - h, layer.gapX + h];
    },

    /* 穴が2つ。広いほうが安全、狭いほうが近道。
       どちらを抜けても次の層に届くよう、2つの間隔は広げすぎない。 */
    twin: function (layer, cfg) {
      layer.cells = newCells(BM.T_ROCK);
      carve(layer.cells, layer.gapX, cfg.gapW);
      // 2つ目も「直前の出口から届く窓」の中に置く。
      // ここを外すと、そちらを選んだ瞬間に届かなくなる。
      var lo = Math.max(L, cfg.allowedLo), hi = Math.min(R, cfg.allowedHi);
      var spread = BM.randInt(3, 5) * (Math.random() < 0.5 ? -1 : 1);
      var other = BM.clamp(layer.gapX + spread, lo, hi);
      if (Math.abs(other - layer.gapX) < 3) other = BM.clamp(layer.gapX - spread, lo, hi);
      if (Math.abs(other - layer.gapX) < 2) other = layer.gapX;
      carve(layer.cells, other, 1);
      layer.altGapX = other;
      layer.exit = [Math.min(layer.gapX, other), Math.max(layer.gapX, other)];
    },

    /* 一面もろい岩。ぶつかれば砕けるが、そのぶん落下が鈍る。
       どこでも抜けられる＝出口が自由なので exit は全幅 */
    crack: function (layer) {
      layer.cells = newCells(BM.T_CRACK);
      layer.hint = 'もろい';
      layer.exit = [L, R]; layer.exitFree = true;
    },

    /* 岩ともろい岩の混在。どこを抜けるか選ぶ */
    crackmix: function (layer, cfg) {
      layer.cells = newCells(BM.T_ROCK);
      for (var i = -2; i <= 2; i++) {
        var c = Math.round(layer.gapX) + i;
        if (c >= L && c <= R) layer.cells[c] = BM.T_CRACK;
      }
      if (cfg.gapW > 1) carve(layer.cells, layer.gapX, 1);
      layer.exit = [layer.gapX - 2, layer.gapX + 2];
    },

    /* 全面岩。壁のボタンを蹴ると爆弾が落ちてきて穴が開く。
       ボタンは層より上にあるので、そこへ届く時間で側を決める必要がある。
       間に合わない配置になるくらいなら、この層だけ落差を伸ばす。 */
    button: function (layer, cfg) {
      layer.cells = newCells(BM.T_ROCK);
      // 左右どちらの壁にも置く。片側だけだと、反対の壁側から来たときに
      // 横移動が間に合わず理不尽になる（どちら側にいても最大6マスで届く）。
      var y = layer.row - cfg.buttonOffset;
      layer.buttons = [
        { col: L, row: y, side: -1, hit: false, t: 0 },
        { col: R, row: y, side: 1, hit: false, t: 0 }
      ];
      layer.gapX = (L + R) / 2;
      layer.hint = 'ボタン';
      layer.exit = [L, R];      // どちらの壁を使ったかで出口が変わる
    },

    /* 穴が横にスライドし続ける */
    shutter: function (layer, cfg) {
      layer.dynamic = true;
      layer.gapW = cfg.gapW + 1;
      layer.range = [L + 1, R - 1];
      var cap = maxAngular(layer.range[1] - layer.range[0]);
      layer.speed = BM.rand(cap * 0.5, cap) * (Math.random() < 0.5 ? -1 : 1);
      layer.refresh = function (t) {
        var span = this.range[1] - this.range[0];
        var u = (Math.sin(t * this.speed) + 1) / 2;
        var x = this.range[0] + u * span;
        this.cells = newCells(BM.T_ROCK);
        carve(this.cells, x, this.gapW);
        this.gapX = x;
      };
      layer.hint = '横に動く';
      layer.exit = [L, R]; layer.exitFree = true;   // 好きな位置で待って抜けられる
    },

    /* 穴が広がったり狭まったりする。閉じ切りはしない（詰み防止） */
    gate: function (layer, cfg) {
      layer.dynamic = true;
      layer.speed = BM.rand(0.9, 1.4);
      layer.wide = cfg.gapW + 2;
      layer.refresh = function (t) {
        var u = (Math.sin(t * this.speed) + 1) / 2;
        var w = 1 + Math.round(u * (this.wide - 1));
        this.cells = newCells(BM.T_ROCK);
        carve(this.cells, this.gapX, w);
        this.curW = w;
      };
      layer.hint = '開閉';
      layer.exit = [layer.gapX, layer.gapX];   // 位置は固定。狭まる瞬間があるので厳しく見る
    },

    /* 逆向きに動く穴が2つ。どちらを抜けるか選ぶ */
    spinner: function (layer, cfg) {
      layer.dynamic = true;
      layer.speed = maxAngular(R - L - 2) * BM.rand(0.5, 0.95);
      layer.gapW = cfg.gapW;
      layer.refresh = function (t) {
        var mid = (L + R) / 2, span = (R - L) / 2 - 1;
        var a = mid + Math.sin(t * this.speed) * span;
        var b = mid - Math.sin(t * this.speed) * span;
        this.cells = newCells(BM.T_ROCK);
        carve(this.cells, a, this.gapW);
        carve(this.cells, b, this.gapW);
        this.gapX = a;
      };
      layer.hint = '二重';
      layer.exit = [L, R]; layer.exitFree = true;
    },

    /* 岩に爆弾が埋まっている。穴は狭いが、撃ち抜けば大穴とボーナス */
    bombrock: function (layer) {
      layer.cells = newCells(BM.T_ROCK);
      carve(layer.cells, layer.gapX, 1);
      var spots = BM.shuffle([L + 1, L + 3, L + 5, R - 5, R - 3, R - 1])
        .filter(function (c) { return Math.abs(c - layer.gapX) > 1; })
        .slice(0, BM.randInt(2, 3));
      for (var i = 0; i < spots.length; i++) layer.cells[spots[i]] = BM.T_BOMB;
      layer.hint = '誘爆';
      layer.exit = [layer.gapX, layer.gapX];
    }
  };

  /* 深度ごとの出現テーブル */
  function typeTable(rows) {
    var t = [['gap', 40], ['twin', 18], ['crack', 14]];
    if (rows > 18) t.push(['crackmix', 14]);
    if (rows > 28) t.push(['shutter', 16]);
    if (rows > 45) t.push(['button', 13]);
    if (rows > 70) t.push(['gate', 14]);
    if (rows > 95) t.push(['bombrock', 12]);
    if (rows > 125) t.push(['spinner', 13]);
    return t;
  }

  function pickType(rows, lastType) {
    var t = typeTable(rows).filter(function (e) { return e[0] !== lastType; });
    var sum = 0, i;
    for (i = 0; i < t.length; i++) sum += t[i][1];
    var r = Math.random() * sum;
    for (i = 0; i < t.length; i++) { r -= t[i][1]; if (r <= 0) return t[i][0]; }
    return 'gap';
  }

  /* =========================================================
     World
     ========================================================= */
  function World() {
    this.reset();
  }

  World.prototype.reset = function () {
    this.layers = [];
    this.byRow = {};
    this.nextRow = 12;      // 最初の数行は何も無い（落ち始める助走）
    this.exit = { lo: 7, hi: 7 };   // 直前の層を抜けたあと居られる列の範囲
    this.exitFree = false;          // その範囲を自分で選べたか（もろい岩・動く穴）
    this.lastType = '';
    this.t = 0;
    this.deepest = 0;
  };

  World.prototype.vTerm = function (rows) {
    return BM.lerp(BM.V_TERM_BASE, BM.V_TERM_MAX, BM.clamp(rows / 400, 0, 1));
  };

  World.prototype.difficulty = function (rows) {
    var k = BM.clamp(rows / 260, 0, 1);
    return {
      spacing: Math.round(BM.lerp(BM.LAYER_GAP_START, BM.LAYER_GAP_MIN, k)),
      gapW: Math.max(1, Math.round(BM.lerp(3.4, 1.2, k)))
    };
  };

  /* untilRow まで地層を用意する */
  World.prototype.ensure = function (untilRow) {
    var guard = 0;
    while (this.nextRow <= untilRow && guard++ < 400) {
      var rows = this.nextRow;
      var cfg = this.difficulty(rows);
      cfg.vTerm = this.vTerm(rows);
      var type = pickType(rows, this.lastType);

      // ボタン層だけは、ボタンへ横移動が間に合う落差を「置く前に」確保する。
      // 層の後ろで間隔を足しても、そのボタンには届かない。
      if (type === 'button') {
        // 出口の範囲のどこから来ても、近いほうの壁へ届く落差を確保する
        var bneed = 0;
        for (var bx = Math.floor(this.exit.lo); bx <= Math.ceil(this.exit.hi); bx++) {
          bneed = Math.max(bneed, Math.min(Math.abs(bx - L), Math.abs(bx - R)));
        }
        cfg.buttonOffset = 4;
        var needRows = Math.ceil(bneed * cfg.vTerm / (BM.MOVE_SPEED * BM.REACH_MARGIN)) + cfg.buttonOffset + 2;
        if (needRows > cfg.spacing) {
          rows += needRows - cfg.spacing;
          this.nextRow = rows;
          cfg.spacing = needRows;
        }
      }

      var layer = {
        row: rows,
        type: type,
        t: 0,
        phase: BM.rand(0, 6.28),
        cells: null,
        gapX: 7,
        button: null,
        dynamic: false,
        hint: '',
        item: null,
        passed: false
      };

      // 直前の層の出口から横移動が間に合う範囲にだけ次の穴を置く。
      //   出口が固定の層（穴・ボタンなど）→ 出口の端から端まで全部届く範囲（厳しい側）
      //   出口が自由な層（もろい岩・動く穴）→ 好きな場所で抜けられるので緩い側
      // 出口の性質で自動的に切り替わるように、狭いほうが空なら広いほうを使う。
      var reach = reachTiles(cfg.spacing, cfg.vTerm);
      var lo, hi;
      if (this.exitFree) {
        // 直前の層はどこでも抜けられた＝好きな位置に構えられる
        lo = Math.ceil(this.exit.lo - reach);
        hi = Math.floor(this.exit.hi + reach);
      } else {
        // 出口が決まっていた＝その範囲のどこから出ても届く位置に限る
        lo = Math.ceil(this.exit.hi - reach);
        hi = Math.floor(this.exit.lo + reach);
      }
      lo = Math.max(L + 1, lo);
      hi = Math.min(R - 1, hi);
      if (lo > hi) lo = hi = BM.clamp(Math.round((this.exit.lo + this.exit.hi) / 2), L + 1, R - 1);
      layer.gapX = BM.randInt(lo, hi);
      layer.exit = [layer.gapX, layer.gapX];
      cfg.allowedLo = lo; cfg.allowedHi = hi;

      BUILDERS[type](layer, cfg, { lo: this.exit.lo, hi: this.exit.hi });

      // ときどきアイテムを浮かべる
      if (Math.random() < 0.3) {
        var pool = ['BOMB', 'BOMB', 'POWER', 'SHIELD', 'SLOW'];
        layer.item = {
          col: BM.clamp(layer.gapX + BM.randInt(-1, 1), L, R),
          row: layer.row - BM.randInt(2, 4),
          type: BM.pick(pool),
          t: 0,
          alive: true
        };
      }

      this.layers.push(layer);
      this.byRow[layer.row] = layer;

      this.exit = {
        lo: BM.clamp(layer.exit[0], L, R),
        hi: BM.clamp(layer.exit[1], L, R)
      };
      this.exitFree = !!layer.exitFree;
      this.lastType = type;
      this.nextRow += cfg.spacing + (layer.extraRows || 0);
      this.deepest = layer.row;
    }
  };

  World.prototype.update = function (dt) {
    this.t += dt;
    for (var i = 0; i < this.layers.length; i++) {
      var l = this.layers[i];
      l.t += dt;
      if (l.dynamic && l.refresh) l.refresh(l.t + l.phase);
    }
  };

  World.prototype.layerAt = function (row) {
    return this.byRow[row] || null;
  };

  World.prototype.tileAt = function (col, row) {
    if (col < L || col > R) return BM.T_ROCK;         // 縦坑の壁
    var l = this.byRow[row];
    if (!l || l.row !== row || !l.cells) return BM.T_EMPTY;
    return l.cells[col];
  };

  World.prototype.setTile = function (col, row, v) {
    if (col < L || col > R) return;
    var l = this.byRow[row];
    if (!l || l.row !== row || !l.cells) return;
    l.cells[col] = v;
  };

  /* 画面より十分上に流れた地層を捨てる */
  World.prototype.prune = function (aboveRow) {
    if (this.layers.length < 40) return;
    var kept = [];
    for (var i = 0; i < this.layers.length; i++) {
      var l = this.layers[i];
      if (l.row < aboveRow - 6) {
        delete this.byRow[l.row];
      } else kept.push(l);
    }
    this.layers = kept;
  };

  BM.World = World;
  BM.reachTiles = reachTiles;
})(BM);
</script>
<script>
/* =========================================================
   DEEP FALL — プレイヤー / 爆弾 / 爆風
   ========================================================= */
(function (BM) {
  'use strict';

  var TILE = BM.TILE, L = BM.PLAY_L, R = BM.PLAY_R;
  var nextId = 1;

  /* =========================================================
     Player — 落ち続けることしかできない
     ========================================================= */
  function Player() {
    this.id = nextId++;
    this.x = BM.centerX(7);
    this.y = -TILE * 3;
    this.vx = 0;
    this.vy = 60;
    this.r = BM.PLAYER_R;

    this.bombs = BM.START_BOMBS;
    this.power = BM.BOMB_POWER;
    this.shield = 0;
    this.slow = 0;

    this.alive = true;
    this.dir = 0;          // -1 / 0 / 1
    this.lean = 0;
    this.spin = 0;
    this.nozzle = 0;
    this.diving = false;
    this.trail = [];
    this.crackHit = 0;
    this.deepest = 0;
  }

  Player.prototype.termV = function (world) {
    var v = world.vTerm(this.deepest);
    if (this.diving) v *= BM.DIVE_MUL;
    if (this.slow > 0) v *= 0.55;
    return v;
  };

  Player.prototype.update = function (dt, game) {
    if (!this.alive) return;
    var K = BM.input.keys;
    var world = game.world;

    if (this.slow > 0) this.slow -= dt;
    if (this.nozzle > 0) this.nozzle -= dt * 4;

    // ---- 横 ----
    var ix = (K['ArrowRight'] || K['d'] ? 1 : 0) - (K['ArrowLeft'] || K['a'] ? 1 : 0);
    this.dir = ix;
    if (ix !== 0) {
      this.vx += ix * BM.MOVE_ACCEL * dt;
      var max = BM.MOVE_SPEED * (this.slow > 0 ? 0.85 : 1);
      this.vx = BM.clamp(this.vx, -max, max);
    } else {
      var f = BM.MOVE_FRICTION * dt;
      this.vx = Math.abs(this.vx) <= f ? 0 : this.vx - Math.sign(this.vx) * f;
    }
    this.lean = BM.damp(this.lean, this.vx / BM.MOVE_SPEED, 9, dt);

    // ---- 縦 ----
    this.diving = !!(K['ArrowDown'] || K['s']);
    var vt = this.termV(world);
    if (this.vy < vt) this.vy = Math.min(vt, this.vy + BM.GRAVITY * dt * (this.diving ? 1.6 : 1));
    else this.vy = Math.max(vt, this.vy - BM.GRAVITY * 0.8 * dt);

    // 速いときに一気に動かすとタイルを飛び越えてしまうので、小刻みに進める
    var remainX = this.vx * dt, remainY = this.vy * dt;
    var steps = Math.max(1, Math.ceil(Math.max(Math.abs(remainX), Math.abs(remainY)) / 8));
    for (var s = 0; s < steps && this.alive; s++) {
      this.x = BM.clamp(this.x + remainX / steps,
                        (L) * TILE + this.r, (R + 1) * TILE - this.r);
      this.y += remainY / steps;
      this.resolve(game);
    }

    this.spin += dt * (2 + Math.abs(this.vx) / 90);
    this.deepest = Math.max(this.deepest, Math.floor(this.y / TILE));

    this.trail.push({ x: this.x, y: this.y, t: 0 });
    if (this.trail.length > 14) this.trail.shift();
    for (var i = this.trail.length - 1; i >= 0; i--) {
      this.trail[i].t += dt;
      if (this.trail[i].t > 0.28) this.trail.splice(i, 1);
    }

    if (BM.input.pressed(' ') || BM.input.pressed('Enter')) game.dropBomb(this);
  };

  /* 今いる位置がタイルと重なっているかを見る。
     もろい岩なら砕いて通す。岩なら終わり。 */
  Player.prototype.resolve = function (game) {
    var world = game.world;
    var c0 = BM.colOf(this.x - this.r + 1), c1 = BM.colOf(this.x + this.r - 1);
    var r0 = BM.rowOf(this.y - this.r + 1), r1 = BM.rowOf(this.y + this.r - 1);

    for (var row = r0; row <= r1; row++) {
      for (var col = c0; col <= c1; col++) {
        var t = world.tileAt(col, row);
        if (t === BM.T_EMPTY) continue;

        if (t === BM.T_CRACK) {
          game.smash(col, row);
          this.vy = Math.max(120, this.vy * BM.CRACK_COST);
          this.crackHit = 0.25;
          continue;
        }
        // 岩に触れた
        if (this.shield > 0) {
          this.shield--;
          game.shieldBreak(this, col, row);
          this.vy = Math.max(150, this.vy * 0.5);
          continue;
        }
        game.crash(this, col, row);
        return;
      }
    }
  };

  /* =========================================================
     Bomb — 落として、地層に当たったところで爆ぜる
     ========================================================= */
  function Bomb(x, y, power, fromButton) {
    this.id = nextId++;
    this.x = x;
    this.y = y;
    this.vy = BM.BOMB_FALL_V;
    this.power = power;
    this.t = 0;
    this.dead = false;
    this.fromButton = fromButton || false;
    this.chain = false;
  }

  Bomb.prototype.update = function (dt, game) {
    this.t += dt;
    var steps = Math.max(1, Math.ceil(this.vy * dt / 10));
    for (var s = 0; s < steps; s++) {
      this.y += this.vy * dt / steps;
      var col = BM.colOf(this.x), row = BM.rowOf(this.y + 10);
      var t = game.world.tileAt(col, row);
      if (t !== BM.T_EMPTY) { game.explode(this, col, row); this.dead = true; return; }
    }
    if (this.y > game.player.y + BM.VIEW_H * 1.6) this.dead = true;
  };

  BM.Player = Player;
  BM.Bomb = Bomb;
})(BM);
</script>
<script>
/* =========================================================
   DEEP FALL — 本体（ロジック + 描画）
   ========================================================= */
(function (BM) {
  'use strict';

  var TILE = BM.TILE, COLS = BM.COLS, L = BM.PLAY_L, R = BM.PLAY_R;
  var W = BM.VIEW_W, H = BM.VIEW_H;

  function Game(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.buf = document.createElement('canvas');
    this.buf.width = W; this.buf.height = H;
    this.bctx = this.buf.getContext('2d');
    this.tmp = document.createElement('canvas');
    this.tmp.width = W; this.tmp.height = H;
    this.tctx = this.tmp.getContext('2d');

    this.fx = BM.fx = new BM.FX();
    this.world = new BM.World();
    this.player = new BM.Player();

    this.state = BM.S_TITLE;
    this.bombs = [];
    this.flames = [];
    this.pending = [];
    this.camY = 0;
    this.score = 0;
    this.chain = 0;
    this.chainT = 0;
    this.hitStop = 0;
    this.stateT = 0;
    this.zoneIndex = 0;
    this.bestDepth = Number(BM.store.get('deepfall.best', 0)) || 0;
    this.bestScore = Number(BM.store.get('deepfall.bestScore', 0)) || 0;
    this.bgDust = [];
    for (var i = 0; i < 46; i++) {
      this.bgDust.push({ x: Math.random() * W, y: Math.random() * H, r: BM.rand(0.6, 2.2), s: BM.rand(0.15, 0.7) });
    }
    this.world.ensure(60);
  }

  /* =========================================================
     進行
     ========================================================= */

  Game.prototype.newRun = function () {
    this.world.reset();
    this.player = new BM.Player();
    this.bombs.length = 0;
    this.flames.length = 0;
    this.pending.length = 0;
    this.fx.clear();
    this.score = 0;
    this.chain = 0; this.chainT = 0;
    this.hitStop = 0;
    this.zoneIndex = 0;
    this.camY = this.player.y - H * 0.34;
    this.world.ensure(BM.rowOf(this.camY) + BM.VIEW_ROWS + 24);
    this.state = BM.S_PLAY;
    this.stateT = 0;
  };

  Game.prototype.update = function (dt) {
    if (this.state !== BM.S_PLAY) {
      this.stateT += dt;
      this.fx.update(dt);
      return;
    }
    if (this.hitStop > 0) { this.hitStop -= dt; dt *= 0.2; }
    this.stateT += dt;
    if (this.chainT > 0) { this.chainT -= dt; if (this.chainT <= 0) this.chain = 0; }

    var p = this.player;
    this.world.ensure(BM.rowOf(p.y) + BM.VIEW_ROWS + 20);
    this.world.update(dt);

    p.update(dt, this);
    if (p.crackHit > 0) p.crackHit -= dt;

    // ---- 爆弾 ----
    var i;
    for (i = this.bombs.length - 1; i >= 0; i--) {
      this.bombs[i].update(dt, this);
      if (this.bombs[i].dead) this.bombs.splice(i, 1);
    }
    for (i = this.pending.length - 1; i >= 0; i--) {
      this.pending[i].t -= dt;
      if (this.pending[i].t <= 0) {
        var q = this.pending.splice(i, 1)[0];
        this.blast(q.col, q.row, q.power, true);
      }
    }
    for (i = this.flames.length - 1; i >= 0; i--) {
      this.flames[i].t += dt;
      if (this.flames[i].t >= this.flames[i].life) this.flames.splice(i, 1);
    }

    if (p.alive) {
      this.checkButtons();
      this.checkItems();
      this.checkPassed();
    }

    // ---- カメラ：常に下へ。戻ることはない ----
    var target = p.y - H * 0.34 + BM.clamp(p.vy * 0.10, 0, 90);
    this.camY = Math.max(this.camY, BM.damp(this.camY, target, 9, dt));
    this.world.prune(BM.rowOf(this.camY));

    // ---- 地層帯の切り替わり ----
    var zi = Math.min(BM.ZONES.length - 1, Math.floor(p.deepest / BM.ZONE_ROWS));
    if (zi !== this.zoneIndex) {
      this.zoneIndex = zi;
      BM.ui.banner(BM.ZONES[zi].name + ' ' + (zi * BM.ZONE_ROWS) + 'm');
      this.fx.addFlash(0.2, '255,255,255');
      BM.sound.zone();
    }

    this.score = Math.max(this.score, p.deepest * 10);
    this.fx.update(dt);
    BM.ui.syncHud(this);
  };

  /* =========================================================
     爆弾と破壊
     ========================================================= */

  Game.prototype.dropBomb = function (p) {
    if (p.bombs <= 0) { BM.sound.empty(); return false; }
    p.bombs--;
    p.nozzle = 1;
    this.bombs.push(new BM.Bomb(p.x, p.y + 14, p.power, false));
    BM.sound.drop();
    this.fx.sparkle(p.x, p.y + 16, '#ffd23d');
    return true;
  };

  Game.prototype.explode = function (bomb, col, row) {
    this.blast(BM.colOf(bomb.x), row, bomb.power, bomb.fromButton);
  };

  /* 十字に掘る。壁は壊れない。埋まった爆弾は誘爆する。 */
  Game.prototype.blast = function (col, row, power, quiet) {
    var dug = 0, chained = 0;
    var self = this;

    function hit(c, r) {
      if (c < L || c > R) return 'wall';
      var t = self.world.tileAt(c, r);
      self.flames.push({ col: c, row: r, t: 0, life: BM.FLAME_LIFE });
      if (t === BM.T_BOMB) {
        self.world.setTile(c, r, BM.T_EMPTY);
        self.pending.push({ col: c, row: r, power: power + 1, t: BM.CHAIN_DELAY });
        chained++;
        return 'bomb';
      }
      if (t !== BM.T_EMPTY) {
        self.world.setTile(c, r, BM.T_EMPTY);
        self.rubble(c, r);
        dug++;
      }
      return 'ok';
    }

    hit(col, row);
    for (var d = 0; d < 4; d++) {
      for (var i = 1; i <= power; i++) {
        var c = col + BM.DIRS[d].x * i, r = row + BM.DIRS[d].y * i;
        if (hit(c, r) === 'wall') break;
      }
    }

    var px = BM.centerX(col), py = BM.centerY(row);
    this.fx.explosionBurst(px, py, power);
    this.fx.addShake(5 + power);
    this.fx.addFlash(0.12, '255,190,120');
    this.fx.addAberration(1.6);
    this.hitStop = Math.max(this.hitStop, 0.04);
    BM.sound.explosion(power);

    if (chained) {
      this.chain++;
      this.chainT = 1.0;
      var bonus = 300 * this.chain * chained;
      this.score += bonus;
      this.fx.text(px, py - 18, '誘爆 +' + bonus, '#ffd23d', 17);
      if (this.chain >= 2) BM.ui.banner(this.chain + ' 連鎖!!');
      BM.sound.chain(this.chain);
    } else if (dug && !quiet) {
      this.score += dug * 15;
    }
    return dug;
  };

  Game.prototype.rubble = function (col, row) {
    var z = BM.ZONES[this.zoneIndex];
    this.fx.blockShatter(BM.centerX(col), BM.centerY(row), [z.rock, z.rockDeep, z.accent, '#ffffff']);
  };

  Game.prototype.smash = function (col, row) {
    this.world.setTile(col, row, BM.T_EMPTY);
    this.rubble(col, row);
    this.fx.addShake(4);
    this.fx.addFlash(0.06, '255,255,255');
    this.hitStop = Math.max(this.hitStop, 0.03);
    this.score += 30;
    BM.sound.crack();
  };

  Game.prototype.shieldBreak = function (p, col, row) {
    this.blast(col, row, 2, true);
    this.fx.shock(p.x, p.y, 80, 0.5, '140,232,255', 5);
    this.fx.text(p.x, p.y - 26, 'シールド!', '#8ce8ff', 17);
    this.fx.addShake(10);
    BM.sound.shield();
  };

  Game.prototype.crash = function (p, col, row) {
    p.alive = false;
    this.crashCell = { col: col, row: row };
    this.fx.addShake(22);
    this.fx.addFlash(0.55, '255,70,50');
    this.fx.addAberration(5);
    this.fx.vignette = 1;
    this.fx.explosionBurst(p.x, p.y, 4);
    this.fx.spawn(26, {
      x: p.x, y: p.y, jitter: 6, speedMin: 60, speedMax: 260,
      rMin: 2, rMax: 5, lifeMin: 0.3, lifeMax: 0.8, drag: 2.4, gravity: 420,
      colors: ['#e8ecf6', '#b9c2d6', '#ff7a3c'], glow: false
    });
    this.hitStop = 0.3;
    BM.sound.crash();
    this.gameOver();
  };

  Game.prototype.gameOver = function () {
    this.state = BM.S_OVER;
    this.stateT = 0;
    var d = this.player.deepest;
    this.score += this.player.bombs * 100;
    this.newBestDepth = d > this.bestDepth;
    this.newBestScore = this.score > this.bestScore;
    if (this.newBestDepth) { this.bestDepth = d; BM.store.set('deepfall.best', String(d)); }
    if (this.newBestScore) { this.bestScore = this.score; BM.store.set('deepfall.bestScore', String(this.score)); }
    BM.sound.stopMusic();
    BM.ui.showGameOver(this);
  };

  /* =========================================================
     ボタン / アイテム / 通過判定
     ========================================================= */

  Game.prototype.buttonPos = function (b) {
    // 壁の内側の面に貼り付いている
    var x = b.side < 0 ? L * TILE + 8 : (R + 1) * TILE - 8;
    return { x: x, y: BM.centerY(b.row) };
  };

  Game.prototype.checkButtons = function () {
    var p = this.player;
    for (var i = 0; i < this.world.layers.length; i++) {
      var list = this.world.layers[i].buttons;
      if (!list) continue;
      for (var j = 0; j < list.length; j++) {
        var b = list[j];
        if (b.hit) continue;
        var pos = this.buttonPos(b);
        if (Math.abs(p.x - pos.x) < p.r + 14 && Math.abs(p.y - pos.y) < p.r + 16) {
          b.hit = true;
          b.t = 0;
          // 押した瞬間に爆弾が落ちる。プレイヤーより速いので必ず先に穴が開く
          this.bombs.push(new BM.Bomb(BM.centerX(b.col), pos.y + 12, p.power + 1, true));
          this.fx.shock(pos.x, pos.y, 70, 0.4, '120,255,180', 4);
          this.fx.text(pos.x, pos.y - 24, 'ON', '#8affd0', 18);
          this.fx.addShake(5);
          this.score += 150;
          BM.sound.button();
        }
      }
    }
  };

  Game.prototype.checkItems = function () {
    var p = this.player;
    for (var i = 0; i < this.world.layers.length; i++) {
      var it = this.world.layers[i].item;
      if (!it || !it.alive) continue;
      var ix = BM.centerX(it.col), iy = BM.centerY(it.row);
      if (Math.abs(p.x - ix) < p.r + 14 && Math.abs(p.y - iy) < p.r + 14) {
        it.alive = false;
        var def = BM.ITEMS[it.type];
        switch (it.type) {
          case 'BOMB':   p.bombs = Math.min(BM.MAX_BOMBS, p.bombs + 1); break;
          case 'POWER':  p.power = Math.min(BM.MAX_POWER, p.power + 1); break;
          case 'SHIELD': p.shield = Math.min(3, p.shield + 1); break;
          case 'SLOW':   p.slow = 3.5; break;
        }
        this.score += 100;
        this.fx.text(ix, iy - 14, def.label, def.color, 15);
        this.fx.sparkle(ix, iy, def.color);
        BM.sound.pickup();
      }
    }
  };

  Game.prototype.checkPassed = function () {
    var p = this.player;
    for (var i = 0; i < this.world.layers.length; i++) {
      var l = this.world.layers[i];
      if (l.passed) continue;
      if (p.y > (l.row + 1) * TILE) {
        l.passed = true;
        this.score += 50;
        // ぎりぎりを抜けたら褒める
        var col = BM.colOf(p.x);
        var narrow = this.gapWidthAround(l, col);
        if (narrow === 1) {
          this.score += 200;
          this.fx.text(p.x, p.y - 30, 'ナイス!', '#8affd0', 17);
          BM.sound.nice();
        }
      }
    }
  };

  Game.prototype.gapWidthAround = function (layer, col) {
    if (!layer.cells) return 9;
    var n = 1, c;
    for (c = col - 1; c >= L && layer.cells[c] === BM.T_EMPTY; c--) n++;
    for (c = col + 1; c <= R && layer.cells[c] === BM.T_EMPTY; c++) n++;
    return n;
  };

  /* =========================================================
     描画
     ========================================================= */

  Game.prototype.render = function () {
    var g = this.bctx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    var z = BM.ZONES[this.zoneIndex];

    this.drawBackground(g, z);
    g.save();
    g.translate(0, -this.camY);
    this.fx.drawBelow(g);
    this.drawWalls(g, z);
    this.drawLayers(g, z);
    this.drawItems(g);
    this.drawButtons(g);
    this.drawBombs(g);
    this.drawPlayer(g);
    this.drawFlames(g);
    this.fx.drawAbove(g);
    g.restore();
    this.drawDepthRail(g, z);
    this.drawVignette(g);

    var ctx = this.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#05040a';
    ctx.fillRect(0, 0, W, H);
    var ox = this.fx.offsetX(), oy = this.fx.offsetY();
    var ab = this.fx.aberration;
    if (ab > 0.4) {
      ctx.globalCompositeOperation = 'lighter';
      this.drawChannel(ctx, '#ff0000', ox - ab, oy);
      this.drawChannel(ctx, '#00ffff', ox + ab, oy);
      ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.drawImage(this.buf, ox, oy);
    }
    if (this.fx.flash > 0.002) {
      ctx.fillStyle = 'rgba(' + this.fx.flashColor + ',' + (this.fx.flash * 0.75).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  };

  Game.prototype.drawChannel = function (ctx, color, x, y) {
    var t = this.tctx;
    t.setTransform(1, 0, 0, 1, 0, 0);
    t.globalCompositeOperation = 'source-over';
    t.clearRect(0, 0, W, H);
    t.drawImage(this.buf, 0, 0);
    t.globalCompositeOperation = 'multiply';
    t.fillStyle = color;
    t.fillRect(0, 0, W, H);
    t.globalCompositeOperation = 'source-over';
    ctx.drawImage(this.tmp, x, y);
  };

  Game.prototype.drawBackground = function (g, z) {
    var gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, z.bg1);
    gr.addColorStop(1, z.bg2);
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);

    // 奥の地層（視差）
    g.save();
    g.globalAlpha = 0.5;
    var par = this.camY * 0.35;
    for (var i = -1; i < 14; i++) {
      var y = ((i * 78 - par) % (H + 160) + H + 160) % (H + 160) - 80;
      g.fillStyle = 'rgba(255,255,255,.022)';
      g.fillRect(0, y, W, 34);
      g.fillStyle = 'rgba(0,0,0,.10)';
      g.fillRect(0, y + 34, W, 8);
    }
    g.restore();

    // 上へ流れる塵。落ちている感じはこれが一番効く
    var spd = BM.clamp(this.player.vy, 0, 900);
    for (var d = 0; d < this.bgDust.length; d++) {
      var p = this.bgDust[d];
      p.y -= (30 + spd * p.s) * 0.016;
      if (p.y < -6) { p.y = H + 6; p.x = Math.random() * W; }
      g.fillStyle = 'rgba(255,255,255,' + (0.05 + p.s * 0.08).toFixed(3) + ')';
      g.fillRect(p.x, p.y, p.r, p.r * (1 + spd * 0.012));
    }
  };

  Game.prototype.drawWalls = function (g, z) {
    var top = Math.floor(this.camY / TILE) - 1;
    var bot = top + BM.VIEW_ROWS + 3;
    for (var row = top; row <= bot; row++) {
      this.drawRock(g, L - 1, row, z, true);
      this.drawRock(g, R + 1, row, z, true);
    }
    // 内壁のふち
    g.fillStyle = 'rgba(0,0,0,.4)';
    g.fillRect(L * TILE - 4, top * TILE, 4, (bot - top + 3) * TILE);
    g.fillRect((R + 1) * TILE, top * TILE, 4, (bot - top + 3) * TILE);
  };

  Game.prototype.drawRock = function (g, col, row, z, isWall) {
    var px = col * TILE, py = row * TILE;
    var d = ((col * 31 + row * 57) % 100) / 100;
    g.fillStyle = z.rockDeep;
    g.fillRect(px, py, TILE, TILE);
    var gr = g.createLinearGradient(px, py, px, py + TILE);
    gr.addColorStop(0, z.rock);
    gr.addColorStop(1, z.rockDeep);
    g.fillStyle = gr;
    g.fillRect(px, py, TILE, TILE - 3);
    g.fillStyle = 'rgba(255,255,255,.10)';
    g.fillRect(px, py, TILE, 2.5);
    g.fillStyle = 'rgba(0,0,0,.32)';
    g.fillRect(px, py + TILE - 4, TILE, 4);
    g.fillStyle = 'rgba(255,255,255,' + (0.04 + d * 0.06).toFixed(3) + ')';
    g.beginPath(); g.arc(px + 9 + d * 18, py + 12 + d * 14, 2 + d * 1.6, 0, 6.3); g.fill();
    if (!isWall) {
      g.strokeStyle = 'rgba(0,0,0,.35)';
      g.lineWidth = 1;
      g.strokeRect(px + .5, py + .5, TILE - 1, TILE - 1);
    }
  };

  Game.prototype.drawLayers = function (g, z) {
    var top = Math.floor(this.camY / TILE) - 2;
    var bot = top + BM.VIEW_ROWS + 4;
    for (var i = 0; i < this.world.layers.length; i++) {
      var l = this.world.layers[i];
      if (l.row < top || l.row > bot || !l.cells) continue;
      for (var c = L; c <= R; c++) {
        var t = l.cells[c];
        if (t === BM.T_EMPTY) continue;
        if (t === BM.T_ROCK) this.drawRock(g, c, l.row, z, false);
        else if (t === BM.T_CRACK) this.drawCrack(g, c, l.row, z);
        else if (t === BM.T_BOMB) this.drawBombRock(g, c, l.row, z);
      }
      // 動く地層は縁を光らせて「これは動く」と分かるようにする
      if (l.dynamic) {
        g.strokeStyle = 'rgba(255,220,120,.5)';
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(L * TILE, l.row * TILE + 1);
        g.lineTo((R + 1) * TILE, l.row * TILE + 1);
        g.stroke();
      }
    }
  };

  Game.prototype.drawCrack = function (g, col, row, z) {
    var px = col * TILE, py = row * TILE;
    var d = ((col * 17 + row * 41) % 100) / 100;
    var gr = g.createLinearGradient(px, py, px, py + TILE);
    gr.addColorStop(0, '#8d7a5e');
    gr.addColorStop(1, '#5a4a33');
    g.fillStyle = gr;
    g.fillRect(px, py, TILE, TILE);
    g.fillStyle = 'rgba(255,240,200,.14)';
    g.fillRect(px, py, TILE, 2.5);
    g.strokeStyle = 'rgba(20,12,6,.75)';
    g.lineWidth = 1.8;
    g.beginPath();
    g.moveTo(px + 4, py + 8 + d * 6);
    g.lineTo(px + 16 + d * 8, py + 20);
    g.lineTo(px + 10, py + 32);
    g.moveTo(px + 20 + d * 6, py + 4);
    g.lineTo(px + 26, py + 18 + d * 8);
    g.lineTo(px + 36, py + 30);
    g.stroke();
    g.strokeStyle = 'rgba(0,0,0,.3)';
    g.lineWidth = 1;
    g.strokeRect(px + .5, py + .5, TILE - 1, TILE - 1);
  };

  Game.prototype.drawBombRock = function (g, col, row, z) {
    this.drawRock(g, col, row, z, false);
    var cx = BM.centerX(col), cy = BM.centerY(row);
    var pulse = 0.6 + Math.sin(this.world.t * 6 + col) * 0.4;
    g.save();
    g.globalCompositeOperation = 'lighter';
    var gr = g.createRadialGradient(cx, cy, 1, cx, cy, 20);
    gr.addColorStop(0, 'rgba(255,120,60,' + (0.5 * pulse).toFixed(2) + ')');
    gr.addColorStop(1, 'rgba(255,80,30,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(cx, cy, 20, 0, 6.3); g.fill();
    g.restore();
    g.fillStyle = '#14101f';
    g.beginPath(); g.arc(cx, cy + 1, 10, 0, 6.3); g.fill();
    g.strokeStyle = 'rgba(255,140,70,' + (0.5 + pulse * 0.5).toFixed(2) + ')';
    g.lineWidth = 2;
    g.stroke();
    g.strokeStyle = '#c9b28a'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx + 4, cy - 8); g.quadraticCurveTo(cx + 10, cy - 14, cx + 7, cy - 18); g.stroke();
  };

  Game.prototype.drawButtons = function (g) {
    for (var i = 0; i < this.world.layers.length; i++) {
      var l = this.world.layers[i];
      if (!l.buttons) continue;
      for (var bi = 0; bi < l.buttons.length; bi++) {
      var b = l.buttons[bi], pos = this.buttonPos(b);
      var pulse = 0.5 + Math.sin(this.world.t * 7) * 0.5;

      // 対応する地層まで伸びる導線。押すと何が起きるかを見せる
      g.save();
      g.setLineDash([5, 7]);
      g.lineDashOffset = -this.world.t * 26;
      g.strokeStyle = b.hit ? 'rgba(140,255,200,.55)' : 'rgba(255,120,110,' + (0.22 + pulse * 0.2).toFixed(2) + ')';
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(BM.centerX(b.col), pos.y);
      g.lineTo(BM.centerX(b.col), l.row * TILE);
      g.stroke();
      g.restore();

      // 台座
      g.fillStyle = '#241d33';
      g.beginPath();
      BM.roundRect(g, pos.x - 9, pos.y - 13, 18, 26, 5);
      g.fill();
      g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1.5; g.stroke();

      // ボタン本体
      var col = b.hit ? '#6bffb0' : '#ff5a4e';
      g.save();
      g.globalCompositeOperation = 'lighter';
      var gr = g.createRadialGradient(pos.x, pos.y, 1, pos.x, pos.y, 22);
      gr.addColorStop(0, hexA(col, b.hit ? 0.6 : (0.35 + pulse * 0.35)));
      gr.addColorStop(1, hexA(col, 0));
      g.fillStyle = gr;
      g.beginPath(); g.arc(pos.x, pos.y, 22, 0, 6.3); g.fill();
      g.restore();
      g.fillStyle = col;
      g.beginPath(); g.arc(pos.x, pos.y, b.hit ? 5.5 : 7, 0, 6.3); g.fill();
      g.fillStyle = 'rgba(255,255,255,.75)';
      g.beginPath(); g.arc(pos.x - 2, pos.y - 2.5, 2, 0, 6.3); g.fill();
      }
    }
  };

  Game.prototype.drawItems = function (g) {
    for (var i = 0; i < this.world.layers.length; i++) {
      var it = this.world.layers[i].item;
      if (!it || !it.alive) continue;
      var def = BM.ITEMS[it.type];
      var x = BM.centerX(it.col), y = BM.centerY(it.row) + Math.sin(this.world.t * 3 + it.col) * 4;
      g.save();
      g.translate(x, y);
      g.globalCompositeOperation = 'lighter';
      var gr = g.createRadialGradient(0, 0, 2, 0, 0, 24);
      gr.addColorStop(0, hexA(def.color, 0.5));
      gr.addColorStop(1, hexA(def.color, 0));
      g.fillStyle = gr;
      g.beginPath(); g.arc(0, 0, 24, 0, 6.3); g.fill();
      g.globalCompositeOperation = 'source-over';
      g.beginPath(); BM.roundRect(g, -13, -13, 26, 26, 8); g.fillStyle = 'rgba(16,10,28,.92)'; g.fill();
      g.strokeStyle = def.color; g.lineWidth = 2; g.stroke();
      g.font = '15px system-ui, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(def.glyph, 0, 1);
      g.restore();
    }
  };

  Game.prototype.drawBombs = function (g) {
    for (var i = 0; i < this.bombs.length; i++) {
      var b = this.bombs[i];
      g.save();
      g.translate(b.x, b.y);
      // 落下の尾
      var tg = g.createLinearGradient(0, -34, 0, 0);
      tg.addColorStop(0, 'rgba(255,160,60,0)');
      tg.addColorStop(1, 'rgba(255,180,80,.5)');
      g.fillStyle = tg;
      g.beginPath(); BM.roundRect(g, -4, -34, 8, 34, 4); g.fill();

      var r = 11;
      var gr = g.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
      gr.addColorStop(0, '#5b5470');
      gr.addColorStop(0.45, '#241f33');
      gr.addColorStop(1, '#0d0a16');
      g.fillStyle = gr;
      g.beginPath(); g.arc(0, 0, r, 0, 6.3); g.fill();
      g.strokeStyle = b.fromButton ? 'rgba(120,255,180,.9)' : 'rgba(255,180,80,.8)';
      g.lineWidth = 2;
      g.beginPath(); g.arc(0, 0, r - 1, 0, 6.3); g.stroke();
      g.globalCompositeOperation = 'lighter';
      var sg = g.createRadialGradient(0, -r - 4, 0, 0, -r - 4, 9);
      sg.addColorStop(0, 'rgba(255,255,220,.95)');
      sg.addColorStop(1, 'rgba(255,120,20,0)');
      g.fillStyle = sg;
      g.beginPath(); g.arc(0, -r - 4, 9, 0, 6.3); g.fill();
      g.restore();
    }
  };

  Game.prototype.drawFlames = function (g) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (var i = 0; i < this.flames.length; i++) {
      var f = this.flames[i];
      var k = f.t / f.life;
      var scale = k < 0.16 ? (k / 0.16) : (1 - Math.pow((k - 0.16) / 0.84, 1.7) * 0.85);
      var a = k < 0.16 ? 1 : (1 - Math.pow((k - 0.16) / 0.84, 2));
      var x = BM.centerX(f.col), y = BM.centerY(f.row);
      var half = TILE * 0.5 * BM.clamp(scale, 0, 1);
      var gr = g.createRadialGradient(x, y, 0, x, y, half * 1.5);
      gr.addColorStop(0, 'rgba(255,255,240,' + (a * 0.95).toFixed(3) + ')');
      gr.addColorStop(0.35, 'rgba(255,214,90,' + (a * 0.8).toFixed(3) + ')');
      gr.addColorStop(0.7, 'rgba(255,110,40,' + (a * 0.5).toFixed(3) + ')');
      gr.addColorStop(1, 'rgba(255,40,10,0)');
      g.fillStyle = gr;
      g.beginPath(); BM.roundRect(g, x - half, y - half, half * 2, half * 2, half * 0.45); g.fill();
    }
    g.restore();
  };

  Game.prototype.drawPlayer = function (g) {
    var p = this.player;
    if (!p.alive) return;

    // 残像
    for (var i = 0; i < p.trail.length; i++) {
      var tr = p.trail[i];
      var a = (1 - tr.t / 0.28) * 0.22 * BM.clamp(p.vy / 400, 0.3, 1);
      g.save();
      g.globalAlpha = a;
      g.fillStyle = '#8fd6ff';
      g.beginPath(); BM.roundRect(g, tr.x - 9, tr.y - 12, 18, 24, 6); g.fill();
      g.restore();
    }

    // 着地予測線。どこへ落ちるかが常に見えていないと理不尽になる
    var col = BM.colOf(p.x);
    var landRow = -1;
    for (var r = BM.rowOf(p.y) + 1; r < BM.rowOf(p.y) + 26; r++) {
      if (this.world.tileAt(col, r) !== BM.T_EMPTY) { landRow = r; break; }
    }
    if (landRow > 0) {
      g.save();
      g.setLineDash([3, 9]);
      g.lineDashOffset = -this.world.t * 40;
      g.strokeStyle = 'rgba(255,90,70,.5)';
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(p.x, p.y + 16);
      g.lineTo(p.x, landRow * TILE);
      g.stroke();
      g.restore();
    }

    g.save();
    g.translate(p.x, p.y);
    g.rotate(p.lean * 0.28);
    var stretch = 1 + BM.clamp(p.vy / 1400, 0, 0.3);

    if (p.shield > 0) {
      g.save();
      g.globalCompositeOperation = 'lighter';
      g.strokeStyle = 'rgba(140,232,255,' + (0.4 + Math.sin(p.spin * 3) * 0.2).toFixed(2) + ')';
      g.lineWidth = 2.5;
      g.beginPath(); g.arc(0, 0, 20, 0, 6.3); g.stroke();
      g.restore();
    }

    g.scale(1 / stretch, stretch);

    // 安定翼
    g.fillStyle = '#2c2440';
    g.beginPath();
    g.moveTo(-10, 2); g.lineTo(-16, 12); g.lineTo(-9, 11); g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(10, 2); g.lineTo(16, 12); g.lineTo(9, 11); g.closePath(); g.fill();

    // 胴体（タンク）
    var bg = g.createLinearGradient(0, -15, 0, 14);
    bg.addColorStop(0, '#e8ecf6');
    bg.addColorStop(0.55, '#b9c2d6');
    bg.addColorStop(1, '#6f7894');
    g.fillStyle = bg;
    g.beginPath(); BM.roundRect(g, -10, -14, 20, 27, 7); g.fill();
    g.strokeStyle = 'rgba(18,12,34,.7)'; g.lineWidth = 1.8; g.stroke();

    // 覗き窓
    g.save();
    g.beginPath(); BM.roundRect(g, -6.5, -10, 13, 13, 4); g.clip();
    g.fillStyle = '#140f26'; g.fillRect(-8, -12, 16, 18);
    g.fillStyle = '#2b6f9e';
    g.fillRect(-8, -10 + p.lean * 2, 16, 18);
    g.restore();

    // 単眼レンズ。進行方向＝下を向いている
    var lx = p.lean * 2.2;
    g.fillStyle = '#0e0a1c';
    g.beginPath(); g.arc(lx * 0.5, 6, 6, 0, 6.3); g.fill();
    var lg = g.createRadialGradient(lx - 1, 4.5, 0.5, lx, 6, 4.5);
    lg.addColorStop(0, '#ffffff');
    lg.addColorStop(0.4, '#7fe3ff');
    lg.addColorStop(1, '#1a6f9e');
    g.fillStyle = lg;
    g.beginPath(); g.arc(lx, 6, 4.2, 0, 6.3); g.fill();
    g.fillStyle = 'rgba(255,255,255,.9)';
    g.beginPath(); g.arc(lx - 1.3, 4.6, 1.2, 0, 6.3); g.fill();

    // 射出口（爆弾を落とすと反動で沈む）
    var nz = p.nozzle > 0 ? p.nozzle * 3 : 0;
    g.fillStyle = '#39304f';
    g.beginPath(); BM.roundRect(g, -3.5, 12 - nz, 7, 7, 2.5); g.fill();

    if (p.crackHit > 0) {
      g.globalCompositeOperation = 'lighter';
      g.globalAlpha = p.crackHit * 3;
      g.fillStyle = '#ffd7a0';
      g.beginPath(); g.arc(0, 0, 22, 0, 6.3); g.fill();
    }
    g.restore();
  };

  /* 右端の深度計。今どこまで来たかが常時見える */
  Game.prototype.drawDepthRail = function (g, z) {
    g.save();
    var x = W - 3;
    g.fillStyle = 'rgba(0,0,0,.35)';
    g.fillRect(W - 6, 0, 6, H);
    var top = this.camY, bot = this.camY + H;
    for (var m = Math.floor(top / TILE / 10) * 10; m * TILE < bot; m += 10) {
      var y = m * TILE - this.camY;
      if (y < 0 || y > H) continue;
      var major = m % 50 === 0;
      g.fillStyle = major ? hexA(z.accent, 0.9) : 'rgba(255,255,255,.25)';
      g.fillRect(W - (major ? 12 : 7), y, major ? 12 : 7, major ? 2 : 1);
      if (major) {
        g.font = '700 9px system-ui, sans-serif';
        g.textAlign = 'right';
        g.fillStyle = hexA(z.accent, 0.85);
        g.fillText(m + 'm', W - 15, y + 3);
      }
    }
    g.restore();
    void x;
  };

  Game.prototype.drawVignette = function (g) {
    var v = 0.4 + this.fx.vignette * 0.45;
    var gr = g.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.8);
    gr.addColorStop(0, 'rgba(0,0,0,0)');
    gr.addColorStop(1, 'rgba(' + (this.fx.vignette > 0.05 ? '60,0,0' : '0,0,0') + ',' + v.toFixed(2) + ')');
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);
  };

  /* ---------- 小物 ---------- */
  function roundRect(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function hexA(hex, a) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  BM.Game = Game;
  BM.roundRect = roundRect;
})(BM);
</script>
<script>
/* =========================================================
   DEEP FALL — 入力 / UI / メインループ
   ========================================================= */
(function (BM) {
  'use strict';

  /* ---------- 入力 ---------- */
  var input = {
    keys: {},
    just: {},
    pressed: function (k) { return !!this.just[k]; },
    endFrame: function () { this.just = {}; }
  };
  BM.input = input;

  function normKey(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key; }
  var HANDLED = { 'ArrowUp': 1, 'ArrowDown': 1, 'ArrowLeft': 1, 'ArrowRight': 1, ' ': 1, 'Enter': 1 };

  window.addEventListener('keydown', function (e) {
    var k = normKey(e);
    if (HANDLED[k]) e.preventDefault();
    if (!input.keys[k]) input.just[k] = true;
    input.keys[k] = true;
    BM.sound.init();
    onKeyDown(k);
  });
  window.addEventListener('keyup', function (e) { input.keys[normKey(e)] = false; });
  window.addEventListener('blur', function () { input.keys = {}; });

  function bindTouch() {
    var btns = document.querySelectorAll('#touch .tbtn');
    Array.prototype.forEach.call(btns, function (b) {
      var k = b.getAttribute('data-key');
      var down = function (ev) {
        ev.preventDefault();
        BM.sound.init();
        if (!input.keys[k]) input.just[k] = true;
        input.keys[k] = true;
        onKeyDown(k);
      };
      var up = function (ev) { ev.preventDefault(); input.keys[k] = false; };
      b.addEventListener('pointerdown', down);
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('pointerleave', up);
      b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    });
  }

  /* ---------- UI ---------- */
  var el = {};
  var ui = {
    cache: function () {
      el.overlay = document.getElementById('overlay');
      el.panel = document.getElementById('panel');
      el.depth = document.getElementById('hud-depth');
      el.score = document.getElementById('hud-score');
      el.best = document.getElementById('hud-best');
      el.bombs = document.getElementById('hud-bombs');
      el.banner = document.getElementById('combo-banner');
    },
    hide: function () { el.overlay.classList.add('hidden'); },
    show: function (html) { el.panel.innerHTML = html; el.overlay.classList.remove('hidden'); },

    banner: function (text) {
      el.banner.textContent = text;
      el.banner.classList.remove('show');
      void el.banner.offsetWidth;
      el.banner.classList.add('show');
    },
    bump: function (node) { node.classList.remove('bump'); void node.offsetWidth; node.classList.add('bump'); },

    _d: -1, _s: -1, _b: -1,
    reset: function () { this._d = -1; this._s = -1; this._b = -1; },

    syncHud: function (g) {
      var p = g.player;
      if (p.deepest !== this._d) {
        el.depth.innerHTML = p.deepest + '<small>m</small>';
        this._d = p.deepest;
      }
      if (g.score !== this._s) {
        el.score.textContent = g.score.toLocaleString('en-US');
        if (g.score > this._s && this._s >= 0) this.bump(el.score);
        this._s = g.score;
      }
      if (p.bombs !== this._b) {
        el.bombs.textContent = p.bombs > 5
          ? '💣×' + p.bombs
          : (new Array(p.bombs + 1).join('💣') || '—');
        el.bombs.classList.toggle('warn', p.bombs === 0);
        this._b = p.bombs;
      }
      el.best.textContent = g.bestDepth + 'm';
    },

    showTitle: function (g) {
      this.show(
        '<h1>DEEP FALL</h1>' +
        '<div class="sub">落ち続けろ。<b style="color:#ff8a6a">止まった時が終わり。</b></div>' +
        '<div class="menu">' +
        '<button data-act="play">▶ 落ちる</button>' +
        '<button data-act="how">📖 あそびかた</button>' +
        '</div>' +
        '<div class="tips">最高到達 <b>' + g.bestDepth + 'm</b> ／ ハイスコア <b>' +
        g.bestScore.toLocaleString('en-US') + '</b></div>'
      );
    },

    showHow: function () {
      this.show(
        '<h2>あそびかた</h2>' +
        '<div class="tips" style="text-align:left;font-size:12.5px">' +
        '<p><code>←</code> <code>→</code> 横移動 ／ <code>↓</code> 急降下 ／ <code>Space</code> 爆弾を落とす</p>' +
        '<p><b style="color:#ff8a6a">地面に触れた瞬間に終わり。</b>' +
        '止まることは許されていないので、下へ抜ける道を落ちながら作り続ける。<br>' +
        'プレイヤーの真下に伸びる赤い点線が、今のままだとぶつかる場所。</p>' +
        '<p><b>抜け方はいろいろある</b><br>' +
        '・<b>穴</b> … そのまま通す。狭い穴を抜けるとボーナス<br>' +
        '・<b>もろい岩</b>（茶色でひび割れ）… ぶつかれば砕ける。ただし落下が鈍る<br>' +
        '・<b>横に動く穴 / 開閉する穴</b>（上辺が光る層）… 完全には塞がらない。読んで合わせる<br>' +
        '・<b>ボタン</b>（壁の赤いランプ）… 全面岩の層に来たらこれ。落ちながら触れると' +
        '爆弾が落ちて穴が開く。点線が落下地点を教えてくれる<br>' +
        '・<b>埋まった爆弾</b>（オレンジに光る岩）… 自分の爆弾を当てると誘爆して大穴。連鎖ほど高得点<br>' +
        '・<b>自前の爆弾</b> … どの層でも真下に落として掘れる。数は有限なので切り札に</p>' +
        '<p>100m ごとに地層が変わり、落下速度も層の間隔も上がっていく。</p>' +
        '</div>' +
        '<div class="menu"><button data-act="back">◀ もどる</button></div>'
      );
    },

    showPause: function () {
      this.show(
        '<h2>PAUSE</h2>' +
        '<div class="menu">' +
        '<button data-act="resume">▶ 再開</button>' +
        '<button data-act="title">◀ タイトルへ</button>' +
        '</div>' +
        '<div class="tips">音楽 <code>M</code> ／ 効果音 <code>N</code></div>'
      );
    },

    showGameOver: function (g) {
      this.show(
        '<h2 style="color:#ff6a4e">墜落</h2>' +
        '<div class="rows">' +
        '<div class="stat">到達深度 <b style="color:#ffd23d">' + g.player.deepest + 'm</b>' +
        (g.newBestDepth ? ' <span class="blink">最深記録!</span>' : '') + '</div>' +
        '<div class="stat">SCORE <b>' + g.score.toLocaleString('en-US') + '</b>' +
        (g.newBestScore ? ' <span class="blink">更新!</span>' : '') + '</div>' +
        '<div class="stat">これまでの最深 <b>' + g.bestDepth + 'm</b></div>' +
        '</div>' +
        '<div class="menu">' +
        '<button data-act="play">↻ もう一度</button>' +
        '<button data-act="title">◀ タイトルへ</button>' +
        '</div>' +
        '<div class="blink">Space でもう一度</div>'
      );
    }
  };
  BM.ui = ui;

  /* ---------- 進行 ---------- */
  var game;

  function act(name) {
    BM.sound.init();
    switch (name) {
      case 'play':
        ui.reset();
        game.newRun();
        ui.hide();
        BM.sound.startMusic();
        break;
      case 'resume':
        game.state = BM.S_PLAY;
        ui.hide();
        break;
      case 'title':
        game.state = BM.S_TITLE;
        game.stateT = 0;
        BM.sound.stopMusic();
        ui.showTitle(game);
        break;
      case 'how': ui.showHow(); break;
      case 'back': ui.showTitle(game); break;
    }
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    b.blur();   // フォーカスが残ると、ゲーム中の Space でボタンが再発火する
    act(b.getAttribute('data-act'));
  });

  function onKeyDown(k) {
    if (!game) return;
    if (k === 'm') {
      BM.sound.musicOn = !BM.sound.musicOn;
      if (BM.sound.musicOn && game.state === BM.S_PLAY) BM.sound.startMusic();
      else BM.sound.stopMusic();
      return;
    }
    if (k === 'n') { BM.sound.sfxOn = !BM.sound.sfxOn; return; }

    switch (game.state) {
      case BM.S_TITLE:
        if (k === ' ' || k === 'Enter') act('play');
        break;
      case BM.S_PLAY:
        if (k === 'p' || k === 'Escape') { game.state = BM.S_PAUSE; ui.showPause(); }
        break;
      case BM.S_PAUSE:
        if (k === 'p' || k === 'Escape' || k === ' ' || k === 'Enter') act('resume');
        break;
      case BM.S_OVER:
        if ((k === ' ' || k === 'Enter') && game.stateT > 1.2) act('play');
        break;
    }
  }

  /* ---------- ループ ---------- */
  var last = 0;
  function frame(now) {
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
    last = now;
    game.update(dt);
    game.render();
    input.endFrame();
    requestAnimationFrame(frame);
  }

  window.addEventListener('load', function () {
    ui.cache();
    bindTouch();
    game = new BM.Game(document.getElementById('game'));
    BM.game = game;
    ui.showTitle(game);
    requestAnimationFrame(frame);
  });
})(BM);
</script>
</body>
</html>
