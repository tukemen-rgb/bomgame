<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLAST RUSH — 爆風で塗る陣取りアクション</title>
<style>
:root{
  --bg:#0a0710;
  --bg2:#160f22;
  --line:#2c1f45;
  --ink:#f4ecff;
  --dim:#9a86c4;
  --hot:#ff6a3d;
  --hot2:#ffd23d;
  --cool:#3de1ff;
  --p1:#5ad2ff;
  --p2:#ff7ac8;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 50% -10%, #2a1a45 0%, transparent 60%),
    radial-gradient(900px 600px at 90% 110%, #3a1030 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  overflow-x:hidden;
}

#app{
  width:min(640px,100%);
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* ---------- HUD ---------- */
#hud{
  display:flex;
  gap:12px;
  background:linear-gradient(180deg,#1d1430,#130d20);
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 10px;
  box-shadow:0 6px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
}
.hud-cell{display:flex;flex-direction:column;gap:2px;min-width:44px;white-space:nowrap}
.hud-cell:first-child{min-width:78px}
.hud-grow{flex:1;align-items:flex-end;min-width:0}
.hud-label{font-size:9px;letter-spacing:.14em;color:var(--dim)}
.hud-value{
  font-size:18px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(255,210,61,.35);
}
.hud-small{font-size:14px;white-space:nowrap}
.hud-value.warn{color:var(--hot);animation:pulse .6s infinite}
.hud-value.bump{animation:bump .25s ease-out}
@keyframes pulse{50%{opacity:.35}}
@keyframes bump{0%{transform:scale(1.5);color:var(--hot2)}100%{transform:scale(1)}}

/* ---------- ink bar ---------- */
#inkbar{
  background:linear-gradient(180deg,#1d1430,#130d20);
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 10px 6px;
  box-shadow:0 6px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
}
.ink-track{
  position:relative;
  height:16px;
  border-radius:8px;
  background:repeating-linear-gradient(135deg,#241a3b 0 6px,#1e1533 6px 12px);
  overflow:hidden;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6);
}
.ink-fill{
  position:absolute;top:0;bottom:0;width:0;
  transition:width .18s cubic-bezier(.2,.9,.3,1);
}
.ink-1{
  left:0;
  background:linear-gradient(180deg,#7fe4ff,var(--p1) 60%,#1f9fd0);
  box-shadow:0 0 14px rgba(90,210,255,.6);
  border-right:2px solid rgba(255,255,255,.55);
}
.ink-2{
  right:0;
  background:linear-gradient(180deg,#ffa8dc,var(--p2) 60%,#c0439a);
  box-shadow:0 0 14px rgba(255,122,200,.55);
  border-left:2px solid rgba(255,255,255,.5);
}
.ink-target{
  position:absolute;top:-2px;bottom:-2px;width:0;
  border-left:2px dashed rgba(255,255,255,.85);
  display:none;
}
.ink-target span{
  position:absolute;top:-14px;left:3px;
  font-size:8px;letter-spacing:.1em;color:rgba(255,255,255,.8);
  white-space:nowrap;
}
#inkbar.has-target .ink-target{display:block}
#inkbar.reached .ink-1{animation:inkPulse .7s infinite}
@keyframes inkPulse{50%{filter:brightness(1.5)}}
.ink-nums{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:5px;font-size:11px;
}
.ink-num{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.ink-num.n1{color:var(--p1);text-shadow:0 0 10px rgba(90,210,255,.5)}
.ink-num.n2{color:var(--p2);text-shadow:0 0 10px rgba(255,122,200,.45)}
.ink-caption{color:var(--dim);font-size:10px;letter-spacing:.1em}

/* ---------- stage ---------- */
#stage-wrap{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 18px 50px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.03);
  background:#08060e;
  line-height:0;
}
canvas#game{
  display:block;
  width:100%;
  height:auto;
  image-rendering:auto;
  touch-action:none;
}

/* ---------- overlay ---------- */
.overlay{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(8,5,15,.78);
  backdrop-filter:blur(3px);
  line-height:1.5;
  transition:opacity .18s ease;
}
.overlay.hidden{opacity:0;pointer-events:none}
.panel{
  text-align:center;
  padding:22px 26px;
  max-width:88%;
}
.panel h1{
  margin:0 0 4px;
  font-size:clamp(30px,7vw,48px);
  letter-spacing:.06em;
  background:linear-gradient(180deg,#fff3c4,var(--hot2) 45%,var(--hot));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,106,61,.5));
}
.panel h2{margin:0 0 10px;font-size:clamp(20px,5vw,30px);letter-spacing:.05em}
.panel .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.panel .rows{display:flex;flex-direction:column;gap:8px;align-items:center;margin:14px 0}
.panel .stat{font-size:14px;color:var(--dim)}
.panel .stat b{color:var(--ink);font-size:17px}
.blink{animation:pulse 1s infinite;font-weight:700;color:var(--hot2);font-size:14px}

.menu{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.menu button{
  font:inherit;font-weight:700;font-size:15px;
  color:var(--ink);
  background:linear-gradient(180deg,#2a1c45,#1a1130);
  border:1px solid #402f66;
  border-radius:10px;
  padding:11px 18px;
  cursor:pointer;
  transition:transform .08s ease, box-shadow .15s ease, border-color .15s;
}
.menu button:hover,.menu button:focus-visible{
  border-color:var(--hot2);
  box-shadow:0 0 0 1px rgba(255,210,61,.4),0 8px 22px rgba(255,106,61,.25);
  outline:none;
}
.menu button:active{transform:translateY(2px)}
.menu button small{display:block;font-weight:500;font-size:11px;color:var(--dim);margin-top:3px}

.tips{font-size:11.5px;color:var(--dim);margin-top:12px;line-height:1.7}
.tips code{
  background:#241a3b;border:1px solid #392a5c;border-radius:4px;
  padding:1px 5px;font-size:11px;color:#ffe9a8;
}

/* ---------- combo banner ---------- */
#combo-banner{
  position:absolute;left:50%;top:22%;
  transform:translate(-50%,-50%) scale(.6);
  font-size:clamp(22px,6vw,40px);
  font-weight:900;font-style:italic;letter-spacing:.04em;
  color:#fff;
  text-shadow:0 0 18px var(--hot),0 0 40px var(--hot),0 3px 0 #7a1f00;
  opacity:0;pointer-events:none;white-space:nowrap;
  line-height:1;
}
#combo-banner.show{animation:comboPop .85s cubic-bezier(.16,1.1,.3,1) forwards}
@keyframes comboPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(2deg)}
  40%{transform:translate(-50%,-50%) scale(1) rotate(0)}
  75%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}
}

/* ---------- touch ---------- */
#touch{display:none;justify-content:space-between;align-items:center;gap:14px;padding:4px 2px}
.pad{display:flex;flex-direction:column;align-items:center;gap:6px}
.pad-row{display:flex;gap:6px}
.acts{display:flex;gap:10px;align-items:center}
.tbtn{
  width:56px;height:56px;border-radius:14px;
  font-size:19px;font-weight:800;
  color:var(--ink);
  background:linear-gradient(180deg,#2a1c45,#160f28);
  border:1px solid #402f66;
  user-select:none;-webkit-user-select:none;touch-action:none;
}
.tbtn.big{width:76px;height:76px;font-size:30px;border-color:var(--hot)}
.tbtn:active{background:#3d2a63;transform:scale(.94)}
@media (hover:none) and (pointer:coarse){ #touch{display:flex} #legend{display:none} }

/* ---------- legend ---------- */
#legend{
  display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;
  font-size:11px;color:var(--dim);
}
#legend b{color:#ffe9a8;font-weight:700}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💣</text></svg>">
</head>
<body>
<div id="app">

  <header id="hud">
    <div class="hud-cell"><span class="hud-label">SCORE</span><span id="hud-score" class="hud-value">0</span></div>
    <div class="hud-cell"><span class="hud-label">STAGE</span><span id="hud-stage" class="hud-value">1</span></div>
    <div class="hud-cell"><span class="hud-label">TIME</span><span id="hud-time" class="hud-value">200</span></div>
    <div class="hud-cell"><span class="hud-label">LIFE</span><span id="hud-life" class="hud-value">♥♥♥</span></div>
    <div class="hud-cell hud-grow"><span class="hud-label">POWER</span><span id="hud-power" class="hud-value hud-small">💣1 🔥1</span></div>
  </header>

  <div id="inkbar" title="塗り面積">
    <div class="ink-track">
      <div class="ink-fill ink-1" id="ink-1"></div>
      <div class="ink-fill ink-2" id="ink-2"></div>
      <div class="ink-target" id="ink-target"><span>ノルマ</span></div>
    </div>
    <div class="ink-nums">
      <span class="ink-num n1" id="ink-num-1">0%</span>
      <span class="ink-caption" id="ink-caption">塗り面積</span>
      <span class="ink-num n2" id="ink-num-2">0%</span>
    </div>
  </div>

  <div id="stage-wrap">
    <canvas id="game" width="600" height="520"></canvas>

    <div id="overlay" class="overlay">
      <div class="panel" id="panel"></div>
    </div>

    <div id="combo-banner"></div>
  </div>

  <div id="touch" aria-hidden="true">
    <div class="pad">
      <button class="tbtn" data-key="ArrowUp">▲</button>
      <div class="pad-row">
        <button class="tbtn" data-key="ArrowLeft">◀</button>
        <button class="tbtn" data-key="ArrowDown">▼</button>
        <button class="tbtn" data-key="ArrowRight">▶</button>
      </div>
    </div>
    <div class="acts">
      <button class="tbtn big" data-key=" ">💣</button>
      <button class="tbtn" data-key="Enter">起爆</button>
    </div>
  </div>

  <footer id="legend">
    <span><b>1P</b> ←↑↓→ 移動 / <b>Space</b> 爆弾 / <b>Enter</b> 起爆</span>
    <span><b>2P</b> WASD 移動 / <b>F</b> 爆弾 / <b>G</b> 起爆</span>
    <span><b>P</b> ポーズ / <b>M</b> 音楽 / <b>N</b> 効果音</span>
  </footer>

</div>

<script>
/* =========================================================
   BLAST RUSH — 定数・共通ユーティリティ
   ========================================================= */
var BM = window.BM || {};

BM.TILE = 40;
BM.COLS = 15;
BM.ROWS = 13;
BM.BOARD_W = BM.COLS * BM.TILE; // 600
BM.BOARD_H = BM.ROWS * BM.TILE; // 520

/* タイル種別 */
BM.T_EMPTY = 0; // 床
BM.T_WALL  = 1; // 硬い壁（破壊不可）
BM.T_BLOCK = 2; // ソフトブロック（破壊可）

/* ゲーム状態 */
BM.S_TITLE   = 'title';
BM.S_PLAY    = 'play';
BM.S_CLEAR   = 'clear';
BM.S_DEAD    = 'dead';     // 残機を失った瞬間の演出
BM.S_OVER    = 'over';
BM.S_PAUSE   = 'pause';
BM.S_VSROUND = 'vsround';

/* アイテム種別 */
BM.ITEMS = {
  FIRE:   { key:'FIRE',   label:'火力アップ',   glyph:'🔥', color:'#ff7a3c' },
  BOMB:   { key:'BOMB',   label:'爆弾アップ',   glyph:'💣', color:'#cfd4ff' },
  SPEED:  { key:'SPEED',  label:'スピードアップ', glyph:'⚡', color:'#ffe14d' },
  KICK:   { key:'KICK',   label:'キック',       glyph:'🦵', color:'#8affa0' },
  PIERCE: { key:'PIERCE', label:'貫通爆弾',     glyph:'✴',  color:'#ff5ce0' },
  REMOTE: { key:'REMOTE', label:'リモコン',     glyph:'📡', color:'#5ad2ff' },
  HEART:  { key:'HEART',  label:'ライフ',       glyph:'♥',  color:'#ff5470' },
  FULL:   { key:'FULL',   label:'フルファイア', glyph:'☀',  color:'#fff2a8' },
  SHIELD: { key:'SHIELD', label:'シールド',     glyph:'🛡', color:'#a0f0ff' }
};

/* ---------- インク（陣取り） ----------
   このゲームの主役。爆風は「攻撃」であると同時に「塗り」であり、
   勝敗もスコアも塗った面積で決まる。 */
BM.INK_NONE = 0;
BM.TEAMS = {
  1: { id: 1, name: '1P',  ink: '#3fd0ff', deep: '#0f7fb0', glow: '90,210,255' },
  2: { id: 2, name: '2P',  ink: '#ff6fc0', deep: '#a32f78', glow: '255,111,192' }
};
BM.ENEMY_TEAM = 2;               // 1人用では敵チームが 2
BM.INK_SPEED_BONUS   = 0.30;     // 自陣の床は速い
BM.INK_SPEED_PENALTY = -0.26;    // 敵陣の床は遅い
BM.STAIN_INTERVAL = 0.8;         // 敵が床を汚す間隔（秒）
                                 // 速すぎると開始直後から負けている感覚になる。
                                 // 「放置すると削られる」が伝わる最小の速さに留める。
BM.KILL_SPLASH = 2;              // 敵撃破時に飛び散るインクの半径（マス）
BM.DEATH_WIPE = 1;               // やられたとき中立化される自陣の半径

/* ステージのノルマ塗り率 */
BM.targetRatio = function (stage) {
  return BM.clamp(0.55 + Math.min(stage, 10) * 0.015, 0.55, 0.70);
};

/* バランス定数 */
BM.BOMB_FUSE     = 2.2;   // 導火線（秒）
BM.CHAIN_DELAY   = 0.055; // 誘爆までのタメ（連鎖の気持ちよさ）
BM.FLAME_LIFE    = 0.46;  // 爆風の寿命（秒）
BM.BASE_SPEED    = 118;   // px/秒
BM.SPEED_STEP    = 22;
BM.MAX_SPEED_LV  = 5;
BM.MAX_POWER     = 9;
BM.MAX_BOMBS     = 8;
BM.INVULN_TIME   = 2.4;
BM.KICK_SPEED    = 300;
BM.COMBO_WINDOW  = 1.0;

/* ---------- 保存（サンドボックス下では localStorage が例外を投げることがある） ---------- */
BM.store = {
  get: function (k, fallback) {
    try {
      var v = window.localStorage.getItem(k);
      return v == null ? fallback : v;
    } catch (e) { return fallback; }
  },
  set: function (k, v) {
    try { window.localStorage.setItem(k, v); } catch (e) { /* 保存できなくても遊べる */ }
  }
};

/* ---------- 汎用ヘルパ ---------- */
BM.clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
BM.lerp  = function (a, b, t) { return a + (b - a) * t; };
BM.rand  = function (a, b) { return a + Math.random() * (b - a); };
BM.randInt = function (a, b) { return Math.floor(a + Math.random() * (b - a + 1)); };
BM.pick  = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
BM.shuffle = function (arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
};
/* 指数的な追従（フレームレート非依存の lerp） */
BM.damp = function (a, b, lambda, dt) { return BM.lerp(a, b, 1 - Math.exp(-lambda * dt)); };

BM.cellOf  = function (px) { return Math.floor(px / BM.TILE); };
BM.centerOf = function (c) { return c * BM.TILE + BM.TILE / 2; };
BM.key = function (cx, cy) { return cy * BM.COLS + cx; };

BM.DIRS = [
  { x: 1, y: 0, name: 'right' },
  { x: -1, y: 0, name: 'left' },
  { x: 0, y: 1, name: 'down' },
  { x: 0, y: -1, name: 'up' }
];
</script>
<script>
/* =========================================================
   BLAST RUSH — WebAudio による効果音 / BGM 合成
   外部アセット無し。すべてその場で波形を作る。
   ========================================================= */
(function (BM) {
  'use strict';

  function Sound() {
    this.ctx = null;
    this.master = null;
    this.sfxGain = null;
    this.musicGain = null;
    this.noise = null;
    this.sfxOn = true;
    this.musicOn = true;
    this._musicTimer = null;
    this._step = 0;
    this._nextNoteTime = 0;
    this._tempo = 138;
    this._patternIndex = 0;
  }

  Sound.prototype.init = function () {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();

    this.master = this.ctx.createGain();
    this.master.gain.value = 0.55;

    // 全体を軽くコンプレッションして、連鎖爆発でも歪まないように
    var comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 22;
    comp.ratio.value = 8;
    comp.attack.value = 0.003;
    comp.release.value = 0.22;

    this.master.connect(comp);
    comp.connect(this.ctx.destination);

    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.9;
    this.sfxGain.connect(this.master);

    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.28;
    this.musicGain.connect(this.master);

    // ホワイトノイズのバッファを一度だけ作る
    var len = this.ctx.sampleRate * 2;
    var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
  };

  Sound.prototype._now = function () { return this.ctx.currentTime; };

  /* ---------- 低レベルの部品 ---------- */

  Sound.prototype._tone = function (opt) {
    if (!this.ctx || !this.sfxOn) return;
    var t = opt.at || this._now();
    var osc = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    osc.type = opt.type || 'square';
    osc.frequency.setValueAtTime(opt.f0, t);
    if (opt.f1 != null) {
      if (opt.exp) osc.frequency.exponentialRampToValueAtTime(Math.max(1, opt.f1), t + opt.dur);
      else osc.frequency.linearRampToValueAtTime(opt.f1, t + opt.dur);
    }
    var vol = opt.vol == null ? 0.3 : opt.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (opt.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t + opt.dur);
    osc.connect(g);
    g.connect(opt.dest || this.sfxGain);
    osc.start(t);
    osc.stop(t + opt.dur + 0.05);
  };

  Sound.prototype._noiseBurst = function (opt) {
    if (!this.ctx || !this.sfxOn) return;
    var t = opt.at || this._now();
    var src = this.ctx.createBufferSource();
    src.buffer = this.noise;
    src.playbackRate.value = opt.rate || 1;

    var filt = this.ctx.createBiquadFilter();
    filt.type = opt.filter || 'lowpass';
    filt.frequency.setValueAtTime(opt.fStart, t);
    filt.frequency.exponentialRampToValueAtTime(Math.max(60, opt.fEnd), t + opt.dur);
    filt.Q.value = opt.q || 1;

    var g = this.ctx.createGain();
    var vol = opt.vol == null ? 0.4 : opt.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (opt.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + opt.dur);

    src.connect(filt); filt.connect(g); g.connect(this.sfxGain);
    src.start(t, Math.random());
    src.stop(t + opt.dur + 0.05);
  };

  /* ---------- 効果音 ---------- */

  Sound.prototype.place = function () {
    if (!this.ctx) return;
    var t = this._now();
    this._tone({ at: t, type: 'square', f0: 620, f1: 300, dur: 0.09, vol: 0.16, exp: true });
    this._noiseBurst({ at: t, fStart: 2600, fEnd: 700, dur: 0.07, vol: 0.12 });
  };

  Sound.prototype.explosion = function (power) {
    if (!this.ctx) return;
    var t = this._now();
    var p = BM.clamp(power || 1, 1, 6);
    var dur = 0.42 + p * 0.05;
    // ドン（低域のサブ）
    this._tone({ at: t, type: 'sine', f0: 150 + p * 8, f1: 28, dur: dur, vol: 0.5, exp: true, attack: 0.004 });
    // バシャッ（ノイズ）
    this._noiseBurst({ at: t, fStart: 5200, fEnd: 180, dur: dur * 0.9, vol: 0.42, rate: 1.0 });
    // 破片の高域
    this._noiseBurst({ at: t + 0.02, filter: 'highpass', fStart: 900, fEnd: 4200, dur: 0.22, vol: 0.1 });
  };

  Sound.prototype.chain = function (n) {
    if (!this.ctx) return;
    var t = this._now();
    var f = 380 + Math.min(n, 10) * 85;
    this._tone({ at: t, type: 'triangle', f0: f, f1: f * 2, dur: 0.14, vol: 0.22, exp: true });
  };

  Sound.prototype.breakBlock = function () {
    if (!this.ctx) return;
    this._noiseBurst({ fStart: 3000, fEnd: 500, dur: 0.14, vol: 0.16, q: 2 });
  };

  Sound.prototype.pickup = function () {
    if (!this.ctx) return;
    var t = this._now();
    var seq = [523.25, 659.25, 783.99, 1046.5];
    for (var i = 0; i < seq.length; i++) {
      this._tone({ at: t + i * 0.045, type: 'square', f0: seq[i], dur: 0.11, vol: 0.14 });
    }
  };

  Sound.prototype.enemyDie = function () {
    if (!this.ctx) return;
    var t = this._now();
    this._tone({ at: t, type: 'sawtooth', f0: 700, f1: 90, dur: 0.26, vol: 0.2, exp: true });
    this._noiseBurst({ at: t, fStart: 3000, fEnd: 300, dur: 0.2, vol: 0.14 });
  };

  Sound.prototype.hurt = function () {
    if (!this.ctx) return;
    var t = this._now();
    this._tone({ at: t, type: 'sawtooth', f0: 260, f1: 55, dur: 0.6, vol: 0.35, exp: true });
    this._noiseBurst({ at: t, fStart: 1400, fEnd: 120, dur: 0.5, vol: 0.25 });
  };

  Sound.prototype.kick = function () {
    if (!this.ctx) return;
    this._tone({ type: 'square', f0: 200, f1: 520, dur: 0.1, vol: 0.16, exp: true });
  };

  Sound.prototype.doorOpen = function () {
    if (!this.ctx) return;
    var t = this._now();
    [392, 523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      this._tone({ at: t + i * 0.07, type: 'triangle', f0: f, dur: 0.3, vol: 0.16 });
    }, this);
  };

  Sound.prototype.fanfare = function () {
    if (!this.ctx) return;
    var t = this._now();
    var notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5];
    var times = [0, 0.11, 0.22, 0.33, 0.47, 0.58, 0.7];
    for (var i = 0; i < notes.length; i++) {
      this._tone({ at: t + times[i], type: 'square', f0: notes[i], dur: i === notes.length - 1 ? 0.7 : 0.16, vol: 0.2 });
      this._tone({ at: t + times[i], type: 'triangle', f0: notes[i] / 2, dur: 0.2, vol: 0.14 });
    }
  };

  Sound.prototype.gameOver = function () {
    if (!this.ctx) return;
    var t = this._now();
    var notes = [523.25, 466.16, 415.30, 349.23];
    for (var i = 0; i < notes.length; i++) {
      this._tone({ at: t + i * 0.22, type: 'square', f0: notes[i], dur: 0.34, vol: 0.2 });
      this._tone({ at: t + i * 0.22, type: 'sawtooth', f0: notes[i] / 2, dur: 0.34, vol: 0.12 });
    }
  };

  Sound.prototype.blip = function (hi) {
    if (!this.ctx) return;
    this._tone({ type: 'square', f0: hi ? 880 : 520, dur: 0.06, vol: 0.12 });
  };

  Sound.prototype.tick = function () {
    if (!this.ctx) return;
    this._tone({ type: 'square', f0: 1400, dur: 0.04, vol: 0.08 });
  };

  /* ---------- BGM ----------
     16分音符のシーケンサ。ベース + アルペジオ + ドラム。 */

  var SCALE = [0, 3, 5, 7, 10]; // マイナーペンタトニック
  var BASS_PAT = [0, 0, 7, 0, 5, 5, 3, 3];

  Sound.prototype.startMusic = function () {
    if (!this.ctx || !this.musicOn || this._musicTimer) return;
    var self = this;
    this._nextNoteTime = this._now() + 0.08;
    this._step = 0;
    this._musicTimer = setInterval(function () { self._scheduler(); }, 25);
  };

  Sound.prototype.stopMusic = function () {
    if (this._musicTimer) { clearInterval(this._musicTimer); this._musicTimer = null; }
  };

  Sound.prototype.setTempo = function (bpm) { this._tempo = bpm; };

  Sound.prototype._scheduler = function () {
    if (!this.ctx) return;
    var spb = 60 / this._tempo / 4; // 16分音符の長さ
    while (this._nextNoteTime < this._now() + 0.12) {
      this._playStep(this._step, this._nextNoteTime);
      this._nextNoteTime += spb;
      this._step = (this._step + 1) % 32;
    }
  };

  Sound.prototype._midi = function (n) { return 440 * Math.pow(2, (n - 69) / 12); };

  Sound.prototype._musicTone = function (type, freq, at, dur, vol) {
    var osc = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(g); g.connect(this.musicGain);
    osc.start(at); osc.stop(at + dur + 0.03);
  };

  Sound.prototype._musicNoise = function (at, dur, vol, fStart, fEnd) {
    var src = this.ctx.createBufferSource();
    src.buffer = this.noise;
    var f = this.ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.setValueAtTime(fStart, at);
    f.frequency.exponentialRampToValueAtTime(fEnd, at + dur);
    f.Q.value = 1.2;
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    src.connect(f); f.connect(g); g.connect(this.musicGain);
    src.start(at, Math.random()); src.stop(at + dur + 0.02);
  };

  Sound.prototype._playStep = function (step, at) {
    var root = 45; // A2
    // ベース（8分）
    if (step % 2 === 0) {
      var b = BASS_PAT[(step / 2) % 8];
      this._musicTone('triangle', this._midi(root + b), at, 0.16, 0.3);
    }
    // アルペジオ（16分・裏拍で軽く）
    if (step % 2 === 1) {
      var idx = (step * 3) % SCALE.length;
      var oct = (step % 8 < 4) ? 24 : 12;
      this._musicTone('square', this._midi(root + SCALE[idx] + oct), at, 0.09, 0.075);
    }
    // キック
    if (step % 8 === 0 || step % 16 === 11) {
      this._musicTone('sine', 110, at, 0.11, 0.34);
    }
    // ハイハット
    if (step % 2 === 0) this._musicNoise(at, 0.035, 0.05, 7000, 4500);
    // スネア
    if (step % 16 === 8) this._musicNoise(at, 0.11, 0.13, 1900, 700);
  };

  BM.Sound = Sound;
  BM.sound = new Sound();
})(BM);
</script>
<script>
/* =========================================================
   BLAST RUSH — 演出（パーティクル / 画面揺れ / 衝撃波 / 数字）
   「爽快感」はここで作る。
   ========================================================= */
(function (BM) {
  'use strict';

  function FX() {
    this.particles = [];
    this.shocks = [];
    this.texts = [];
    this.shake = 0;
    this.shakeDir = { x: 0, y: 0 };
    this.flash = 0;
    this.flashColor = '255,255,255';
    this.aberration = 0;
    this.vignette = 0;
    this._sx = 0; this._sy = 0;
  }

  FX.prototype.clear = function () {
    this.particles.length = 0;
    this.shocks.length = 0;
    this.texts.length = 0;
    this.shake = 0; this.flash = 0; this.aberration = 0; this.vignette = 0;
  };

  /* ---------- 入力系 ---------- */

  FX.prototype.addShake = function (amount, dx, dy) {
    this.shake = Math.min(26, this.shake + amount);
    if (dx || dy) {
      var l = Math.hypot(dx, dy) || 1;
      this.shakeDir.x = dx / l; this.shakeDir.y = dy / l;
    } else {
      this.shakeDir.x = 0; this.shakeDir.y = 0;
    }
  };

  FX.prototype.addFlash = function (a, color) {
    this.flash = Math.min(1, this.flash + a);
    if (color) this.flashColor = color;
  };

  FX.prototype.addAberration = function (a) {
    // 強すぎると画面が読めなくなるので、上限は小さく・戻りは速く
    this.aberration = Math.min(5, this.aberration + a);
  };

  FX.prototype.shock = function (x, y, maxR, life, color, width) {
    this.shocks.push({
      x: x, y: y, r: 6, maxR: maxR, t: 0, life: life || 0.36,
      color: color || '255,190,90', w: width || 5
    });
  };

  FX.prototype.text = function (x, y, str, color, size, vy) {
    // 連鎖中は同じ場所に何枚も出るので、少しずらして重なりを散らす
    this.texts.push({
      x: x + BM.rand(-9, 9), y: y + BM.rand(-5, 5), s: str, t: 0, life: 0.9,
      color: color || '#ffe14d', size: size || 15, vy: vy == null ? -46 : vy
    });
  };

  FX.prototype.spawn = function (n, opt) {
    for (var i = 0; i < n; i++) {
      var ang = opt.angle != null
        ? opt.angle + BM.rand(-opt.spread, opt.spread)
        : BM.rand(0, Math.PI * 2);
      var sp = BM.rand(opt.speedMin, opt.speedMax);
      this.particles.push({
        x: opt.x + BM.rand(-(opt.jitter || 0), opt.jitter || 0),
        y: opt.y + BM.rand(-(opt.jitter || 0), opt.jitter || 0),
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        g: opt.gravity == null ? 0 : opt.gravity,
        drag: opt.drag == null ? 1.8 : opt.drag,
        r: BM.rand(opt.rMin || 1.5, opt.rMax || 4),
        t: 0,
        life: BM.rand(opt.lifeMin || 0.3, opt.lifeMax || 0.8),
        colors: opt.colors,
        color: BM.pick(opt.colors),
        shape: opt.shape || 'circle',
        rot: BM.rand(0, Math.PI * 2),
        vr: BM.rand(-9, 9),
        glow: opt.glow !== false,
        fade: opt.fade == null ? 1 : opt.fade
      });
    }
  };

  /* ---------- プリセット ---------- */

  FX.prototype.explosionBurst = function (x, y, power) {
    var p = BM.clamp(power, 1, 8);
    this.spawn(16 + p * 3, {
      x: x, y: y, jitter: 6,
      speedMin: 60, speedMax: 240 + p * 22,
      rMin: 2, rMax: 5.5, lifeMin: 0.22, lifeMax: 0.62,
      colors: ['#fff6c8', '#ffd23d', '#ff8a2b', '#ff4d2b'],
      drag: 2.6, gravity: 120
    });
    this.spawn(8, {
      x: x, y: y, jitter: 4,
      speedMin: 20, speedMax: 90,
      rMin: 6, rMax: 13, lifeMin: 0.4, lifeMax: 0.9,
      colors: ['rgba(120,110,130,.55)', 'rgba(80,70,95,.5)', 'rgba(160,150,170,.4)'],
      drag: 3.2, gravity: -40, glow: false
    });
    this.shock(x, y, 44 + p * 12, 0.34, '255,200,110', 5);
  };

  FX.prototype.blockShatter = function (x, y, base) {
    this.spawn(14, {
      x: x, y: y, jitter: 13,
      speedMin: 40, speedMax: 190,
      rMin: 2.5, rMax: 6.5, lifeMin: 0.35, lifeMax: 0.85,
      colors: base || ['#7a5ba8', '#5c4183', '#9a7cc4', '#3d2b5c'],
      drag: 2.2, gravity: 620, shape: 'rect', glow: false
    });
  };

  FX.prototype.enemyPop = function (x, y, color) {
    this.spawn(22, {
      x: x, y: y, jitter: 5,
      speedMin: 50, speedMax: 210,
      rMin: 2, rMax: 5, lifeMin: 0.3, lifeMax: 0.75,
      colors: [color, '#ffffff', '#ffd23d'],
      drag: 2.4, gravity: 260
    });
    this.shock(x, y, 40, 0.3, '255,255,255', 3);
  };

  FX.prototype.sparkle = function (x, y, color) {
    this.spawn(10, {
      x: x, y: y, jitter: 10,
      speedMin: 15, speedMax: 70,
      rMin: 1.2, rMax: 3, lifeMin: 0.4, lifeMax: 0.9,
      colors: [color, '#ffffff'],
      drag: 1.4, gravity: -60
    });
  };

  FX.prototype.dust = function (x, y) {
    this.spawn(3, {
      x: x, y: y, jitter: 4,
      speedMin: 8, speedMax: 40,
      rMin: 1.5, rMax: 3.5, lifeMin: 0.2, lifeMax: 0.45,
      colors: ['rgba(190,175,220,.5)', 'rgba(140,125,175,.4)'],
      drag: 3, gravity: -30, glow: false
    });
  };

  /* ---------- 更新 ---------- */

  FX.prototype.update = function (dt) {
    var i, p;
    for (i = this.particles.length - 1; i >= 0; i--) {
      p = this.particles[i];
      p.t += dt;
      if (p.t >= p.life) { this.particles.splice(i, 1); continue; }
      var d = Math.exp(-p.drag * dt);
      p.vx *= d; p.vy *= d;
      p.vy += p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    for (i = this.shocks.length - 1; i >= 0; i--) {
      var s = this.shocks[i];
      s.t += dt;
      if (s.t >= s.life) { this.shocks.splice(i, 1); continue; }
      var k = s.t / s.life;
      s.r = 6 + (s.maxR - 6) * (1 - Math.pow(1 - k, 2.6));
    }
    for (i = this.texts.length - 1; i >= 0; i--) {
      var t = this.texts[i];
      t.t += dt;
      if (t.t >= t.life) { this.texts.splice(i, 1); continue; }
      t.y += t.vy * dt;
      t.vy *= Math.exp(-2.4 * dt);
    }

    this.shake = Math.max(0, this.shake - dt * (this.shake * 6 + 12));
    this.flash = Math.max(0, this.flash - dt * 4.2);
    this.aberration = Math.max(0, this.aberration - dt * 42);
    this.vignette = Math.max(0, this.vignette - dt * 1.6);

    if (this.shake > 0.05) {
      var mag = this.shake;
      if (this.shakeDir.x || this.shakeDir.y) {
        this._sx = this.shakeDir.x * mag * BM.rand(0.4, 1) + BM.rand(-mag, mag) * 0.35;
        this._sy = this.shakeDir.y * mag * BM.rand(0.4, 1) + BM.rand(-mag, mag) * 0.35;
      } else {
        this._sx = BM.rand(-mag, mag);
        this._sy = BM.rand(-mag, mag);
      }
    } else { this._sx = 0; this._sy = 0; }
  };

  FX.prototype.offsetX = function () { return this._sx; };
  FX.prototype.offsetY = function () { return this._sy; };

  /* ---------- 描画 ---------- */

  FX.prototype.drawBelow = function (ctx) {
    // 衝撃波リング（加算合成）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < this.shocks.length; i++) {
      var s = this.shocks[i];
      var k = s.t / s.life;
      var a = (1 - k) * (1 - k);
      ctx.strokeStyle = 'rgba(' + s.color + ',' + (a * 0.85).toFixed(3) + ')';
      ctx.lineWidth = s.w * (1 - k * 0.65) + 0.4;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  };

  FX.prototype.drawAbove = function (ctx) {
    var i, p, k, a;
    ctx.save();
    // 発光しないパーティクル（瓦礫・煙）
    for (i = 0; i < this.particles.length; i++) {
      p = this.particles[i];
      if (p.glow) continue;
      k = p.t / p.life;
      a = 1 - k * k;
      ctx.globalAlpha = a * p.fade;
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k * 0.35), 0, Math.PI * 2); ctx.fill();
      }
    }
    // 発光パーティクル
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < this.particles.length; i++) {
      p = this.particles[i];
      if (!p.glow) continue;
      k = p.t / p.life;
      a = 1 - k * k;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      var r = p.r * (1 - k * 0.5);
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = a * 0.28;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // 浮かぶ数字・テキスト
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (i = 0; i < this.texts.length; i++) {
      var t = this.texts[i];
      k = t.t / t.life;
      var sc = k < 0.15 ? BM.lerp(1.6, 1, k / 0.15) : 1;
      ctx.globalAlpha = k > 0.6 ? (1 - (k - 0.6) / 0.4) : 1;
      ctx.font = '900 ' + (t.size * sc).toFixed(1) + 'px system-ui, sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.strokeText(t.s, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.s, t.x, t.y);
    }
    ctx.restore();
  };

  BM.FX = FX;
})(BM);
</script>
<script>
/* =========================================================
   BLAST RUSH — ステージ生成 / グリッド探索
   ========================================================= */
(function (BM) {
  'use strict';

  function GameMap() {
    this.w = BM.COLS;
    this.h = BM.ROWS;
    this.tiles = new Uint8Array(this.w * this.h);
    this.ink = new Uint8Array(this.w * this.h);       // 0=中立 / 1=1P / 2=2P・敵
    this.inkT = new Float32Array(this.w * this.h);    // 塗られてからの経過（にじみアニメ）
    this.decor = new Float32Array(this.w * this.h);   // 見た目のバリエーション
    this.paintable = 0;                               // 壁以外のマス数（分母）
  }

  /* ---------- インク ---------- */
  GameMap.prototype.inkAt = function (cx, cy) {
    if (cx < 0 || cy < 0 || cx >= this.w || cy >= this.h) return BM.INK_NONE;
    return this.ink[cy * this.w + cx];
  };

  /* 塗れたら true。壁とソフトブロックの上は塗れない。 */
  GameMap.prototype.paint = function (cx, cy, team) {
    if (cx < 0 || cy < 0 || cx >= this.w || cy >= this.h) return false;
    var i = cy * this.w + cx;
    if (this.tiles[i] !== BM.T_EMPTY) return false;
    var was = this.ink[i];
    this.ink[i] = team;
    this.inkT[i] = 0;
    return was !== team;
  };

  GameMap.prototype.inkCounts = function () {
    var a = 0, b = 0;
    for (var i = 0; i < this.ink.length; i++) {
      if (this.tiles[i] === BM.T_WALL) continue;
      if (this.ink[i] === 1) a++;
      else if (this.ink[i] === 2) b++;
    }
    return { 1: a, 2: b, total: this.paintable };
  };

  GameMap.prototype.ratio = function (team) {
    if (!this.paintable) return 0;
    return this.inkCounts()[team] / this.paintable;
  };

  GameMap.prototype.tickInk = function (dt) {
    for (var i = 0; i < this.inkT.length; i++) {
      if (this.inkT[i] < 1) this.inkT[i] += dt;
    }
  };

  GameMap.prototype.at = function (cx, cy) {
    if (cx < 0 || cy < 0 || cx >= this.w || cy >= this.h) return BM.T_WALL;
    return this.tiles[cy * this.w + cx];
  };
  GameMap.prototype.set = function (cx, cy, v) {
    if (cx < 0 || cy < 0 || cx >= this.w || cy >= this.h) return;
    this.tiles[cy * this.w + cx] = v;
  };
  GameMap.prototype.isWall = function (cx, cy) { return this.at(cx, cy) === BM.T_WALL; };
  GameMap.prototype.isBlock = function (cx, cy) { return this.at(cx, cy) === BM.T_BLOCK; };
  GameMap.prototype.isOpen = function (cx, cy) { return this.at(cx, cy) === BM.T_EMPTY; };

  GameMap.prototype.isFixedWall = function (cx, cy) {
    return cx === 0 || cy === 0 || cx === this.w - 1 || cy === this.h - 1 ||
           (cx % 2 === 0 && cy % 2 === 0);
  };

  /* spawnClear: 開始地点まわりを空けるセルの配列 */
  GameMap.prototype.generate = function (density, spawnClear) {
    var x, y, i;
    this.paintable = 0;
    for (y = 0; y < this.h; y++) {
      for (x = 0; x < this.w; x++) {
        i = y * this.w + x;
        this.tiles[i] = this.isFixedWall(x, y) ? BM.T_WALL : BM.T_EMPTY;
        this.decor[i] = Math.random();
        this.ink[i] = BM.INK_NONE;
        this.inkT[i] = 1;
        if (this.tiles[i] !== BM.T_WALL) this.paintable++;
      }
    }
    var safe = {};
    for (i = 0; i < spawnClear.length; i++) safe[BM.key(spawnClear[i].x, spawnClear[i].y)] = true;

    for (y = 1; y < this.h - 1; y++) {
      for (x = 1; x < this.w - 1; x++) {
        if (this.at(x, y) !== BM.T_EMPTY) continue;
        if (safe[BM.key(x, y)]) continue;
        if (Math.random() < density) this.set(x, y, BM.T_BLOCK);
      }
    }
  };

  GameMap.prototype.freeCells = function (includeBlocks) {
    var out = [];
    for (var y = 1; y < this.h - 1; y++) {
      for (var x = 1; x < this.w - 1; x++) {
        var t = this.at(x, y);
        if (t === BM.T_EMPTY || (includeBlocks && t === BM.T_BLOCK)) out.push({ x: x, y: y });
      }
    }
    return out;
  };

  GameMap.prototype.blockCells = function () {
    var out = [];
    for (var y = 1; y < this.h - 1; y++)
      for (var x = 1; x < this.w - 1; x++)
        if (this.at(x, y) === BM.T_BLOCK) out.push({ x: x, y: y });
    return out;
  };

  /* -------------------------------------------------------
     BFS。passable(cx,cy) が true のセルだけ通れる。
     goal(cx,cy) を満たす最寄りセルへの「最初の一歩」を返す。
     ------------------------------------------------------- */
  GameMap.prototype.bfsStep = function (sx, sy, goal, passable, maxDepth) {
    var W = this.w, H = this.h;
    var total = W * H;
    var prev = new Int32Array(total).fill(-1);
    var seen = new Uint8Array(total);
    var queue = [sy * W + sx];
    seen[sy * W + sx] = 1;
    var depth = new Uint16Array(total);
    var head = 0;
    var found = -1;

    while (head < queue.length) {
      var cur = queue[head++];
      var cx = cur % W, cy = (cur / W) | 0;
      if (!(cx === sx && cy === sy) && goal(cx, cy)) { found = cur; break; }
      if (maxDepth && depth[cur] >= maxDepth) continue;
      for (var d = 0; d < 4; d++) {
        var nx = cx + BM.DIRS[d].x, ny = cy + BM.DIRS[d].y;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        var ni = ny * W + nx;
        if (seen[ni]) continue;
        if (!passable(nx, ny)) continue;
        seen[ni] = 1;
        prev[ni] = cur;
        depth[ni] = depth[cur] + 1;
        queue.push(ni);
      }
    }
    if (found < 0) return null;

    // 経路を戻って最初の一歩を得る
    var node = found;
    var start = sy * W + sx;
    var guard = 0;
    while (prev[node] !== start && prev[node] !== -1 && guard++ < total) node = prev[node];
    if (prev[node] === -1) return null;
    return { x: node % W, y: (node / W) | 0, dist: depth[found] };
  };

  BM.GameMap = GameMap;

  /* =========================================================
     ステージ定義
     ========================================================= */
  BM.stageDef = function (n) {
    var wave = Math.min(n, 12);
    var density = BM.clamp(0.36 + wave * 0.012, 0.36, 0.5);
    var count = 3 + Math.floor((n + 1) / 2);
    var types = [];

    // 序盤はゆるい敵、進むほど賢い敵が混ざる
    var i;
    for (i = 0; i < count; i++) {
      var r = Math.random();
      if (n <= 1) types.push('balloon');
      else if (n <= 3) types.push(r < 0.65 ? 'balloon' : 'chaser');
      else if (n <= 5) types.push(r < 0.4 ? 'balloon' : (r < 0.8 ? 'chaser' : 'ghost'));
      else if (n <= 8) types.push(r < 0.25 ? 'balloon' : (r < 0.6 ? 'chaser' : (r < 0.82 ? 'ghost' : 'bomber')));
      else types.push(r < 0.15 ? 'balloon' : (r < 0.5 ? 'chaser' : (r < 0.75 ? 'ghost' : 'bomber')));
    }
    return {
      stage: n,
      density: density,
      enemies: types,
      time: Math.max(120, 210 - n * 5),
      itemChance: BM.clamp(0.34 - n * 0.008, 0.2, 0.34)
    };
  };
})(BM);
